name: ScanMeet PostgreSQL concurrency
on:
  pull_request:
    paths:
      - 'supabase/migrations/07*.sql'
      - 'deploy/scanmeet_supervision_postgres.py'
      - 'tests/scanmeet_supervision_sql_checks.sql'
      - '.github/workflows/scanmeet-supervision-sql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    name: Native PostgreSQL assignment and handover races
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scanmeet_supervision_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '${{ github.run_id }}-disposable'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scanmeet_supervision_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: scanmeet_supervision_ci
      PGUSER: postgres
      PGPASSWORD: '${{ github.run_id }}-disposable'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the application's pinned Postgres driver
        run: python -m pip install psycopg2-binary==2.9.10
      - name: Execute real migrations, rollback assertions and two-connection races
        run: python -m deploy.scanmeet_supervision_postgres
