name: ScanMeet staging SDK contract
on:
  pull_request:
    paths:
      - 'app/services/livekit_gateway.py'
      - 'app/services/live_policy.py'
      - 'app/routes/live.py'
      - 'app/templates/live/**'
      - 'app/templates/teacher/exam_form.html'
      - 'deploy/livekit_*.py'
      - 'requirements-live.txt'
      - '.github/workflows/scanmeet-sdk.yml'
      - 'tests/unit/test_live_*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-contract:
    name: Real pinned LiveKit SDK + offline staging guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and pinned LiveKit SDK
        run: |
          python -m pip install -r requirements.txt -r requirements-live.txt
          python -m pip check
      - name: Verify actual SDK JWT/grants and admin API URL offline
        run: python -m deploy.livekit_sdk_contract
      - name: Verify isolated LiveKit route, policy and staging guards
        run: |
          # The glob, not a file list: a new tests/unit/test_live_*.py has to run
          # here without anyone remembering to add it to this workflow.
          python -m pytest tests/unit/test_live_*.py -q -ra
          # The committed example is safe by default (both flags OFF).
          # A genuine pilot opts in explicitly; placeholders still fail readiness.
          python - <<'PY'
          from pathlib import Path
          from deploy.livekit_preflight import FLAGS, audit, parse_env
          template = parse_env(Path("deploy/livekit-staging.env.example").read_text(encoding="utf-8"))
          assert all(template.get(flag, "").lower() == "false" for flag in FLAGS)
          assert audit(template) == []
          assert audit({flag: "false" for flag in FLAGS}) == []
          enabled = {**template, **{flag: "true" for flag in FLAGS}}
          assert audit(enabled) == ["Non-pilot configuration must leave Live flags OFF"]
          pilot_findings = audit(enabled, pilot=True)
          assert any("placeholder" in finding for finding in pilot_findings), pilot_findings
          print("PASS: default-OFF template and explicit pilot fail-closed contract")
          PY
