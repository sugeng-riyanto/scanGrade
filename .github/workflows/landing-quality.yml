name: landing quality control

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: landing-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  landing-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Build CSS
        run: npm run css:build
      - name: Check stylesheet freshness without dumping minified CSS
        run: |
          python deploy/css_freshness.py
      - name: Landing claim regression tests
        run: python -m pytest tests/unit/test_landing_ai_claim_honesty.py -q
      - name: Full test suite
        run: python -m pytest tests -q -ra
      - name: Theme gate (includes static claims checks)
        run: bash deploy/theme_gate.sh
      - name: Claims gate wiring (not a production load test)
        run: python deploy/claims_gate.py --check

  offline-env-regressions:
    name: Offline environment-backed regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Deliberately invalid, local-only test credentials; never production secrets.
      SUPABASE_URL: https://example.invalid
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjaS10ZXN0In0.test-only-signature
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjaS10ZXN0In0.test-only-signature
      FLASK_SECRET_KEY: ci-offline-test-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Create disposable environment fixture
        run: |
          touch .env
      - name: Run offline account, anti-cheat and isolation regressions
        run: python -m pytest tests/unit/test_account_creation_orphans.py tests/unit/test_anticheat_seed.py tests/test_rls_security.py tests/unit/test_env_and_email.py -q -ra
      - name: Remove disposable fixture
        if: always()
        run: rm -f .env
