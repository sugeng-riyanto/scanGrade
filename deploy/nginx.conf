# ============================================================
# ScanGrade — NGINX Production Config
# Letak: /etc/nginx/sites-available/scangrade
# ============================================================

upstream scangrade_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS redirect (Certbot compatible)
server {
    listen 80;
    server_name scangrade.web.id www.scangrade.web.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name scangrade.web.id www.scangrade.web.id;

    # ── SSL (managed by Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/scangrade.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scangrade.web.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ── Security Headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # ── Static files (cache 365 hari) ──
    location /static/ {
        root /opt/scangrade/app;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # ── Flask reverse proxy ──
    location / {
        proxy_pass http://scangrade_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Health check ──
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ── Deny hidden files ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
