# ============================================================
# ScanGrade — NGINX Production Config (1000+ concurrent)
# Letak: /etc/nginx/sites-available/scangrade
# ============================================================
# Architecture:
#   Client → Nginx (SSL + static files + rate limit)
#          → Gunicorn (4 gevent workers × 1000 greenlets = 4000 concurrent)
#          → Redis (shared rate limit state)
#          → Supabase (PostgreSQL)
# ============================================================

# Rate limiting zones (belt-and-suspenders with Flask-Limiter)
#
# These zones are keyed on $binary_remote_addr because no user identity exists
# before authentication. A school normally reaches the internet through ONE
# NAT'd public IP, so every student shares a single bucket: these rates must
# accommodate a whole class, not a single user, or logins and exam traffic get
# 429'd en masse. (Exam sync is ~5 req/min/student: 300 students ≈ 1500/min.)
# Per-USER throttling lives in the app (app/utils/rate_limiter.py), which keys
# authenticated traffic on user_id — nginx only needs to stop floods.
# Sized for 330 concurrent users (300 murid + 30 guru) behind ONE school IP.
# Exam start is the worst case: everyone logs in together, then every client
# polls sync-draft (~5 req/min each ≈ 1650/min). Brute-force protection lives
# in the app, keyed per ACCOUNT, so these only need to stop floods.
limit_req_zone $binary_remote_addr zone=login:10m rate=1200r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=6000r/m;
limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=6000r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=120r/m;

upstream scangrade_app {
    server 127.0.0.1:8000;
    keepalive 64;
}

# HTTP → HTTPS redirect (Certbot compatible)
server {
    listen 80;
    server_name scangrade.web.id www.scangrade.web.id;

    # ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name scangrade.web.id www.scangrade.web.id;

    # ── SSL (managed by Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/scangrade.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scangrade.web.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ── Security Headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    # ── Static files (cache 365 days) ──
    location /static/ {
        root /opt/scangrade/app;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        # Brotli/gzip pre-compressed files
        location ~* \.(js|css|woff2)$ {
            gzip_static on;
        }
    }

    # ── SocketIO WebSocket (for whiteboard) ──
    location /socket.io/ {
        proxy_pass http://scangrade_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Rate limit: Login (10 req/min per IP) ──
    location /auth/login {
        limit_req zone=login burst=400 nodelay;
        limit_req_status 429;
        proxy_pass http://scangrade_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/login-user {
        limit_req zone=login burst=400 nodelay;
        limit_req_status 429;
        proxy_pass http://scangrade_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Rate limit: Upload (5 req/min per IP) ──
    location ~ ^/api/(scan|upload) {
        limit_req zone=upload burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://scangrade_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Rate limit: Heavy API (exam submit, sync-draft) ──
    location ~ ^/api/(student/(submit|sync-draft)|violation) {
        limit_req zone=api_heavy burst=600 nodelay;
        limit_req_status 429;
        proxy_pass http://scangrade_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Rate limit: General API (60 req/min per IP) ──
    location /api/ {
        limit_req zone=api_general burst=600 nodelay;
        limit_req_status 429;
        proxy_pass http://scangrade_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health check (no rate limit, no logging) ──
    location /health {
        access_log off;
        proxy_pass http://scangrade_app;
        proxy_set_header Host $host;
    }

    # ── Flask reverse proxy (everything else) ──
    location / {
        proxy_pass http://scangrade_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Deny hidden files ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Custom 429 error page ──
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type text/html;
        return 429 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Terlalu Banyak Permintaan</title><style>body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f8fafc;margin:0}.card{max-width:400px;text-align:center;padding:40px;background:white;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.06)}h1{font-size:48px;color:#ef4444;margin:0}p{color:#64748b}button{margin-top:16px;padding:10px 24px;background:#3b82f6;color:white;border:none;border-radius:12px;font-weight:bold;cursor:pointer}button:hover{background:#2563eb}</style></head><body><div class="card"><h1>429</h1><p>Terlalu banyak permintaan. Silakan coba lagi dalam beberapa detik.</p><button onclick="location.reload()">Coba Lagi</button></div></body></html>';
    }
}
