# ============================================================
# ScanGrade — NGINX Production Config
# Letak: /etc/nginx/sites-available/scangrade
# Aktifkan: sudo ln -s /etc/nginx/sites-available/scangrade /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx
# ============================================================

upstream scangrade_app {
    # Gunicorn — sesuaikan port dengan gunicorn.conf.py
    server 127.0.0.1:8000;
    # Tambahkan server tambahan jika multi-instance:
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 80;
    server_name scan-grade.app www.scan-grade.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name scan-grade.app www.scan-grade.app;

    # ── SSL (gunakan Certbot / Let's Encrypt) ──
    ssl_certificate     /etc/letsencrypt/live/scan-grade.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scan-grade.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        font/woff;

    # ── Max upload size (PDF exam files up to 50MB) ──
    client_max_body_size 50M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ── Static files (cache 1 tahun + immutable) ──
    location /static/ {
        alias /opt/scangrade/static/;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # ── Flask reverse proxy ──
    location / {
        proxy_pass http://scangrade_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # ── Browser caching untuk halaman exam ──
        # Exam list dan exam page boleh di-cache browser 30 detik
        location ~ ^/(student/exams|auth/login) {
            proxy_pass http://scangrade_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "private, max-age=30, stale-while-revalidate=60";
        }

        # ── API endpoints — NO cache ──
        location ~ ^/(api/|student/exams/[^/]+/submit|student/sync) {
            proxy_pass http://scangrade_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
        }
    }

    # ── Deny access to hidden files ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Health check ──
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ── Rate limit error page ──
    error_page 429 /429.html;
    location = /429.html {
        internal;
        root /opt/scangrade/static;
    }

    # ── Custom error pages ──
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
