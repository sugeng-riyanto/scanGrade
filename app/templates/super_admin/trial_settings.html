{% extends "base.html" %}
{% block title %}Pengaturan Trial - ScanGrade{% endblock %}
{% block page_title %}Pengaturan Masa Trial{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto" x-data="{ lang: localStorage.getItem('sg_lang') || 'id' }">
    <div class="card p-6">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center text-amber-600 text-xl"><i class="fas fa-clock"></i></div>
            <div>
                <h3 class="font-extrabold text-lg text-slate-800" x-text="lang==='en'?'Trial Duration Settings':'Pengaturan Durasi Trial'"></h3>
                <p class="text-sm text-slate-500 font-medium" x-text="lang==='en'?'Set how many days new schools get for free trial':'Atur berapa hari trial gratis untuk sekolah baru'"></p>
            </div>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1" x-text="lang==='en'?'Trial Period (days)':'Masa Trial (hari)'"></label>
                <input type="number" name="trial_days" value="{{ trial.trial_days }}" class="input" min="0" max="365" required>
                <p class="text-xs text-slate-400 mt-1" x-text="lang==='en'?'Set to 0 to disable free trial':'Isi 0 untuk menonaktifkan trial gratis'"></p>
            </div>
            <div class="flex items-center gap-3 pt-2">
                <button type="submit" class="btn btn-primary px-6" x-text="lang==='en'?'Save':'Simpan'">Simpan</button>
                <a href="/super-admin/dashboard" class="btn btn-ghost" x-text="lang==='en'?'Back':'Kembali'">Kembali</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
