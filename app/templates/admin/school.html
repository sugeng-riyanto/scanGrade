{% extends "base.html" %}
{% block title %}Pengaturan Sekolah - ScanGrade{% endblock %}
{% block page_title %}Pengaturan Sekolah{% endblock %}
{% block content %}
<div class="space-y-6" x-data="{ lang: localStorage.getItem('sg_lang') || 'id' }">
    <div>
        <h2 class="text-2xl font-extrabold text-slate-800" x-text="lang==='en'?'School Settings':'Pengaturan Sekolah'"></h2>
        <p class="text-sm text-slate-500 font-medium mt-0.5" x-text="lang==='en'?'Configure your school information':'Konfigurasi informasi sekolah Anda'"></p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- School Info -->
        <div class="card">
            <div class="px-5 py-4 border-b border-slate-100">
                <h3 class="font-bold text-slate-800" x-text="lang==='en'?'School Information':'Informasi Sekolah'"></h3>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">NPSN</label>
                    <input type="text" placeholder="Nomor Pokok Sekolah Nasional" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" x-text="lang==='en'?'School Name':'Nama Sekolah'"></label>
                    <input type="text" placeholder="SMA Negeri 1 Contoh" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" x-text="lang==='en'?'Academic Year':'Tahun Ajaran'"></label>
                    <input type="text" placeholder="2025/2026" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" x-text="lang==='en'?'Address':'Alamat'"></label>
                    <textarea rows="2" placeholder="Alamat sekolah" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" x-text="lang==='en'?'Timezone (UTC Offset)':'Zona Waktu (Offset UTC)'"></label>
                    <select id="school-tz" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition bg-white">
                        {% for h in range(-12, 15) %}
                        <option value="{{ h }}" {% if h == g.tz_offset %}selected{% endif %}>UTC{{ "+%d"|format(h) if h >= 0 else h }} — {{ ["Baker Island","American Samoa","Hawaii","Alaska","Pacific Time","Mountain Time","Central Time","Eastern Time","Atlantic Time","Newfoundland","Brasilia","Fernando de Noronha","Azores","UTC","WIB Jakarta/Bangkok","WIB+1 Taipei/Perth","WIB+2 Tokyo/Seoul","WIB+3 Sydney","WIB+4 Brisbane","WIB+5 Adelaide","WIB+6 Auckland","WIB+7 Nuku'alofa","WIB+8","WIB+9","WIB+10","WIB+11","WIB+12"][h+12] if h+12 < 27 else "" }}</option>
                        {% endfor %}
                    </select>
                    <p class="text-xs text-slate-400 mt-1" x-text="lang==='en'?'Default for all users. Each user can override in top bar.':'Default untuk semua pengguna. Setiap pengguna bisa ubah di top bar.'"></p>
                </div>
                <button class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-brand-600/20 transition" x-text="lang==='en'?'Save Changes':'Simpan Perubahan'"></button>
            </div>
        </div>

        <!-- Import Data -->
        <div class="space-y-6">
            <div class="card">
                <div class="px-5 py-4 border-b border-slate-100">
                    <h3 class="font-bold text-slate-800" x-text="lang==='en'?'Import Classes':'Impor Kelas'"></h3>
                </div>
                <div class="p-5">
                    <p class="text-sm text-slate-500 font-medium mb-3" x-text="lang==='en'?'Upload a CSV file with class data':'Upload file CSV dengan data kelas'"></p>
                    <div class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center hover:border-brand-400 transition cursor-pointer">
                        <i class="fas fa-cloud-upload-alt text-3xl text-slate-300 mb-2"></i>
                        <p class="text-sm font-semibold text-slate-500" x-text="lang==='en'?'Drop CSV here or click to upload':'Drop CSV di sini atau klik untuk upload'"></p>
                        <p class="text-xs text-slate-400 mt-1">Format: kelas, wali_kelas</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="px-5 py-4 border-b border-slate-100">
                    <h3 class="font-bold text-slate-800" x-text="lang==='en'?'Import Students':'Impor Siswa'"></h3>
                </div>
                <div class="p-5">
                    <p class="text-sm text-slate-500 font-medium mb-3" x-text="lang==='en'?'Upload a CSV file with student data (NISN)':'Upload file CSV dengan data siswa (NISN)'"></p>
                    <div class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center hover:border-brand-400 transition cursor-pointer">
                        <i class="fas fa-cloud-upload-alt text-3xl text-slate-300 mb-2"></i>
                        <p class="text-sm font-semibold text-slate-500" x-text="lang==='en'?'Drop CSV here or click to upload':'Drop CSV di sini atau klik untuk upload'"></p>
                        <p class="text-xs text-slate-400 mt-1">Format: nisn, nama, kelas</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
