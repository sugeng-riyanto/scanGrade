{% extends "base.html" %}
{% block title %}Users - Admin{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-3 mb-2">
        <div class="bg-orange-100 p-2.5 rounded-2xl shadow-sm">
            <i class="fas fa-users text-orange-600 text-xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-stone-800">Manage Users</h1>
    </div>

    <div class="bg-white rounded-2xl shadow-lg shadow-stone-200/60 border border-stone-100">
        <div class="px-6 py-4 border-b border-stone-100 flex justify-between items-center">
            <h2 class="text-lg font-extrabold text-stone-800">All Users</h2>
            <div class="flex gap-2">
                <input type="text" placeholder="Cari..." class="border-2 border-stone-200 rounded-xl px-3 py-1.5 text-sm focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition">
                <select class="border-2 border-stone-200 rounded-xl px-3 py-1.5 text-sm focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition">
                    <option value="">Semua Role</option>
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
        </div>
        <div class="p-6">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead><tr class="text-left text-stone-500 border-b border-stone-100">
                        <th class="pb-3 font-bold">Email</th>
                        <th class="pb-3 font-bold">Role</th>
                        <th class="pb-3 font-bold">Exams</th>
                        <th class="pb-3 font-bold">Joined</th>
                    </tr></thead>
                    <tbody>
                        {% for u in users %}
                        <tr class="border-b border-stone-50 last:border-0 hover:bg-stone-50 transition">
                            <td class="py-3 font-semibold text-stone-700">{{ u.email }}</td>
                            <td class="py-3">
                                <span class="px-3 py-1 text-xs font-bold rounded-full
                                    {% if u.role == 'teacher' %}bg-emerald-100 text-emerald-700
                                    {% elif u.role == 'admin' %}bg-orange-100 text-orange-700
                                    {% else %}bg-amber-100 text-amber-700{% endif %}">{{ u.role }}</span>
                            </td>
                            <td class="py-3 text-stone-600">{{ u.exam_count or 0 }}</td>
                            <td class="py-3 text-stone-400">{{ u.created_at[:10] if u.created_at else '-' }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
