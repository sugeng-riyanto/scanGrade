{% extends "base.html" %}
{% block title %}Lupa Password - ScanGrade{% endblock %}
{% block content_noauth %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-primary-500 to-primary-600 flex items-center justify-center shadow-lg shadow-primary-500/30">
                <i class="fas fa-lock text-2xl text-white"></i>
            </div>
            <h1 class="mt-4 text-3xl font-extrabold text-surface-800">Lupa Password</h1>
            <p class="mt-1 text-surface-500 font-medium">Masukkan email aktif atau NISN Anda</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-sm font-semibold text-red-700 flex items-center gap-2">
            <i class="fas fa-exclamation-circle shrink-0"></i><span>{{ error }}</span>
        </div>
        {% endif %}

        <div class="bg-white rounded-2xl shadow-xl shadow-surface-200/60 border border-surface-200 p-6 lg:p-8">
            <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Email Aktif atau NISN</label>
                    <input type="text" name="email" required placeholder="email.anda@gmail.com atau NISN"
                           class="w-full px-4 py-3 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-surface-700 font-medium placeholder:text-surface-300 transition">
                    <p class="text-xs text-surface-400 mt-1.5">Kami akan kirim kode verifikasi 6 digit ke email aktif Anda</p>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white py-3 px-4 rounded-xl font-extrabold shadow-lg shadow-primary-500/25 transition">
                    <i class="fas fa-paper-plane mr-2"></i>Kirim Kode Verifikasi
                </button>
            </form>
        </div>

        <p class="mt-6 text-center">
            <a href="{{ url_for('auth.login') }}" class="text-sm text-primary-600 hover:text-primary-700 font-semibold">
                <i class="fas fa-arrow-left mr-1"></i>Kembali ke Login
            </a>
        </p>
    </div>
</div>
{% endblock %}
