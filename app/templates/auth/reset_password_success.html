{% extends "base.html" %}
{% from "auth/_chrome.html" import lang_button %}
{% block title %}Password Changed - ScanGrade{% endblock %}
{% block content_noauth %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100 flex items-center justify-center p-4 relative"
     x-effect="document.title = t('Password Berhasil Diubah - ScanGrade', 'Password Changed - ScanGrade')">
    {{ lang_button() }}
    <div class="w-full max-w-md text-center">
        <div class="w-20 h-20 mx-auto rounded-full bg-emerald-100 flex items-center justify-center mb-6 shadow-lg shadow-emerald-500/20">
            <i class="fas fa-check-circle text-4xl text-emerald-500"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-surface-800 mb-2" x-text="t('Password Berhasil Diubah!','Password Changed!')"></h1>
        <p class="text-surface-500 font-medium mb-8" x-text="t('Password Anda telah berhasil diperbarui. Silakan login dengan password baru.','Your password has been updated. Log in with your new password.')"></p>
        <a href="{{ url_for('auth.login') }}" class="inline-block bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white px-8 py-3 rounded-xl font-extrabold shadow-lg shadow-primary-500/25 transition">
            <i class="fas fa-sign-in-alt mr-2"></i><span x-text="t('Login Sekarang','Log in now')"></span>
        </a>
    </div>
</div>
{% endblock %}
