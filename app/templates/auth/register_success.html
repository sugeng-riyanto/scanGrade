{% extends "base.html" %}
{% from "auth/_chrome.html" import lang_button %}
{% block title %}Registration Received - ScanGrade{% endblock %}
{% block content_noauth %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100 flex items-center justify-center p-4 relative"
     x-effect="document.title = t('Pendaftaran Berhasil - ScanGrade', 'Registration Received - ScanGrade')">
    {{ lang_button() }}
    <div class="w-full max-w-md text-center">
        <div class="w-20 h-20 mx-auto rounded-full bg-emerald-100 flex items-center justify-center mb-6 shadow-lg shadow-emerald-500/20">
            <i class="fas fa-check-circle text-4xl text-emerald-500"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-surface-800 mb-2" x-text="t('Pendaftaran Berhasil!','Registration Received!')"></h1>
        <p class="text-surface-500 font-medium mb-2" x-text="t('Akun sekolah Anda telah terdaftar.','Your school account has been registered.')"></p>
        <p class="text-sm text-surface-400 mb-8"><span x-text="t('Kode aktivasi akan dikirim ke email','An activation code will be sent to')"></span> <strong>{{ email }}</strong> <span x-text="t('setelah disetujui oleh Super Admin.','once a Super Admin approves it.')"></span></p>
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-8 text-sm text-amber-700 text-left">
            <i class="fas fa-clock mr-2"></i>
            <strong x-text="t('Langkah selanjutnya:','What happens next:')"></strong>
            <ol class="mt-2 ml-5 space-y-1 list-decimal text-amber-600 font-medium">
                <li x-text="t('Tunggu email konfirmasi persetujuan dari admin','Wait for the approval email from an admin')"></li>
                <li x-text="t('Gunakan kode aktivasi yang dikirim','Use the activation code you receive')"></li>
                <li><span x-text="t('Aktivasi akun di halaman','Activate the account on the')"></span> <a href="{{ url_for('auth.activate') }}" class="underline font-bold" x-text="t('Aktivasi','Activation')"></a></li>
                <li x-text="t('Login dan lengkapi profil sekolah','Log in and complete the school profile')"></li>
            </ol>
        </div>
        <a href="{{ url_for('auth.login') }}" class="inline-block bg-primary-600 hover:bg-primary-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-primary-600/20 transition">
            <i class="fas fa-sign-in-alt mr-2"></i><span x-text="t('Kembali ke Login','Back to login')"></span>
        </a>
    </div>
</div>
{% endblock %}
