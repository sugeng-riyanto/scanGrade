{% extends "base.html" %}
{% block title %}Daftar - ScanGrade{% endblock %}
{% block content %}
<div class="flex min-h-[80vh] items-center justify-center">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-orange-400 to-amber-500 rounded-2xl flex items-center justify-center shadow-lg shadow-orange-200/60">
                <i class="fas fa-graduation-cap text-3xl text-white"></i>
            </div>
            <h1 class="mt-4 text-3xl font-extrabold text-stone-800">ScanGrade</h1>
            <p class="font-bold text-stone-500 mt-2">Buat akun baru</p>
        </div>
        <div class="bg-white rounded-2xl shadow-lg shadow-stone-200/60 p-8 border border-stone-100">
            <h2 class="text-xl font-extrabold text-stone-800 mb-6">Daftar</h2>
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="mb-4">
                    <label class="block text-sm font-extrabold text-stone-700 mb-1">Email</label>
                    <input type="email" name="email" required
                           class="w-full px-4 py-3 border-2 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 border-stone-200 font-bold text-stone-700">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-extrabold text-stone-700 mb-1">Password</label>
                    <input type="password" name="password" required
                           class="w-full px-4 py-3 border-2 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 border-stone-200 font-bold text-stone-700">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-extrabold text-stone-700 mb-1">Daftar sebagai</label>
                    <select name="role"
                            class="w-full px-4 py-3 border-2 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 border-stone-200 font-bold text-stone-700 bg-white">
                        <option value="teacher">Guru</option>
                        <option value="student">Siswa</option>
                    </select>
                </div>
                <button type="submit"
                        class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white py-3 px-4 rounded-xl hover:from-orange-600 hover:to-amber-600 font-extrabold shadow-lg shadow-orange-200/60 transition">
                    <i class="fas fa-user-plus mr-2"></i>Daftar
                </button>
            </form>
            <p class="mt-4 text-center text-sm font-bold text-stone-500">
                Sudah punya akun? <a href="{{ url_for('auth.login') }}" class="text-orange-600 hover:text-orange-700 underline font-extrabold">Masuk</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
