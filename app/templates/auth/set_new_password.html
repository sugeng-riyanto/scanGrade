{% extends "base.html" %}
{% block title %}Buat Password Baru - ScanGrade{% endblock %}
{% block content_noauth %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-emerald-500 to-emerald-600 flex items-center justify-center shadow-lg shadow-emerald-500/30">
                <i class="fas fa-key text-2xl text-white"></i>
            </div>
            <h1 class="mt-4 text-3xl font-extrabold text-surface-800">Buat Password Baru</h1>
            <p class="mt-1 text-surface-500 font-medium">Masukkan password baru Anda</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-sm font-semibold text-red-700 flex items-center gap-2">
            <i class="fas fa-exclamation-circle shrink-0"></i><span>{{ error }}</span>
        </div>
        {% endif %}

        <div class="bg-white rounded-2xl shadow-xl shadow-surface-200/60 border border-surface-200 p-6 lg:p-8" x-data="{ pw: '', confirm: '', email: '{{ email }}' }">
            <form method="POST" action="{{ url_for('auth.set_new_password') }}" class="space-y-5">
                <input type="hidden" name="email" :value="email">

                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Password Baru</label>
                    <input type="password" name="password" x-model="pw" required minlength="6"
                           class="w-full px-4 py-3 border border-surface-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-surface-700 font-medium transition">
                    <p class="text-xs text-surface-400 mt-1">Minimal 6 karakter</p>
                </div>
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Konfirmasi Password Baru</label>
                    <input type="password" name="confirm_password" x-model="confirm" required minlength="6"
                           class="w-full px-4 py-3 border border-surface-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-surface-700 font-medium transition"
                           :class="confirm && pw !== confirm ? 'border-red-400 focus:border-red-500' : ''">
                    <p x-show="confirm && pw !== confirm" class="text-xs text-red-500 mt-1">Password tidak cocok</p>
                </div>
                <button type="submit" :disabled="!pw || !confirm || pw !== confirm || pw.length < 6"
                        class="w-full bg-gradient-to-r from-emerald-500 to-green-500 hover:from-emerald-600 hover:to-green-600 text-white py-3 px-4 rounded-xl font-extrabold shadow-lg shadow-emerald-500/25 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-check mr-2"></i>Simpan Password Baru
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
