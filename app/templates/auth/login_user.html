{% extends "base.html" %}
{% block title %}Masuk - ScanGrade{% endblock %}
{% block content_noauth %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100 flex items-center justify-center p-4 lg:p-8">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-primary-500 to-primary-600 flex items-center justify-center shadow-lg shadow-primary-500/30">
                <i class="fas fa-user-graduate text-2xl text-white"></i>
            </div>
            <h1 class="mt-4 text-3xl font-extrabold text-surface-800">Masuk Guru / Murid</h1>
            <p class="mt-1 text-surface-500 font-medium">Gunakan akun yang diberikan sekolah Anda</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-sm font-semibold text-red-700 flex items-center gap-2" role="alert">
            <i class="fas fa-exclamation-circle shrink-0"></i><span>{{ error }}</span>
        </div>
        {% endif %}

        <div class="bg-white rounded-2xl shadow-xl shadow-surface-200/60 border border-surface-200 p-6 lg:p-8">
            <form method="POST" action="{{ url_for('auth.login_user') }}" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Email</label>
                    <input type="email" name="email" required autocomplete="email" placeholder="email@sekolah.id"
                           class="w-full px-4 py-3 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-surface-700 font-medium placeholder:text-surface-300 transition">
                </div>
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Password</label>
                    <input type="password" name="password" required autocomplete="current-password" placeholder="Masukkan password"
                           class="w-full px-4 py-3 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-surface-700 font-medium placeholder:text-surface-300 transition">
                </div>
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded border-surface-300 text-primary-600 focus:ring-primary-500">
                        <span class="font-medium text-surface-600">Ingat saya</span>
                    </label>
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-primary-600 hover:text-primary-700 font-semibold">Lupa password?</a>
                </div>
                <button type="submit"
                        class="w-full bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white py-3 px-4 rounded-xl font-extrabold shadow-lg shadow-primary-500/25 transition disabled:opacity-50"
                        onclick="this.disabled=true;this.form.submit()">
                    <i class="fas fa-sign-in-alt mr-2"></i>Masuk
                </button>
            </form>
        </div>

        <div class="mt-6 space-y-2 text-center">
            <p class="text-sm text-surface-500 font-medium">
                Admin sekolah? <a href="{{ url_for('auth.login') }}" class="text-primary-600 hover:text-primary-700 font-bold">Masuk di sini</a>
            </p>
            <p class="text-xs text-surface-400 font-medium">
                Belum punya akun? <a href="{{ url_for('auth.register') }}" class="text-primary-600 hover:text-primary-700 font-semibold">Daftar Sekolah</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
