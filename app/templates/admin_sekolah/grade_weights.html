{% set content_lang = 'id' %}
{% extends "base.html" %}
{% block title %}Nilai Berbobot - ScanGrade{% endblock %}
{% block page_title %}Nilai Berbobot{% endblock %}
{% block content %}
<script>
// The school's grade policy: its components, the default weight each carries, and
// the per-subject distribution. A subject **follows the default** until the admin
// saves its own row — so one policy covers the whole school and only the
// exceptions are typed out. A save only succeeds when a row (or the default)
// reaches 100%, so every total is shown live and its Save stays disabled until it
// adds up.
// The preview's arithmetic: the mark a sample set of scores carries under a
// distribution, before anything is saved. It is the same rule the server's
// `grade_weighting.compute` keeps — a component with no sample counts as 0, a
// component with no weight is ignored, a 0% weight is not a component, and a
// distribution with no weights at all falls back to the simple mean — so the
// number an admin previews is the number the roster will compute. Written as a
// standalone function (like the pupil page's countdown) so its rule can be read
// and run on its own.
function sgPreviewFinal(weights, scores) {
    const map = {};
    Object.keys(weights || {}).forEach(function (id) {
        const w = parseInt(weights[id], 10);
        if (!isNaN(w) && w > 0) { map[id] = w; }
    });
    const has = function (id) {
        const raw = scores ? scores[id] : undefined;
        return raw !== undefined && raw !== null && raw !== '' && isFinite(Number(raw));
    };
    const ids = Object.keys(map);
    if (!ids.length) {
        const values = Object.keys(scores || {})
            .filter(has).map(function (id) { return Number(scores[id]); });
        const mean = values.length
            ? Math.round((values.reduce(function (a, b) { return a + b; }, 0) / values.length) * 10) / 10
            : null;
        return {mode: 'simple', final: mean, detail: [], total: 0};
    }
    let total = 0;
    const detail = ids.map(function (id) {
        const scored = has(id);
        const average = scored ? Number(scores[id]) : 0;
        const weight = map[id];
        total += average * weight / 100;
        return {component_id: id, weight: weight,
                average: scored ? average : null, count: scored ? 1 : 0};
    });
    return {
        mode: 'weighted',
        final: Math.round(total * 10) / 10,
        detail: detail,
        total: ids.reduce(function (a, id) { return a + map[id]; }, 0),
    };
}

function gradeWeights() {
    return {
        components: {{ components|tojson }},
        subjects: {{ subjects|tojson }},
        weights: {{ matrix|tojson }},
        totals: {{ totals|tojson }},
        defaults: {{ defaults|tojson }},
        customSubjects: {{ custom_subjects|tojson }},
        compNames: {{ comp_names|tojson }},
        required: {{ required_total }},
        closed: {{ 'true' if year_status == 'closed' else 'false' }},
        levels: {{ subject_levels|tojson }},
        levelNames: {{ grade_levels|tojson }},
        newName: '',
        saving: '',
        msg: '',
        ok: false,

        activeComponents() { return this.components.filter(c => c.is_active); },
        row(subjectId) { return this.weights[subjectId] || (this.weights[subjectId] = {}); },
        cell(subjectId, compId) { const v = this.row(subjectId)[compId]; return (v === undefined ? '' : v); },
        setCell(subjectId, compId, value) {
            const r = this.row(subjectId);
            const n = parseInt(value, 10);
            if (isNaN(n) || n <= 0) { delete r[compId]; } else { r[compId] = n; }
            this.totals[subjectId] = Object.values(r).reduce((a, b) => a + b, 0);
        },
        total(subjectId) { return this.totals[subjectId] || 0; },
        canSave(subjectId) { return this.total(subjectId) === this.required; },

        // ── custom vs default, by subject and by grade level ────────────────
        // The page lists every subject flat, so nothing said which rows still
        // follow the school default. These count them, group them by the grade
        // levels that teach them, and let an admin return a whole level to the
        // default in one click instead of saving each row back by hand.
        customCount() { return this.subjects.filter(s => this.isCustom(s.id)).length; },
        followCount() { return this.subjects.filter(s => !this.isCustom(s.id)).length; },
        levelSubjects(level) {
            const want = String(level);
            return this.subjects.filter(s => (this.levels[String(s.id)] || []).indexOf(want) !== -1);
        },
        levelCustomCount(level) { return this.levelSubjects(level).filter(s => this.isCustom(s.id)).length; },
        resetLevel(level) {
            const n = this.levelCustomCount(level);
            if (!n) { return; }
            if (!confirm(this.t('Kembalikan mapel di tingkat ini ke default sekolah?',
                                'Return the subjects in this level to the school default?'))) { return; }
            this.saving = 'level:' + level; this.msg = '';
            // The server derives the level's subjects; the page only names the level.
            this.post('/admin-sekolah/grade-weights/reset-level', { grade_level: level })
                .then(d => {
                    if (d.ok) {
                        this.levelSubjects(level).forEach(s => {
                            this.weights[s.id] = Object.assign({}, this.defaults);
                            this.totals[s.id] = this.defaultTotal();
                            this.customSubjects = this.customSubjects.filter(v => v !== String(s.id));
                        });
                    }
                    this.flash(d.ok, d.ok
                        ? this.t('Mapel di tingkat ini kembali mengikuti default sekolah.','Subjects in this level follow the school default again.')
                        : (d.data.error || this.t('Gagal.','Failed.')));
                    this.saving = '';
                });
        },

        // ── the preview ─────────────────────────────────────────────────────
        // It reads whichever distribution is selected *live* — the school default
        // or a subject's own row as typed, saved or not — so the effect of a
        // change is visible before it is committed. It never posts: saving stays
        // the admin's deliberate act.
        previewSubject: '__default__',
        previewScores: {},
        previewWeights() {
            return (this.previewSubject === '__default__'
                ? this.defaults : this.row(this.previewSubject)) || {};
        },
        previewMark() { return sgPreviewFinal(this.previewWeights(), this.previewScores); },
        setSample(compId, value) {
            // A hand-typed sample is no longer the pupil's record, so the
            // attribution drops here: the badge must not go on naming a learner
            // whose marks the admin has just edited.
            this.seedIntact = false;
            if (value === '' || value === null || value === undefined) {
                delete this.previewScores[compId];
            } else {
                this.previewScores[compId] = value;
            }
        },

        // ── seeding the sample from a real pupil ─────────────────────────────
        // Invented scores answer "what does 80/90 carry?". An admin changing a
        // real policy wants the better question: what does a *named* learner
        // carry out of this subject under the distribution being typed? The
        // picker reads one pupil's own component means from the server — the
        // same bucketing the roster computes — and fills the sample fields.
        // Seeding is a read; nothing here posts, and saving stays the admin's
        // deliberate act.
        pupilQuery: '',
        pupilResults: [],
        pupilHint: '',
        seedPupil: null,
        seedIntact: false,
        // The comparison across subjects: this learner's saved final in every
        // subject they have a mark in, plus the component means each figure was
        // built from — so the "with these weights" column can re-run the page's
        // own rule under the distribution being typed. Read once per seeded
        // pupil; it does not depend on which subject is selected.
        pupilSubjects: [],
        pupilSubjectsNote: '',
        searchPupils() {
            const q = this.pupilQuery.trim();
            this.pupilHint = '';
            if (q.length < 2) { this.pupilResults = []; return; }
            this.get('/admin-sekolah/grade-weights/pupils?q=' + encodeURIComponent(q))
                .then(d => { this.pupilResults = (d.ok && d.data.pupils) || []; });
        },
        seedFrom(pupil) {
            if (!pupil || !pupil.id) { return; }
            this.seedPupil = pupil;
            this.seedIntact = false;
            this.pupilHint = '';
            // The comparison belongs to the learner, not to the subject being
            // previewed, so it is read whichever subject is selected — under
            // the school default it is even the only figure the page can show
            // for them.
            this.loadPupilSubjects(pupil.id);
            if (this.previewSubject === '__default__') {
                // Marks belong to a subject, so the school default has no record
                // to read. Say so rather than guessing which subject to read.
                this.pupilHint = this.t('Pilih satu mapel dulu: nilai dibaca dari satu mapel.',
                                        'Pick a subject first: marks are read from one subject.');
                return;
            }
            this.get('/admin-sekolah/grade-weights/pupil-marks?student_id=' + encodeURIComponent(pupil.id)
                     + '&subject_id=' + encodeURIComponent(this.previewSubject))
                .then(d => {
                    if (!d.ok) {
                        this.pupilHint = d.data.error
                            || this.t('Gagal membaca nilai murid.', 'Could not read the pupil marks.');
                        return;
                    }
                    this.previewScores = d.data.marks || {};
                    this.seedIntact = Object.keys(this.previewScores).length > 0;
                    this.pupilHint = d.data.scored
                        ? this.t('Nilai murid ini dimuat.', 'This pupil marks are loaded.')
                        : this.t('Murid ini belum punya nilai di mapel ini.',
                                 'This pupil has no marks in this subject yet.');
                });
        },
        loadPupilSubjects(studentId) {
            this.pupilSubjects = [];
            this.pupilSubjectsNote = '';
            this.get('/admin-sekolah/grade-weights/pupil-subjects?student_id='
                     + encodeURIComponent(studentId))
                .then(d => {
                    if (!d.ok) {
                        this.pupilSubjectsNote = d.data.error
                            || this.t('Gagal membaca nilai murid.', 'Could not read the pupil marks.');
                        return;
                    }
                    this.pupilSubjects = d.data.subjects || [];
                    this.pupilSubjectsNote = this.pupilSubjects.length ? ''
                        : this.t('Murid ini belum punya nilai di mapel mana pun.',
                                 'This pupil has no marks in any subject yet.');
                });
        },
        clearSeed() {
            this.seedPupil = null;
            this.seedIntact = false;
            this.previewScores = {};
            this.pupilHint = '';
            this.pupilResults = [];
            this.pupilSubjects = [];
            this.pupilSubjectsNote = '';
        },
        onPreviewSubjectChange() {
            // The seed belongs to a subject, so a new subject is a fresh read —
            // re-seeding the same pupil keeps the comparison the admin is making.
            const pupil = this.seedPupil;
            this.seedIntact = false;
            this.previewScores = {};
            this.pupilHint = '';
            if (pupil) { this.seedFrom(pupil); }
        },
        get(url) {
            return fetch(url, {headers: {'Accept': 'application/json'}})
              .then(r => r.json().then(data => ({ok: r.ok && !data.error, data})))
              .catch(() => ({ok: false, data: {error: this.t('Gagal menghubungi server.', 'Could not reach the server.')}}));
        },

        // ── the comparison across subjects ──────────────────────────────────
        // A distribution is a policy for a whole school, so one mark on its own
        // cannot say whether a change is fair: what decides a save is whether it
        // is fair between the subjects *this learner* sits. "Saved" is what each
        // subject reports today, from the server's own arithmetic. "With these
        // weights" re-runs the page's rule over the learner's component means
        // under whatever is in the matrix right now, saved or not — so a change
        // to the school default moves every subject that follows it, while a
        // change to one subject's own row moves only that row. Rows stay in
        // subject-name order: this compares, it does not rank.
        pupilRowTyped(row) { return this.weights[row.subject_id] || this.defaults; },
        pupilRowLive(row) {
            // Null when the weights typed for this subject are not a
            // distribution (no weights at all = the fallback mean). That mean is
            // taken over the learner's *papers*, and this page holds their
            // per-component means, so printing the mean of those means would be a
            // different number than the roster's. Saying nothing is right.
            const preview = sgPreviewFinal(this.pupilRowTyped(row), row.marks || {});
            return preview.mode === 'weighted' ? preview.final : null;
        },
        pupilRowLiveText(row) {
            const live = this.pupilRowLive(row);
            return live === null ? '—' : live.toFixed(1);
        },
        pupilRowDelta(row) {
            const live = this.pupilRowLive(row);
            const saved = row.final;
            if (live === null || saved === null || saved === undefined) { return null; }
            const diff = Math.round((live - Number(saved)) * 10) / 10;
            return diff === 0 ? null : diff;
        },
        pupilRowDeltaText(row) {
            const diff = this.pupilRowDelta(row);
            if (diff === null) { return this.t('tetap','unchanged'); }
            return (diff > 0 ? '+' : '') + diff.toFixed(1);
        },
        pupilRowDeltaClass(row) {
            const diff = this.pupilRowDelta(row);
            if (diff === null) { return 'text-slate-300'; }
            return diff > 0 ? 'text-emerald-600' : 'text-red-500';
        },

        isCustom(subjectId) { return this.customSubjects.includes(String(subjectId)); },

        // ── the school default ──────────────────────────────────────────────
        defaultTotal() { return Object.values(this.defaults).reduce((a, b) => a + Number(b || 0), 0); },
        defaultCanSave() { const t = this.defaultTotal(); return t === 0 || t === this.required; },
        setDefault(compId, value) {
            const n = parseInt(value, 10);
            if (isNaN(n) || n <= 0) { delete this.defaults[compId]; } else { this.defaults[compId] = n; }
        },
        saveDefaults() {
            this.saving = 'defaults'; this.msg = '';
            this.post('/admin-sekolah/grade-weights/defaults', { weights: this.defaults })
                .then(d => {
                    if (d.ok) {
                        // Every subject still following the default moves with it,
                        // so the matrix below never shows a stale policy.
                        this.subjects.forEach(s => {
                            if (!this.isCustom(s.id)) {
                                this.weights[s.id] = Object.assign({}, this.defaults);
                                this.totals[s.id] = this.defaultTotal();
                            }
                        });
                    }
                    this.flash(d.ok, d.ok ? this.t('Default tersimpan.','Default saved.') : (d.data.error || this.t('Gagal.','Failed.')));
                    this.saving = '';
                });
        },

        addComponent() {
            if (!this.newName.trim()) { return; }
            this.post('/admin-sekolah/grade-weights/components', { name: this.newName.trim() })
                .then(d => {
                    if (d.ok) { this.components.push(d.data.component); this.newName = ''; }
                    this.flash(d.ok, d.ok ? this.t('Komponen ditambahkan.','Component added.') : (d.data.error || this.t('Gagal.','Failed.')));
                });
        },
        rename(c) {
            const name = prompt(this.t('Nama komponen','Component name'), c.name);
            if (name === null || !name.trim() || name.trim() === c.name) { return; }
            this.post('/admin-sekolah/grade-weights/components/' + c.id + '/update', { name: name.trim() })
                .then(d => {
                    if (d.ok) { c.name = name.trim(); this.compNames[c.id] = name.trim(); }
                    this.flash(d.ok, d.ok ? this.t('Tersimpan.','Saved.') : (d.data.error || this.t('Gagal.','Failed.')));
                });
        },
        toggle(c) {
            this.post('/admin-sekolah/grade-weights/components/' + c.id + '/update', { is_active: !c.is_active })
                .then(d => {
                    if (d.ok) { c.is_active = !c.is_active; }
                    this.flash(d.ok, d.ok ? this.t('Tersimpan.','Saved.') : (d.data.error || this.t('Gagal.','Failed.')));
                });
        },
        saveRow(subjectId) {
            this.saving = subjectId; this.msg = '';
            this.post('/admin-sekolah/grade-weights/' + subjectId, { weights: this.row(subjectId) })
                .then(d => {
                    if (d.ok && !this.customSubjects.includes(String(subjectId))) {
                        this.customSubjects.push(String(subjectId));
                    }
                    this.flash(d.ok, d.ok ? this.t('Bobot mapel tersimpan.','Subject weights saved.') : (d.data.error || this.t('Gagal.','Failed.')));
                    this.saving = '';
                });
        },
        followDefault(subjectId) {
            if (!confirm(this.t('Pakai default sekolah untuk mapel ini?','Use the school default for this subject?'))) { return; }
            this.saving = subjectId;
            // Clearing the subject's rows is what "follow the default" means on the
            // server: no custom config, so the school default applies again.
            this.weights[subjectId] = {};
            this.post('/admin-sekolah/grade-weights/' + subjectId, { weights: {} })
                .then(d => {
                    if (d.ok) {
                        this.weights[subjectId] = Object.assign({}, this.defaults);
                        this.totals[subjectId] = this.defaultTotal();
                        this.customSubjects = this.customSubjects.filter(v => v !== String(subjectId));
                    }
                    this.flash(d.ok, d.ok ? this.t('Mapel kembali mengikuti default.','Subject follows the default again.') : (d.data.error || this.t('Gagal.','Failed.')));
                    this.saving = '';
                });
        },
        post(url, body) {
            return fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
                body: JSON.stringify(body || {}),
            }).then(r => r.json().then(data => ({ok: r.ok && !data.error, data})))
              .catch(() => ({ok: false, data: {error: this.t('Gagal menyimpan.','Could not save.')}}));
        },
        flash(ok, text) { this.ok = ok; this.msg = text; },
    };
}
</script>
<div class="space-y-6" :lang="lang" x-data="gradeWeights()">
    <div class="card p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
        <div>
            <h2 class="text-lg font-extrabold text-slate-800" x-text="t('Komponen & Bobot Nilai','Grade Components & Weights')"></h2>
            <p class="text-xs text-slate-500 font-medium" x-text="t('Atur default sekolah sekali, lalu tiap mapel mengikutinya. Default diatur per tahun ajaran; totalnya harus 100%.','Set the school default once; each subject follows it. The default is per subject per year; the total must reach 100%.')"></p>
            <!-- How much of the school is on the default and how much carries its
                 own distribution — the question the flat subject list never
                 answered. -->
            <p class="text-xs font-bold mt-1.5">
                <span class="text-brand-700" x-text="customCount()"></span>
                <span class="text-slate-600" x-text="t('mapel punya bobot sendiri ·','subjects have their own weights ·')"></span>
                <span class="text-slate-500" x-text="followCount()"></span>
                <span class="text-slate-500" x-text="t('masih mengikuti default sekolah.','still follow the school default.')"></span>
            </p>
        </div>
        <span class="text-xs font-bold px-2 py-1 rounded-lg bg-slate-100 text-slate-600" x-show="'{{ year_name }}'">{{ year_name or t('Tanpa tahun aktif','No active year') }}</span>
    </div>

    <div x-show="msg" x-cloak class="p-3 rounded-xl text-sm font-bold"
         :class="ok ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-600 border border-red-200'"
         x-text="msg"></div>

    <div x-show="closed" class="p-3 rounded-xl text-sm font-bold bg-amber-50 text-amber-700 border border-amber-200"
         x-text="t('Tahun ajaran ini sudah ditutup — bobot hanya bisa dilihat.','This school year is closed — weights can only be viewed.')"></div>

    <div class="card p-5">
        <div class="flex items-center justify-between gap-2 mb-3">
            <h3 class="text-sm font-extrabold text-slate-700" x-text="t('Komponen Nilai','Grade Components')"></h3>
            <div class="flex gap-2" x-show="!closed">
                <input type="text" x-model="newName" @keydown.enter="addComponent()"
                       :placeholder="t('mis. Proyek','e.g. Project')"
                       class="px-3 py-1.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500">
                <button type="button" @click="addComponent()" class="px-3 py-1.5 rounded-xl bg-brand-600 text-white text-sm font-bold hover:bg-brand-700">
                    <i class="fas fa-plus mr-1"></i><span x-text="t('Tambah','Add')"></span>
                </button>
            </div>
        </div>
        <div class="flex flex-wrap gap-2">
            <template x-for="c in components" :key="c.id">
                <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl border"
                     :class="c.is_active ? 'bg-brand-50 border-brand-200 text-brand-700' : 'bg-slate-50 border-slate-200 text-slate-500 line-through'">
                    <span class="text-sm font-bold" x-text="c.name"></span>
                    <button type="button" x-show="!closed" @click="rename(c)" class="text-slate-400 hover:text-brand-700"><i class="fas fa-pen text-xs"></i></button>
                    <button type="button" x-show="!closed" @click="toggle(c)" class="text-slate-400 hover:text-brand-700"><i class="fas" :class="c.is_active ? 'fa-toggle-on' : 'fa-toggle-off'"></i></button>
                </div>
            </template>
            <span x-show="components.length === 0" class="text-sm text-slate-400 italic"
                  x-text="t('Belum ada komponen. Tambahkan dulu.','No components yet. Add one first.')"></span>
        </div>
    </div>

    <template x-if="activeComponents().length > 0">
        <div>
            <!-- The default distribution: what every subject follows unless it has
                 its own row below. Editing it moves every subject still on the
                 default, so the matrix never shows a policy the school no longer has. -->
            <div class="card p-5 mb-6 border-2 border-brand-200">
                <div class="flex items-center justify-between gap-2 mb-3">
                    <div>
                        <h3 class="text-sm font-extrabold text-slate-700"><i class="fas fa-star text-brand-500 mr-1"></i><span x-text="t('Bobot Default Sekolah','School Default Weights')"></span></h3>
                        <p class="text-xs text-slate-500 font-medium" x-text="t('Semua mapel mengikuti ini sampai diubah di bawah.','Every subject follows this until changed below.')"></p>
                    </div>
                    <div class="flex items-center gap-2" x-show="!closed">
                        <span class="text-sm font-extrabold" :class="defaultTotal() === required ? 'text-emerald-600' : 'text-red-500'" x-text="defaultTotal() + '%'"></span>
                        <button type="button" @click="saveDefaults()" :disabled="!defaultCanSave() || saving==='defaults'"
                                class="px-3 py-1.5 rounded-lg bg-brand-600 text-white text-xs font-bold hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed">
                            <i class="fas fa-save mr-1"></i><span x-text="t('Simpan Default','Save Default')"></span>
                        </button>
                    </div>
                </div>
                <div class="flex flex-wrap gap-3">
                    <template x-for="c in activeComponents()" :key="c.id">
                        <label class="flex items-center gap-2">
                            <span class="text-xs font-bold text-slate-600" x-text="c.name"></span>
                            <input type="number" min="0" max="100" :disabled="closed"
                                   :value="defaults[c.id] === undefined ? '' : defaults[c.id]"
                                   @change="setDefault(c.id, $event.target.value)"
                                   class="w-16 text-center border border-slate-200 rounded-lg px-1 py-1 text-sm font-bold disabled:bg-slate-100">
                        </label>
                    </template>
                </div>
            </div>

            <!-- Which subjects still follow the default and which carry their own
                 distribution, grouped by the grade levels that teach them, with a
                 one-click reset that returns a whole level to the default. -->
            <div class="card p-5 mb-6" data-level-resets x-show="levelNames.length > 0">
                <div class="mb-3">
                    <h3 class="text-sm font-extrabold text-slate-700"><i class="fas fa-layer-group text-brand-500 mr-1"></i><span x-text="t('Per Tingkat','By Grade Level')"></span></h3>
                    <p class="text-xs text-slate-500 font-medium" x-text="t('Lihat mapel mana yang masih mengikuti default, dan kembalikan satu tingkat sekaligus ke default sekolah.','See which subjects still follow the default, and return a whole level to the school default at once.')"></p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    <template x-for="lvl in levelNames" :key="lvl">
                        <div class="flex items-center justify-between gap-2 p-3 rounded-xl border border-slate-100 bg-slate-50">
                            <div class="min-w-0">
                                <p class="text-sm font-extrabold text-slate-700"><span x-text="t('Tingkat ','Level ')"></span><span x-text="lvl"></span></p>
                                <p class="text-xs font-medium">
                                    <span class="font-bold" :class="levelCustomCount(lvl) ? 'text-brand-700' : 'text-slate-400'" x-text="levelCustomCount(lvl)"></span>
                                    <span class="text-slate-500" x-text="t(' punya bobot sendiri · total ',' have their own weights · total ')"></span>
                                    <span class="text-slate-400" x-text="levelSubjects(lvl).length"></span>
                                    <span class="text-slate-400" x-text="t(' mapel',' subjects')"></span>
                                </p>
                            </div>
                            <button type="button" @click="resetLevel(lvl)"
                                    :disabled="closed || levelCustomCount(lvl) === 0 || saving === 'level:' + lvl"
                                    class="shrink-0 px-3 py-1.5 rounded-lg bg-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed">
                                <i class="fas fa-rotate-left mr-1"></i><span x-text="t('Reset ke default','Reset to default')"></span>
                            </button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- The preview: what a sample set of scores carries under the
                 distribution currently selected, computed live and never saved.
                 The number an admin sees here is the number the roster will
                 compute, because the arithmetic is the server's own rule. -->
            <div class="card p-5 mb-6" data-weight-preview>
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-3">
                    <div>
                        <h3 class="text-sm font-extrabold text-slate-700"><i class="fas fa-calculator text-brand-500 mr-1"></i><span x-text="t('Pratinjau Nilai Akhir','Final Mark Preview')"></span></h3>
                        <p class="text-xs text-slate-500 font-medium" x-text="t('Masukkan contoh nilai tiap komponen untuk melihat Nilai Akhir yang akan dihasilkan. Belum tersimpan.','Enter a sample score per component to see the Final Mark it would produce. Nothing is saved here.')"></p>
                    </div>
                    <select x-model="previewSubject" @change="onPreviewSubjectChange()" :disabled="closed"
                            class="px-3 py-1.5 border border-slate-200 rounded-xl text-sm font-bold focus:ring-2 focus:ring-brand-500 disabled:bg-slate-100">
                        <option value="__default__" x-text="t('Bobot default sekolah','School default weights')"></option>
                        <template x-for="s in subjects" :key="s.id">
                            <option :value="String(s.id)" x-text="s.name"></option>
                        </template>
                    </select>
                </div>
                <!-- The preview is the effect of a distribution on a learner, so
                     the admin can name one: the sample fields are filled with
                     that pupil's own marks for the subject being previewed, read
                     by the server through the same component bucketing the roster
                     uses. A hand-edited field drops the attribution. -->
                <div class="mb-3" data-preview-pupil>
                    <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                        <label class="flex items-center gap-2">
                            <span class="text-xs font-bold text-slate-600" x-text="t('Ambil dari murid','Seed from a pupil')"></span>
                            <input type="text" x-model="pupilQuery" @input.debounce="searchPupils()"
                                   :disabled="closed"
                                   :placeholder="t('Cari nama murid…','Search a pupil by name…')"
                                   class="px-3 py-1.5 border border-slate-200 rounded-xl text-sm font-bold focus:ring-2 focus:ring-brand-500 disabled:bg-slate-100">
                        </label>
                        <span class="flex items-center gap-1 text-xs font-bold px-2 py-1 rounded-lg"
                              :class="seedIntact ? 'bg-brand-50 text-brand-700' : 'bg-slate-100 text-slate-500'"
                              x-show="seedPupil">
                            <i class="fas" :class="seedIntact ? 'fa-user-check' : 'fa-pen'"></i>
                            <span x-text="seedPupil && seedPupil.name"></span>
                            <span class="text-slate-400" x-show="seedPupil && seedPupil.class_name"
                                  x-text="seedPupil && seedPupil.class_name ? '· ' + seedPupil.class_name : ''"></span>
                            <span x-show="!seedIntact" x-text="t('(diedit)','(edited)')"></span>
                        </span>
                        <button type="button" x-show="seedPupil" @click="clearSeed()"
                                class="text-xs font-bold text-slate-500 hover:text-brand-700">
                            <i class="fas fa-xmark mr-1"></i><span x-text="t('Kosongkan','Clear')"></span>
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2 mt-2" x-show="pupilResults.length > 0">
                        <template x-for="p in pupilResults" :key="p.id">
                            <button type="button" @click="seedFrom(p)"
                                    class="px-2 py-1 rounded-lg border border-slate-200 text-xs font-bold hover:bg-brand-100">
                                <span x-text="p.name"></span>
                                <span class="text-slate-400" x-text="p.class_name ? '· ' + p.class_name : ''"></span>
                            </button>
                        </template>
                    </div>
                    <p class="text-xs text-slate-500 font-medium mt-2" x-show="pupilHint" x-text="pupilHint"></p>
                </div>
                <div class="flex flex-wrap gap-3 mb-4">
                    <template x-for="c in activeComponents()" :key="c.id">
                        <label class="flex items-center gap-2">
                            <span class="text-xs font-bold text-slate-600" x-text="c.name"></span>
                            <input type="number" min="0" max="100" :disabled="closed"
                                   :value="previewScores[c.id] === undefined ? '' : previewScores[c.id]"
                                   @input="setSample(c.id, $event.target.value)"
                                   class="w-16 text-center border border-slate-200 rounded-lg px-1 py-1 text-sm font-bold disabled:bg-slate-100">
                        </label>
                    </template>
                </div>
                <div class="flex flex-wrap items-center gap-4 p-3 rounded-xl bg-slate-50 border border-slate-100">
                    <div class="flex items-baseline gap-2">
                        <span class="text-xs font-bold text-slate-500" x-text="t('Nilai Akhir','Final Mark')"></span>
                        <span class="text-2xl font-extrabold text-brand-700" data-preview-final
                              x-text="previewMark().final === null ? '—' : previewMark().final.toFixed(1)"></span>
                    </div>
                    <span class="text-xs font-bold px-2 py-1 rounded-lg"
                          :class="previewMark().mode === 'weighted' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'"
                          x-text="previewMark().mode === 'weighted'
                                    ? t('Berbobot ' + previewMark().total + '%','Weighted ' + previewMark().total + '%')
                                    : t('Rata-rata sederhana','Simple mean')"></span>
                    <span x-show="previewMark().mode === 'weighted' && previewMark().total !== required"
                          class="text-xs font-bold text-red-500"
                          x-text="t('Total bobot belum 100%.','The weights do not total 100% yet.')"></span>
                </div>
                <div class="mt-3 space-y-1" x-show="previewMark().detail.length > 0">
                    <template x-for="d in previewMark().detail" :key="d.component_id">
                        <p class="text-xs text-slate-500">
                            <span class="font-bold text-slate-600" x-text="compNames[d.component_id] || d.component_id"></span>
                            <span x-text="': ' + (d.average === null ? t('tanpa nilai','no score') : d.average) + ' × ' + d.weight + '%'"></span>
                        </p>
                    </template>
                </div>
                <!-- The same learner across every subject they have a mark in.
                     A distribution is changed for a whole school, so the number
                     that decides a save is whether it is fair between these
                     subjects: "saved" is what each reports today, "with these
                     weights" re-runs the same rule under what is in the matrix
                     now, and the last column is the difference. Shown only for a
                     seeded pupil, because an invented sample has no record. -->
                <div class="mt-4 pt-4 border-t border-slate-100" x-show="seedPupil" data-preview-subjects>
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                        <h4 class="text-xs font-extrabold text-slate-700"
                            x-text="t('Nilai murid ini antar mapel','This pupil across subjects')"></h4>
                        <span class="text-xs font-medium text-slate-500"
                              x-text="t('Tersimpan vs bobot yang sedang diketik.','Saved vs the weights being typed.')"></span>
                    </div>
                    <div class="overflow-x-auto" x-show="pupilSubjects.length > 0">
                        <table class="w-full text-sm">
                            <thead><tr class="text-left text-slate-500 bg-slate-50 border-b border-slate-100">
                                <th class="px-3 py-2 font-semibold" x-text="t('Mapel','Subject')"></th>
                                <th class="px-2 py-2 font-semibold text-center" x-text="t('Tersimpan','Saved')"></th>
                                <th class="px-2 py-2 font-semibold text-center" x-text="t('Dengan bobot ini','With these weights')"></th>
                                <th class="px-3 py-2 font-semibold text-center" x-text="t('Selisih','Change')"></th>
                            </tr></thead>
                            <tbody>
                                <template x-for="row in pupilSubjects" :key="row.subject_id">
                                    <tr class="border-b border-slate-50 last:border-0">
                                        <td class="px-3 py-2 font-semibold text-slate-700">
                                            <span x-text="row.name"></span>
                                            <span class="ml-1 text-[10px] font-bold text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded"
                                                  x-show="row.untagged > 0"
                                                  :title="t('Ada kertas tanpa komponen, jadi tidak ikut nilai berbobot.','Some papers have no component, so they cannot count toward a weighted mark.')"
                                                  x-text="row.untagged + ' ' + t('tanpa kategori','uncategorised')"></span>
                                        </td>
                                        <td class="px-2 py-2 text-center font-bold text-slate-500"
                                            x-text="row.final === null ? '—' : Number(row.final).toFixed(1)"></td>
                                        <td class="px-2 py-2 text-center font-extrabold text-brand-700"
                                            x-text="pupilRowLiveText(row)"></td>
                                        <td class="px-3 py-2 text-center">
                                            <span class="text-xs font-bold"
                                                  :class="pupilRowDeltaClass(row)"
                                                  x-text="pupilRowDeltaText(row)"></span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <p class="text-xs text-slate-500 font-medium mt-2" x-show="pupilSubjectsNote"
                       x-text="pupilSubjectsNote"></p>
                </div>
            </div>

            <div class="card p-5">
                <h3 class="text-sm font-extrabold text-slate-700 mb-3" x-text="t('Matriks Bobot per Mapel','Weight Matrix per Subject')"></h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm min-w-[640px]">
                        <thead><tr class="text-left text-slate-500 bg-slate-50 border-b border-slate-100">
                            <th class="px-3 py-2 font-semibold" x-text="t('Mapel','Subject')"></th>
                            <template x-for="c in activeComponents()" :key="c.id">
                                <th class="px-2 py-2 font-semibold text-center" x-text="c.name"></th>
                            </template>
                            <th class="px-2 py-2 font-semibold text-center" x-text="t('Total','Total')"></th>
                            <th class="px-3 py-2"></th>
                        </tr></thead>
                        <tbody>
                            <template x-for="s in subjects" :key="s.id">
                                <tr class="border-b border-slate-50 last:border-0">
                                    <td class="px-3 py-2 font-semibold text-slate-700">
                                        <span x-text="s.name"></span>
                                        <span x-show="!isCustom(s.id)" class="ml-1 text-[10px] font-bold text-brand-600 bg-brand-50 px-1.5 py-0.5 rounded"
                                              x-text="t('mengikuti default','follows the default')"></span>
                                        <span x-show="isCustom(s.id)" class="ml-1 text-[10px] font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded"
                                              x-text="t('bobot sendiri','own weights')"></span>
                                        <template x-for="lvl in (levels[String(s.id)] || [])" :key="lvl">
                                            <span class="ml-1 text-[10px] font-bold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded" x-text="lvl"></span>
                                        </template>
                                    </td>
                                    <template x-for="c in activeComponents()" :key="c.id">
                                        <td class="px-1 py-2 text-center">
                                            <input type="number" min="0" max="100" :disabled="closed"
                                                   :value="cell(s.id, c.id)"
                                                   @change="setCell(s.id, c.id, $event.target.value)"
                                                   class="w-16 text-center border border-slate-200 rounded-lg px-1 py-1 text-sm font-bold disabled:bg-slate-100">
                                        </td>
                                    </template>
                                    <td class="px-2 py-2 text-center font-extrabold"
                                        :class="total(s.id) === 0 ? 'text-slate-300' : (total(s.id) === required ? 'text-emerald-600' : 'text-red-500')">
                                        <span x-text="total(s.id) + '%'"></span>
                                    </td>
                                    <td class="px-3 py-2 text-right whitespace-nowrap" x-show="!closed">
                                        <button type="button" @click="saveRow(s.id)" :disabled="!canSave(s.id)"
                                                class="px-3 py-1.5 rounded-lg bg-brand-600 text-white text-xs font-bold hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed">
                                            <i class="fas fa-save mr-1"></i><span x-text="t('Simpan','Save')"></span>
                                        </button>
                                        <button type="button" @click="followDefault(s.id)" x-show="isCustom(s.id)"
                                                class="ml-1 px-2 py-1.5 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold hover:bg-slate-200"
                                                :title="t('Kembali ikuti default','Back to the default')">
                                            <i class="fas fa-rotate-left"></i>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>
    <template x-if="activeComponents().length === 0">
        <div class="card p-5">
            <p class="text-sm text-slate-400 italic" x-text="t('Tambahkan minimal satu komponen aktif untuk mengatur bobot.','Add at least one active component to set weights.')"></p>
        </div>
    </template>
</div>
{% endblock %}
