<section class="card p-5" aria-labelledby="seb-export-title" x-init="$nextTick(() => prepare($refs.exportForm))" x-data="{
    message: '', english: '', state: '', busy: false, requestId: 0,
    async prepare(form) {
        const id = ++this.requestId;
        this.message = '';
        this.english = '';
        this.state = '';
        this.busy = form.checkValidity();
        if (!this.busy) return;
        try {
            const body = new FormData(form);
            body.set('format', 'whatsapp');
            const response = await fetch(form.action, { method: 'POST', body });
            if (!response.ok) throw Error();
            const result = await response.json();
            if (id !== this.requestId) return;
            this.message = result.text;
            this.english = result.english_text;
            this.state = 'ready';
        } catch {
            if (id === this.requestId) this.state = 'failed';
        } finally {
            if (id === this.requestId) this.busy = false;
        }
    },
    async copy(field) {
        try {
            await navigator.clipboard.writeText(field.value);
            this.state = 'copied';
        } catch {
            field.select();
            this.state = 'manual';
        }
    }
}">
    <h2 id="seb-export-title" class="text-lg font-extrabold text-surface-800" x-text="t('Kode keluar SEB per tanggal','Daily SEB exit codes')"></h2>
    <form x-ref="exportForm" method="post" action="{{ url_for('seb.daily_exit_codes') }}" class="flex flex-wrap items-end gap-3 mt-3">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <label class="text-sm text-surface-700">
            <span x-text="t('Tanggal mulai ujian (WIB)','Exam start date (WIB)')"></span>
            <input name="date" type="date" required value="{{ seb_export_date }}" class="block rounded-lg border border-surface-200 bg-surface-50 p-2" @change="prepare($refs.exportForm)">
        </label>
        <button name="format" value="xlsx" class="btn-primary"
                x-text="t('Unduh Excel','Download Excel')"></button>
    </form>
    <p x-show="busy" x-cloak role="status" class="mt-3 text-sm text-surface-700"
       x-text="t('Memuat jadwal WhatsApp…','Loading WhatsApp schedule…')"></p>
    <div x-show="message" x-cloak class="grid gap-4 mt-4 md:grid-cols-2">
        <div class="rounded-xl border border-surface-200 bg-surface-50 p-4">
            <label for="seb-message-id" class="font-semibold text-surface-800">Bahasa Indonesia</label>
            <textarea id="seb-message-id" x-ref="message" :value="message" readonly rows="8" class="mt-2 w-full rounded-lg border border-surface-200 bg-white p-3 text-sm text-surface-800"></textarea>
            <button type="button" class="btn-secondary" @click="copy($refs.message)" x-text="t('Salin Bahasa Indonesia','Copy Indonesian')"></button>
        </div>
        <div class="rounded-xl border border-surface-200 bg-surface-50 p-4">
            <label for="seb-message-en" class="font-semibold text-surface-800">English</label>
            <textarea id="seb-message-en" x-ref="english" :value="english" readonly rows="8" class="mt-2 w-full rounded-lg border border-surface-200 bg-white p-3 text-sm text-surface-800"></textarea>
            <button type="button" class="btn-secondary" @click="copy($refs.english)" x-text="t('Salin bahasa Inggris','Copy English')"></button>
        </div>
    </div>
    <p x-show="state === 'copied'" x-cloak role="status" x-text="t('Teks disalin.','Text copied.')"></p>
    <p x-show="state === 'manual'" x-cloak role="status" x-text="t('Salin teks yang telah dipilih.','Copy the selected text.')"></p>
    <div x-show="state === 'failed'" x-cloak class="mt-3 flex flex-wrap items-center gap-3">
        <p role="alert" class="text-sm text-surface-700"
           x-text="t('Jadwal tidak dapat dimuat.','Could not load the schedule.')"></p>
        <button type="button" class="btn-secondary" @click="prepare($refs.exportForm)"
                x-text="t('Coba lagi','Retry')"></button>
    </div>
</section>
