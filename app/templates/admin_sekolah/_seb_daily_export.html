<section class="card p-5 mb-5" x-data="{
    message: '', english: '', state: '', busy: false,
    async prepare(form) {
        this.busy = true;
        this.message = '';
        this.english = '';
        this.state = '';
        try {
            const body = new FormData(form);
            body.set('format', 'whatsapp');
            const response = await fetch(form.action, { method: 'POST', body });
            if (!response.ok) throw Error();
            const result = await response.json();
            this.message = result.text;
            this.english = result.english_text;
            this.state = 'ready';
        } catch {
            this.state = 'failed';
        } finally {
            this.busy = false;
        }
    },
    async copy(field) {
        try {
            await navigator.clipboard.writeText(field.value);
            this.state = 'copied';
        } catch {
            field.select();
            this.state = 'manual';
        }
    }
}">
    <h2 class="font-extrabold text-surface-800" x-text="t('Kode keluar SEB per tanggal','Daily SEB exit codes')"></h2>
    <form x-ref="exportForm" method="post" action="{{ url_for('seb.daily_exit_codes') }}" class="flex flex-wrap items-end gap-3 mt-3">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <label class="text-sm text-surface-700">
            <span x-text="t('Tanggal mulai ujian (WIB)','Exam start date (WIB)')"></span>
            <input name="date" type="date" :disabled="busy" required value="{{ seb_export_date }}" class="block rounded-lg border p-2" @change="message = ''; english = ''; state = ''">
        </label>
        <button name="format" value="xlsx" class="btn-primary" :disabled="busy"
                x-text="t('Unduh Excel','Download Excel')"></button>
        <button type="button" class="btn-secondary" :disabled="busy"
                @click="$refs.exportForm.reportValidity() && prepare($refs.exportForm)"
                x-text="t('Siapkan teks WhatsApp','Prepare WhatsApp text')"></button>
    </form>
    <div x-show="message" x-cloak class="grid gap-3 mt-3 md:grid-cols-2">
        <div>
            <label for="seb-message-id" class="font-semibold">Bahasa Indonesia</label>
            <textarea id="seb-message-id" x-ref="message" :value="message" readonly rows="8" class="w-full rounded-lg border p-2"></textarea>
            <button type="button" class="btn-secondary" @click="copy($refs.message)" x-text="t('Salin Bahasa Indonesia','Copy Indonesian')"></button>
        </div>
        <div>
            <label for="seb-message-en" class="font-semibold">English</label>
            <textarea id="seb-message-en" x-ref="english" :value="english" readonly rows="8" class="w-full rounded-lg border p-2"></textarea>
            <button type="button" class="btn-secondary" @click="copy($refs.english)" x-text="t('Salin bahasa Inggris','Copy English')"></button>
        </div>
    </div>
    <p x-show="state === 'copied'" x-cloak role="status" x-text="t('Teks disalin.','Text copied.')"></p>
    <p x-show="state === 'manual'" x-cloak role="status" x-text="t('Salin teks yang telah dipilih.','Copy the selected text.')"></p>
    <p x-show="state === 'failed'" x-cloak role="alert" x-text="t('Teks tidak dapat disiapkan.','Could not prepare the text.')"></p>
</section>
