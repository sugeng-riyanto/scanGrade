{% extends "base.html" %}
{% block title %}Koreksi {{ exam.title }} - ScanGrade{% endblock %}
{% block page_title %}Koreksi: {{ exam.title }}{% endblock %}
{% block head_extra %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
{% endblock %}
{% block content %}
<div x-data="gradingQueueApp()" x-init="init()" class="flex flex-col h-[calc(100vh-12rem)]">
    <!-- Header -->
    <div class="flex items-center justify-between mb-3 shrink-0">
        <div>
            <h1 class="text-lg font-extrabold text-surface-800">
                <i class="fas fa-pen-alt text-primary-500 mr-2"></i>{{ exam.title }}
            </h1>
            <p class="text-xs text-surface-500" x-text="total + ' submission  •  ' + graded + ' selesai  •  ' + pending + ' menunggu'"></p>
        </div>
        <div class="flex items-center gap-2">
            <a href="/teacher/grading" class="text-xs text-surface-400 hover:text-primary-600 font-medium">&larr; Kembali</a>
            <select x-model="filterRole" @change="fetchQueue()" class="text-xs border border-surface-200 rounded-lg px-2 py-1.5 bg-white text-surface-600 font-medium">
                <option value="all">Semua</option>
                <option value="submitted">Perlu Koreksi</option>
                <option value="graded">Sudah Dinilai</option>
            </select>
        </div>
    </div>

    <!-- Progress bar -->
    <div class="w-full h-2 bg-surface-200 rounded-full mb-4 overflow-hidden shrink-0">
        <div class="h-full bg-emerald-500 rounded-full transition-all duration-500" :style="'width:' + (total > 0 ? (graded/total*100) : 0) + '%'"></div>
    </div>

    <div class="flex gap-4 flex-1 min-h-0">
        <!-- LEFT: Queue -->
        <div class="w-72 shrink-0 bg-white rounded-2xl border border-surface-100 shadow-sm flex flex-col overflow-hidden">
            <div class="p-2 border-b border-surface-100">
                <input type="text" x-model="searchQuery" placeholder="Cari siswa..." class="w-full px-3 py-2 bg-surface-50 border-0 rounded-lg text-sm text-surface-700 placeholder:text-surface-400">
            </div>
            <div class="flex-1 overflow-y-auto">
                <template x-for="(s, idx) in filteredList" :key="s.id">
                    <div @click="selectSubmission(idx)" class="px-3 py-2.5 flex items-center gap-2.5 cursor-pointer hover:bg-surface-50 transition border-b border-surface-50" :class="currentIdx === idx ? 'bg-primary-50 border-l-2 border-l-primary-500' : 'border-l-2 border-l-transparent'">
                        <div class="relative shrink-0">
                            <div class="w-9 h-9 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-sm" :class="s.status === 'submitted' ? 'bg-amber-500' : 'bg-emerald-500'" x-text="(s.student_name || '?')[0].toUpperCase()"></div>
                            <span class="absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white" :class="s.status === 'submitted' ? 'bg-amber-400' : 'bg-emerald-400'"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between">
                                <span class="text-sm font-semibold text-surface-800 truncate" x-text="s.student_name"></span>
                                <span x-show="s.score !== null && s.score !== undefined" class="text-xs font-bold shrink-0 ml-1" :class="s.score >= 70 ? 'text-emerald-600' : 'text-red-500'" x-text="s.score"></span>
                            </div>
                            <div class="flex items-center gap-1.5 text-[11px] text-surface-400">
                                <span x-text="'Esai ' + s.graded_essays + '/' + s.essay_count"></span>
                                <span x-show="s.has_drawing" class="text-primary-500"><i class="fas fa-paint-brush"></i></span>
                            </div>
                        </div>
                    </div>
                </template>
                <div x-show="filteredList.length === 0" class="p-6 text-center text-surface-400 text-sm">Tidak ada data</div>
            </div>
        </div>

        <!-- RIGHT: Grading Panel -->
        <div class="flex-1 flex flex-col bg-white rounded-2xl border border-surface-100 shadow-sm overflow-hidden">
            <template x-if="!current">
                <div class="flex-1 flex items-center justify-center text-surface-400">
                    <div class="text-center">
                        <i class="fas fa-arrow-left text-3xl mb-2"></i>
                        <p class="text-sm font-medium">Pilih siswa dari daftar</p>
                    </div>
                </div>
            </template>
            <template x-if="current">
                <div class="flex-1 flex flex-col overflow-hidden">
                    <!-- Student header -->
                    <div class="px-4 py-3 border-b border-surface-200 flex items-center justify-between bg-surface-50 shrink-0">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold shadow-sm" :class="current.status === 'submitted' ? 'bg-amber-500' : 'bg-emerald-500'" x-text="(current.student_name || '?')[0].toUpperCase()"></div>
                            <div>
                                <div class="font-semibold text-surface-800 text-sm" x-text="current.student_name"></div>
                                <div class="text-[11px] text-surface-400">
                                    <span x-text="'Esai ' + current.graded_essays + '/' + current.essay_count"></span>
                                    <span x-show="current.has_drawing">  •  <i class="fas fa-paint-brush text-primary-500"></i> Ada gambar</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <a :href="'/teacher/grade/' + current.id" class="text-xs text-primary-600 hover:text-primary-700 font-medium" target="_blank">
                                <i class="fas fa-external-link-alt mr-1"></i>Detail
                            </a>
                            <span class="text-xs text-surface-400 font-medium" x-text="(currentIdx + 1) + '/' + filteredList.length"></span>
                        </div>
                    </div>

                    <!-- Grading content -->
                    <div class="flex-1 overflow-y-auto p-4 space-y-4">
                        <!-- Student answer preview -->
                        <div x-show="current.preview" class="bg-blue-50 border border-blue-100 rounded-xl p-4">
                            <p class="text-xs font-bold text-blue-700 mb-1"><i class="fas fa-file-alt mr-1"></i>Jawaban Esai:</p>
                            <p class="text-sm text-surface-700 whitespace-pre-wrap line-clamp-6" x-text="current.preview"></p>
                        </div>
                        <div x-show="!current.preview" class="bg-amber-50 border border-amber-100 rounded-xl p-4">
                            <p class="text-xs font-bold text-amber-700"><i class="fas fa-info-circle mr-1"></i>Tidak ada jawaban esai teks — periksa halaman detail untuk anotasi canvas</p>
                        </div>

                        <!-- Score & Feedback -->
                        <div>
                            <label class="block text-xs font-bold text-surface-600 mb-1">Nilai (0-100)</label>
                            <input type="number" x-model="scoreInput" min="0" max="100"
                                   class="w-28 text-center text-2xl font-bold px-3 py-2 border-2 border-surface-200 rounded-xl focus:border-primary-500 focus:ring-0"
                                   :class="scoreInput >= 70 ? 'text-emerald-600 border-emerald-300' : scoreInput > 0 ? 'text-red-500 border-red-300' : ''">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-surface-600 mb-1">Feedback / Catatan</label>
                            <textarea x-model="feedbackInput" rows="3" class="w-full px-3 py-2 border border-surface-200 rounded-xl text-sm text-surface-700" placeholder="Tulis catatan koreksi..."></textarea>
                        </div>

                        <!-- AI Suggest -->
                        <div class="flex gap-2">
                            <button @click="aiSuggest()" :disabled="aiLoading" class="flex-1 px-3 py-2 bg-purple-50 text-purple-700 hover:bg-purple-100 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1">
                                <i class="fas fa-robot"></i>
                                <span x-text="aiLoading ? 'Memproses...' : 'Koreksi AI'"></span>
                            </button>
                        </div>
                        <div x-show="aiResult" class="bg-purple-50 border border-purple-100 rounded-xl p-3 text-xs text-surface-700">
                            <p class="font-bold text-purple-700 mb-1">Hasil AI:</p>
                            <p class="whitespace-pre-wrap" x-text="aiResult"></p>
                        </div>
                    </div>

                    <!-- Bottom actions -->
                    <div class="px-4 py-3 border-t border-surface-200 bg-surface-50 flex items-center gap-2 shrink-0">
                        <button @click="saveGrade()" :disabled="saving" class="flex-1 px-4 py-2.5 bg-primary-600 hover:bg-primary-700 disabled:bg-surface-300 text-white rounded-xl text-sm font-bold transition shadow-lg shadow-primary-600/20">
                            <span x-text="saving ? 'Menyimpan...' : '💾 Simpan Nilai'"></span>
                        </button>
                        <button @click="prevSubmission()" :disabled="currentIdx <= 0" class="px-3 py-2.5 bg-surface-100 hover:bg-surface-200 disabled:text-surface-300 rounded-xl text-sm font-bold transition text-surface-600">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button @click="nextSubmission()" :disabled="currentIdx >= filteredList.length - 1" class="px-3 py-2.5 bg-surface-100 hover:bg-surface-200 disabled:text-surface-300 rounded-xl text-sm font-bold transition text-surface-600">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function gradingQueueApp() {
    return {
        examId: '{{ exam.id }}',
        submissions: [],
        currentIdx: -1,
        searchQuery: '',
        filterRole: 'all',
        scoreInput: '',
        feedbackInput: '',
        saving: false,
        aiLoading: false,
        aiResult: '',

        get total() { return this.submissions.length },
        get pending() { return this.submissions.filter(s => s.status === 'submitted').length },
        get graded() { return this.submissions.filter(s => s.status !== 'submitted').length },
        get current() { return this.submissions[this.currentIdx] },
        get filteredList() {
            let list = this.submissions;
            if (this.filterRole === 'submitted') list = list.filter(s => s.status === 'submitted');
            else if (this.filterRole === 'graded') list = list.filter(s => s.status !== 'submitted');
            if (this.searchQuery.trim()) {
                const q = this.searchQuery.toLowerCase();
                list = list.filter(s => s.student_name.toLowerCase().includes(q));
            }
            return list;
        },

        init() { this.fetchQueue() },

        fetchQueue() {
            fetch('/teacher/api/grading-queue/' + this.examId)
                .then(r => r.json())
                .then(d => {
                    if (d.error) return;
                    this.submissions = d.submissions || [];
                    if (this.currentIdx >= this.submissions.length) this.currentIdx = -1;
                })
                .catch(() => {});
        },

        selectSubmission(idx) {
            this.currentIdx = idx;
            this.scoreInput = this.current && this.current.score !== null && this.current.score !== undefined ? String(this.current.score) : '';
            this.feedbackInput = '';
            this.aiResult = '';
        },

        saveGrade() {
            if (!this.current || this.saving) return;
            this.saving = true;
            const body = JSON.stringify({
                final_score: parseFloat(this.scoreInput) || 0,
                teacher_feedback: {
                    scores: {},
                    comments: {},
                    overall: this.feedbackInput || ''
                }
            });
            fetch('/teacher/grade/' + this.current.id + '/override', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: body
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    this.current.score = parseFloat(this.scoreInput) || 0;
                    if (this.current.status === 'submitted') {
                        this.current.status = 'graded';
                    }
                    this.fetchQueue();
                }
            })
            .catch(() => {})
            .finally(() => { this.saving = false; });
        },

        nextSubmission() {
            if (this.currentIdx < this.filteredList.length - 1) {
                this.selectSubmission(this.currentIdx + 1);
            }
        },

        prevSubmission() {
            if (this.currentIdx > 0) {
                this.selectSubmission(this.currentIdx - 1);
            }
        },

        aiSuggest() {
            if (!this.current || this.aiLoading) return;
            this.aiLoading = true;
            this.aiResult = '';
            fetch('/api/ai/grade-essay', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ submission_id: this.current.id, question_index: 0 })
            })
            .then(r => r.json())
            .then(d => {
                if (d.suggested_score !== undefined) this.scoreInput = String(Math.round(d.suggested_score));
                this.aiResult = d.feedback || 'Tidak ada feedback';
            })
            .catch(() => { this.aiResult = 'Gagal memproses AI'; })
            .finally(() => { this.aiLoading = false; });
        },
    };
}
</script>
{% endblock %}
