{% extends "base.html" %}
{% block title %}Koreksi {{ exam.title }} - ScanGrade{% endblock %}
{% block page_title %}Koreksi: {{ exam.title }}{% endblock %}
{% block content %}
<div x-data="gradingQueueApp()" x-init="init()" class="flex flex-col h-[calc(100vh-12rem)]" @keydown.window="handleKey($event)">
    <!-- Header -->
    <div class="flex items-center justify-between mb-3 shrink-0">
        <div>
            <h1 class="text-lg font-extrabold text-surface-800">
                <i class="fas fa-pen-alt text-primary-500 mr-2"></i>{{ exam.title }}
            </h1>
            <p class="text-xs text-surface-500" x-text="total + ' submission  •  ' + graded + ' selesai  •  ' + pending + ' menunggu'"></p>
        </div>
        <div class="flex items-center gap-2">
            <a href="/teacher/grading" class="text-xs text-surface-400 hover:text-primary-600 font-medium">&larr; Kembali</a>
            <select x-model="filterRole" @change="fetchQueue()" class="text-xs border border-surface-200 rounded-lg px-2 py-1.5 bg-white text-surface-600 font-medium">
                <option value="all">Semua</option>
                <option value="submitted">Perlu Koreksi</option>
                <option value="graded">Sudah Dinilai</option>
            </select>
        </div>
    </div>

    <!-- Progress bar -->
    <div class="w-full h-2 bg-surface-200 rounded-full mb-4 overflow-hidden shrink-0">
        <div class="h-full bg-emerald-500 rounded-full transition-all duration-500" :style="'width:' + (total > 0 ? (graded/total*100) : 0) + '%'"></div>
    </div>

    <div class="flex gap-4 flex-1 min-h-0">
        <!-- LEFT: Queue -->
        <div class="w-72 shrink-0 bg-white rounded-2xl border border-surface-100 shadow-sm flex flex-col overflow-hidden">
            <div class="p-2 border-b border-surface-100">
                <input type="text" x-model="searchQuery" placeholder="Cari siswa..." class="w-full px-3 py-2 bg-surface-50 border-0 rounded-lg text-sm text-surface-700 placeholder:text-surface-400">
            </div>
            <div class="flex-1 overflow-y-auto">
                <template x-for="(s, idx) in filteredList" :key="s.id">
                    <div @click="selectSubmission(idx)" class="px-3 py-2.5 flex items-center gap-2.5 cursor-pointer hover:bg-surface-50 transition border-b border-surface-50" :class="currentIdx === idx ? 'bg-primary-50 border-l-2 border-l-primary-500' : 'border-l-2 border-l-transparent'">
                        <div class="relative shrink-0">
                            <div class="w-9 h-9 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-sm" :class="s.status === 'submitted' ? 'bg-amber-500' : 'bg-emerald-500'" x-text="(s.student_name || '?')[0].toUpperCase()"></div>
                            <span class="absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white" :class="s.status === 'submitted' ? 'bg-amber-400' : 'bg-emerald-400'"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between">
                                <span class="text-sm font-semibold text-surface-800 truncate" x-text="s.student_name"></span>
                                <span x-show="s.score !== null && s.score !== undefined" class="text-xs font-bold shrink-0 ml-1" :class="s.score >= 70 ? 'text-emerald-600' : 'text-red-500'" x-text="s.score"></span>
                            </div>
                            <div class="flex items-center gap-1.5 text-[11px] text-surface-400">
                                <span x-text="'Esai ' + s.graded_essays + '/' + s.essay_count"></span>
                                <span x-show="s.has_drawing" class="text-primary-500"><i class="fas fa-paint-brush"></i></span>
                            </div>
                        </div>
                    </div>
                </template>
                <div x-show="filteredList.length === 0" class="p-6 text-center text-surface-400 text-sm">Tidak ada data</div>
            </div>
        </div>

        <!-- RIGHT: Grading Panel -->
        <div class="flex-1 flex flex-col bg-white rounded-2xl border border-surface-100 shadow-sm overflow-hidden">
            <template x-if="!current">
                <div class="flex-1 flex items-center justify-center text-surface-400">
                    <div class="text-center">
                        <i class="fas fa-arrow-left text-3xl mb-2"></i>
                        <p class="text-sm font-medium">Pilih siswa dari daftar</p>
                        <p class="text-xs mt-1">Gunakan <kbd class="px-1.5 py-0.5 bg-surface-100 rounded text-xs font-bold">j</kbd> <kbd class="px-1.5 py-0.5 bg-surface-100 rounded text-xs font-bold">k</kbd> navigasi • <kbd class="px-1.5 py-0.5 bg-surface-100 rounded text-xs font-bold">Enter</kbd> simpan &amp; lanjut</p>
                    </div>
                </div>
            </template>
            <template x-if="current">
                <div class="flex-1 flex flex-col overflow-hidden">
                    <!-- Student header -->
                    <div class="px-4 py-3 border-b border-surface-200 flex items-center justify-between bg-surface-50 shrink-0">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold shadow-sm" :class="current.status === 'submitted' ? 'bg-amber-500' : 'bg-emerald-500'" x-text="(current.student_name || '?')[0].toUpperCase()"></div>
                            <div>
                                <div class="font-semibold text-surface-800 text-sm" x-text="current.student_name"></div>
                                <div class="text-[11px] text-surface-400">
                                    <span x-text="'Esai ' + current.graded_essays + '/' + current.essay_count"></span>
                                    <span x-show="current.has_drawing">  •  <i class="fas fa-paint-brush text-primary-500"></i> Ada gambar</span>
                                    <span x-show="saveStatus" class="ml-2" :class="saveStatus === 'saved' ? 'text-emerald-500' : 'text-amber-500'" x-text="saveStatus === 'saved' ? 'Tersimpan' : 'Belum disimpan'"></span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <a :href="'/teacher/grade/' + current.id" class="text-xs text-primary-600 hover:text-primary-700 font-medium" target="_blank">
                                <i class="fas fa-external-link-alt mr-1"></i>Detail
                            </a>
                            <span class="text-xs text-surface-400 font-medium" x-text="(currentIdx + 1) + '/' + filteredList.length"></span>
                        </div>
                    </div>

                    <!-- Grading content -->
                    <div class="flex-1 overflow-y-auto p-4 space-y-4">
                        <!-- Per-question grading -->
                        <template x-for="(q, qIdx) in current.questions" :key="q.index">
                            <div class="border border-surface-200 rounded-xl overflow-hidden">
                                <div class="px-4 py-2.5 bg-surface-50 border-b border-surface-200 flex items-center justify-between">
                                    <span class="text-sm font-bold text-surface-700" x-text="'Soal ' + (parseInt(q.index) + 1)"></span>
                                    <span class="text-[10px] text-surface-400 font-medium" x-text="'Bobot: ' + (q.weight || 0)"></span>
                                </div>
                                <div class="px-4 py-3 space-y-3">
                                    <!-- Preview -->
                                    <div x-show="q.preview" class="text-xs text-surface-600 bg-blue-50 rounded-lg px-3 py-2 border border-blue-100 max-h-20 overflow-y-auto" x-text="q.preview"></div>
                                    <div x-show="!q.preview" class="text-xs text-surface-400 italic">Tidak ada jawaban teks</div>
                                    <!-- Score row -->
                                    <div class="flex items-center gap-3">
                                        <label class="text-xs font-bold text-surface-600 w-16">Nilai:</label>
                                        <input type="number" x-model="qscores[q.index]" @input="onScoreChange()" min="0" max="100" class="w-20 text-center text-lg font-bold px-2 py-1.5 border-2 border-surface-200 rounded-lg focus:border-primary-500 focus:ring-0" :class="(qscores[q.index]||0) >= 70 ? 'text-emerald-600 border-emerald-300' : (qscores[q.index]||0) > 0 ? 'text-red-500 border-red-300' : ''">
                                        <span class="text-xs text-surface-400 font-medium">/ 100</span>
                                    </div>
                                    <!-- Feedback -->
                                    <div>
                                        <textarea x-model="qcomments[q.index]" @input="onScoreChange()" rows="2" class="w-full px-3 py-2 border border-surface-200 rounded-lg text-xs text-surface-700" placeholder="Catatan koreksi untuk soal ini..."></textarea>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Overall feedback -->
                        <div class="border border-surface-200 rounded-xl p-4">
                            <label class="text-xs font-bold text-surface-600 mb-1">Catatan Umum</label>
                            <textarea x-model="overallInput" rows="2" class="w-full px-3 py-2 border border-surface-200 rounded-lg text-sm text-surface-700" placeholder="Catatan keseluruhan..."></textarea>
                        </div>

                        <!-- Penalty override -->
                        <div class="border border-red-100 bg-red-50 rounded-xl p-4">
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-xs font-bold text-red-700"><i class="fas fa-exclamation-triangle mr-1"></i>Penalti Saat Ini: <span x-text="(current.score_penalty || 0)"></span></label>
                                <div class="flex items-center gap-2">
                                    <label class="text-[10px] font-medium text-red-600">Override penalti:</label>
                                    <input type="number" x-model="penaltyOverride" min="0" class="w-20 text-center text-sm font-bold px-2 py-1.5 border-2 border-red-200 rounded-lg focus:border-red-500 text-red-700" placeholder="0">
                                </div>
                            </div>
                            <p class="text-[10px] text-red-500">Penalti dikurangi dari skor akhir. Atur ke 0 untuk hapus penalti.</p>
                        </div>

                        <!-- AI Suggest -->
                        <div class="flex gap-2">
                            <button @click="aiSuggest()" :disabled="aiLoading" class="flex-1 px-3 py-2 bg-purple-50 text-purple-700 hover:bg-purple-100 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1">
                                <i class="fas fa-robot"></i>
                                <span x-text="aiLoading ? 'Memproses...' : 'Koreksi AI (soal pertama)'"></span>
                            </button>
                            <button @click="bulkAiGrade()" :disabled="bulkAiLoading" class="px-3 py-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1">
                                <i class="fas fa-bolt"></i>
                                <span x-text="bulkAiLoading ? 'Memproses...' : 'AI Semua'"></span>
                            </button>
                        </div>
                        <div x-show="aiResult" class="bg-purple-50 border border-purple-100 rounded-xl p-3 text-xs text-surface-700">
                            <p class="font-bold text-purple-700 mb-1">Hasil AI:</p>
                            <p class="whitespace-pre-wrap" x-text="aiResult"></p>
                        </div>
                    </div>

                    <!-- Bottom actions -->
                    <div class="px-4 py-3 border-t border-surface-200 bg-surface-50 flex items-center gap-2 shrink-0">
                        <button @click="saveGrade()" :disabled="saving" class="flex-1 px-4 py-2.5 bg-primary-600 hover:bg-primary-700 disabled:bg-surface-300 text-white rounded-xl text-sm font-bold transition shadow-lg shadow-primary-600/20">
                            <span x-text="saving ? 'Menyimpan...' : '💾 Simpan (Enter)'"></span>
                        </button>
                        <button @click="prevSubmission()" :disabled="currentIdx <= 0" class="px-3 py-2.5 bg-surface-100 hover:bg-surface-200 disabled:text-surface-300 rounded-xl text-sm font-bold transition text-surface-600" title="Sebelumnya (K)">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button @click="nextSubmission()" :disabled="currentIdx >= filteredList.length - 1" class="px-3 py-2.5 bg-surface-100 hover:bg-surface-200 disabled:text-surface-300 rounded-xl text-sm font-bold transition text-surface-600" title="Selanjutnya (J)">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function gradingQueueApp() {
    return {
        examId: '{{ exam.id }}',
        submissions: [],
        currentIdx: -1,
        searchQuery: '',
        filterRole: 'all',
        qscores: {},       // { "0": 85, "1": 90 }
        qcomments: {},     // { "0": "Bagus!", "1": "Kurang detail" }
        overallInput: '',
        penaltyOverride: '',
        saving: false,
        saveStatus: '',
        aiLoading: false,
        aiResult: '',
        bulkAiLoading: false,

        get total() { return this.submissions.length },
        get pending() { return this.submissions.filter(s => s.status === 'submitted').length },
        get graded() { return this.submissions.filter(s => s.status !== 'submitted').length },
        get current() { return this.submissions[this.currentIdx] },
        get filteredList() {
            let list = this.submissions;
            if (this.filterRole === 'submitted') list = list.filter(s => s.status === 'submitted');
            else if (this.filterRole === 'graded') list = list.filter(s => s.status !== 'submitted');
            if (this.searchQuery.trim()) {
                const q = this.searchQuery.toLowerCase();
                list = list.filter(s => s.student_name.toLowerCase().includes(q));
            }
            return list;
        },

        init() { this.fetchQueue() },

        handleKey(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'j' || e.key === 'J') { e.preventDefault(); this.nextSubmission(); }
            if (e.key === 'k' || e.key === 'K') { e.preventDefault(); this.prevSubmission(); }
            if (e.key === 'Enter') { e.preventDefault(); this.saveGrade(); }
            if (e.key >= '0' && e.key <= '9') {
                if (!this.current || !this.current.questions || this.current.questions.length === 0) return;
                const score = parseInt(e.key) * 10;
                const firstQ = this.current.questions[0].index;
                this.qscores[firstQ] = score;
                this.onScoreChange();
            }
        },

        fetchQueue() {
            fetch('/teacher/api/grading-queue/' + this.examId)
                .then(r => r.json())
                .then(d => {
                    if (d.error) return;
                    this.submissions = d.submissions || [];
                    if (this.currentIdx >= this.submissions.length) this.currentIdx = -1;
                    if (this.currentIdx >= 0 && this.current) this.loadScores();
                })
                .catch(() => {});
        },

        loadScores() {
            if (!this.current || !this.current.questions) return;
            const fb = this.current.teacher_feedback || {};
            this.qscores = {};
            this.qcomments = {};
            this.overallInput = fb.overall || '';
            this.penaltyOverride = this.current.score_penalty || '';
            (this.current.questions || []).forEach(q => {
                if (q.score !== undefined && q.score !== null) this.qscores[q.index] = q.score;
                if (q.comment) this.qcomments[q.index] = q.comment;
            });
        },

        selectSubmission(idx) {
            this.currentIdx = idx;
            this.aiResult = '';
            this.saveStatus = '';
            this.loadScores();
        },

        onScoreChange() {
            this.saveStatus = 'unsaved';
        },

        computeFinalScore() {
            if (!this.current || !this.current.questions || this.current.questions.length === 0) return null;
            let totalWeight = 0;
            let earned = 0;
            this.current.questions.forEach(q => {
                const w = q.weight || 0;
                totalWeight += w;
                const s = parseFloat(this.qscores[q.index]) || 0;
                earned += (s / 100) * w;
            });
            if (totalWeight === 0) return null;
            return Math.round(Math.min(earned, 100));
        },

        saveGrade() {
            if (!this.current || this.saving) return;
            this.saving = true;
            this.saveStatus = '';
            const scores = {};
            const comments = {};
            (this.current.questions || []).forEach(q => {
                const s = this.qscores[q.index];
                if (s !== undefined && s !== null && s !== '') scores[q.index] = parseFloat(s);
                const c = this.qcomments[q.index];
                if (c && c.trim()) comments[q.index] = c.trim();
            });
            const finalScore = this.computeFinalScore();
            const body = {
                final_score: finalScore,
                teacher_feedback: { scores, comments, overall: this.overallInput || '' }
            };
            if (this.penaltyOverride !== '' && this.penaltyOverride !== null) {
                body.penalty = parseFloat(this.penaltyOverride) || 0;
            }
            fetch('/teacher/grade/' + this.current.id + '/override', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    this.current.score = finalScore;
                    this.current.graded_essays = Object.keys(scores).length;
                    if (this.current.status === 'submitted') this.current.status = 'graded';
                    this.saveStatus = 'saved';
                    this.fetchQueue();
                }
            })
            .catch(() => {})
            .finally(() => { this.saving = false; });
        },

        nextSubmission() {
            if (this.saveStatus === 'unsaved') this.saveGrade();
            if (this.currentIdx < this.filteredList.length - 1) {
                this.selectSubmission(this.currentIdx + 1);
            }
        },

        prevSubmission() {
            if (this.saveStatus === 'unsaved') this.saveGrade();
            if (this.currentIdx > 0) {
                this.selectSubmission(this.currentIdx - 1);
            }
        },

        aiSuggest() {
            if (!this.current || this.aiLoading) return;
            this.aiLoading = true;
            this.aiResult = '';
            fetch('/api/ai/grade-essay', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ submission_id: this.current.id, question_index: 0 })
            })
            .then(r => r.json())
            .then(d => {
                if (d.suggested_score !== undefined) {
                    if (this.current.questions && this.current.questions.length > 0) {
                        this.qscores[this.current.questions[0].index] = Math.round(d.suggested_score);
                    }
                }
                this.aiResult = d.feedback || 'Tidak ada feedback';
                this.onScoreChange();
            })
            .catch(() => { this.aiResult = 'Gagal memproses AI'; })
            .finally(() => { this.aiLoading = false; });
        },

        bulkAiGrade() {
            if (this.bulkAiLoading) return;
            this.bulkAiLoading = true;
            fetch('/api/ai/grade-bulk', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ exam_id: this.examId })
            })
            .then(r => r.json())
            .then(d => {
                if (d.graded !== undefined) alert('AI selesai mengkoreksi ' + d.graded + ' esai');
                this.fetchQueue();
            })
            .catch(() => { alert('Gagal'); })
            .finally(() => { this.bulkAiLoading = false; });
        },
    };
}
</script>
{% endblock %}
