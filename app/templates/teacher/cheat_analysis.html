{% extends "base.html" %}
{% block title %}Deteksi Curang - ScanGrade{% endblock %}
{% block page_title %}Deteksi Pola Curang{% endblock %}
{% block content %}
<div x-data="{
    data: null, loading: true, error: '',
    init() {
        fetch('/teacher/api/exams/{{ exam_id }}/cheat-data')
            .then(r => r.json())
            .then(d => { this.data = d; this.loading = false; })
            .catch(() => { this.error = 'Gagal memuat data'; this.loading = false; });
    }
}" class="max-w-5xl mx-auto" x-init="init()">
    <a href="/teacher/results?exam_id={{ exam_id }}" class="inline-flex items-center gap-1.5 text-sm font-bold text-primary-600 hover:text-primary-700 mb-4">
        <i class="fas fa-arrow-left"></i> Kembali ke hasil
    </a>

    <div x-show="loading" class="text-center py-12">
        <div class="w-10 h-10 mx-auto rounded-full border-2 border-primary-200 border-t-primary-600 animate-spin"></div>
        <p class="text-sm font-bold text-surface-500 mt-3">Menganalisis pola...</p>
    </div>

    <div x-show="!loading && error" class="text-center py-12 text-red-500 font-bold" x-text="error"></div>

    <template x-if="data">
        <div class="space-y-6">
            <!-- Stats -->
            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="bg-white rounded-xl p-4 shadow-sm border text-center">
                    <p class="text-2xl font-extrabold text-primary-600" x-text="data.total_students"></p>
                    <p class="text-[10px] font-bold text-surface-500">Total Siswa</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border text-center">
                    <p class="text-2xl font-extrabold text-amber-600" x-text="data.identical_groups?.length || 0"></p>
                    <p class="text-[10px] font-bold text-surface-500">Grup Jawaban Identik</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border text-center">
                    <p class="text-2xl font-extrabold text-red-600" x-text="data.time_clusters?.length || 0"></p>
                    <p class="text-[10px] font-bold text-surface-500">Cluster Waktu</p>
                </div>
            </div>

            <!-- Identical Wrong Answers -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border">
                <h2 class="font-extrabold text-surface-800 mb-3 flex items-center gap-2">
                    <i class="fas fa-copy text-amber-500"></i>Jawaban Salah Identik
                    <span x-show="data.identical_groups?.length === 0" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">Aman</span>
                </h2>
                <p class="text-xs text-surface-500 mb-4">Siswa yang memiliki pola jawaban salah yang sama persis. Semakin banyak siswa dalam satu grup, semakin mencurigakan.</p>
                <template x-if="data.identical_groups?.length === 0">
                    <div class="text-center py-8 text-surface-400"><i class="fas fa-check-circle text-3xl mb-2 text-emerald-400"></i><p class="font-bold">Tidak ditemukan pola jawaban identik</p></div>
                </template>
                <template x-for="(g, i) in data.identical_groups" :key="i">
                    <div class="mb-3 p-3 rounded-xl bg-amber-50 border border-amber-200">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-sm font-bold text-amber-800" x-text="g.count + ' siswa'"></span>
                        </div>
                        <div class="flex flex-wrap gap-1">
                            <template x-for="(name, ni) in g.students" :key="ni">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white text-surface-700 border border-amber-200" x-text="name"></span>
                            </template>
                        </div>
                        <p class="text-[9px] text-amber-600 mt-1 font-mono truncate" x-text="g.pattern"></p>
                    </div>
                </template>
            </div>

            <!-- Submission Timing -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border">
                <h2 class="font-extrabold text-surface-800 mb-3 flex items-center gap-2">
                    <i class="fas fa-clock text-red-500"></i>Cluster Waktu Submit
                    <span x-show="data.time_clusters?.length === 0" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">Aman</span>
                </h2>
                <p class="text-xs text-surface-500 mb-4">Siswa yang submit dalam selisih kurang dari 3 detik. Ini bisa menunjukkan kerjasama.</p>
                <template x-if="data.time_clusters?.length === 0">
                    <div class="text-center py-8 text-surface-400"><i class="fas fa-check-circle text-3xl mb-2 text-emerald-400"></i><p class="font-bold">Tidak ditemukan cluster waktu mencurigakan</p></div>
                </template>
                <template x-for="(c, i) in data.time_clusters" :key="i">
                    <div class="mb-3 p-3 rounded-xl bg-red-50 border border-red-200">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-sm font-bold text-red-800" x-text="c.count + ' siswa submit bersamaan'"></span>
                        </div>
                        <div class="flex flex-wrap gap-1">
                            <template x-for="(name, ni) in c.students" :key="ni">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white text-surface-700 border border-red-200" x-text="name"></span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>
</div>
{% endblock %}
