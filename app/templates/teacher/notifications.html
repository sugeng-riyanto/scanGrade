{% extends "base.html" %}
{% block title %}Pengumuman & Pesan - ScanGrade{% endblock %}
{% block page_title %}Pengumuman & Pesan{% endblock %}
{% block content %}
<div class="space-y-6" x-data="{
    lang: localStorage.getItem('sg_lang') || 'id',
    notifs: [], loading: true,
    formTitle: '', formMessage: '', sending: false, sendMsg: '',
    selectedRole: 'murid', selectedStudents: [],
    studentList: [], editingId: null, editTitle: '', editMessage: '',
    conversations: [], convsLoading: true,
    activeConv: null, replyMessage: '', replying: false, replyError: '',
    editingMsgId: null, editMsgText: '',
    pollTimer: null,
    activeTab: 'convs',
    // Conversations with auto-polling
    refreshBadge() {
        window.dispatchEvent(new CustomEvent('sg:unread'));
    },
    fetchConversations() {
        this.convsLoading = true;
        fetch('/api/broadcast/conversations').then(r=>r.json()).then(d => {
            this.conversations = d.conversations || [];
            if (this.activeConv) {
                var updated = this.conversations.find(c => c.id === this.activeConv.id);
                if (updated) {
                    this.activeConv = updated;
                    this.$nextTick(() => { this.scrollToBottom(); });
                }
            }
        }).catch(()=>{}).finally(()=>{ this.convsLoading = false; });
    },
    startPolling() {
        this.stopPolling();
        this.pollTimer = setInterval(() => { this.fetchConversations(); }, 5000);
    },
    stopPolling() {
        if (this.pollTimer) { clearInterval(this.pollTimer); this.pollTimer = null; }
    },
    openConv(c) {
        this.activeConv = c;
        this.replyMessage = '';
        this.replyError = '';
        this.editingMsgId = null;
        this.$nextTick(() => { this.scrollToBottom(); });
        this.startPolling();
        fetch('/api/broadcast/mark-read', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({conversation_id: c.id}) }).then(() => {
            if (this.conversations) this.conversations.forEach(x => { if (x.id === c.id) x.has_unread = false; });
            this.refreshBadge();
        }).catch(()=>{});
    },
    scrollToBottom() {
        var el = document.querySelector('.chat-scroll');
        if (el) el.scrollTop = el.scrollHeight;
    },
    canEdit(m) {
        if (!m.is_mine) return false;
        try {
            var now = new Date();
            var created = new Date(m.created_at);
            return (now - created) < 120000;
        } catch(e) { return false; }
    },
    startEdit(m) {
        this.editingMsgId = m.id;
        this.editMsgText = m.message;
    },
    cancelEdit() {
        this.editingMsgId = null;
        this.editMsgText = '';
    },
    saveEditMsg() {
        if (!this.editMsgText || !this.editingMsgId) return;
        fetch('/api/broadcast/edit-message', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({notification_id: this.editingMsgId, message: this.editMsgText})
        }).then(r=>r.json()).then(d => {
            if (d.success) { this.editingMsgId = null; this.editMsgText = ''; this.fetchConversations(); }
        }).catch(()=>{});
    },
    sendReply() {
        if (!this.replyMessage) return;
        this.replying = true;
        this.replyError = '';
        fetch('/api/broadcast/reply', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({conversation_id: this.activeConv.id, message: this.replyMessage})
        }).then(r=>r.json()).then(d => {
            if (d.success) { this.replyMessage = ''; this.fetchConversations(); }
            else { this.replyError = d.error || 'Gagal kirim'; }
        }).catch(()=>{ this.replyError = 'Gagal terhubung ke server'; }).finally(()=>{ this.replying = false; });
    },
    completeConv() {
        if (!confirm('Selesaikan percakapan ini?')) return;
        fetch('/api/broadcast/complete', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({conversation_id: this.activeConv.id})
        }).then(r=>r.json()).then(d => { if (d.success) { this.activeConv.status = 'completed'; this.fetchConversations(); } });
    },
    // Broadcasts
    fetchNotifs() {
        this.loading = true;
        fetch('/api/broadcast/list').then(r=>r.json()).then(d => { this.notifs = d.notifications || []; }).catch(()=>{}).finally(()=>{ this.loading = false; });
    },
    fetchStudents() {
        var r = this.selectedRole === 'all' ? 'murid' : this.selectedRole;
        fetch('/api/broadcast/students?role='+r).then(r=>r.json()).then(d => { this.studentList = d.users || []; }).catch(()=>{});
    },
    toggleStudent(id) {
        var idx = this.selectedStudents.indexOf(id);
        if (idx > -1) this.selectedStudents.splice(idx,1); else this.selectedStudents.push(id);
    },
    toggleAllStudents() {
        if (this.selectedStudents.length === this.studentList.length) this.selectedStudents = [];
        else this.selectedStudents = this.studentList.map(s => s.id);
    },
    sendBroadcast() {
        if (!this.formTitle || !this.formMessage) { this.sendMsg = 'Isi judul dan pesan'; return; }
        this.sending = true; this.sendMsg = '';
        var body = {title: this.formTitle, message: this.formMessage, target_role: this.selectedRole};
        if (this.selectedStudents.length > 0) body.recipient_ids = this.selectedStudents;
        fetch('/api/broadcast/send', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
        .then(r=>r.json()).then(d => {
            this.sending = false;
            if (d.success) { this.sendMsg = 'Terkirim ke ' + d.recipients + ' penerima'; this.formTitle = ''; this.formMessage = ''; this.selectedStudents = []; this.fetchNotifs(); this.fetchConversations(); }
            else { this.sendMsg = 'Gagal: ' + (d.error||''); }
        }).catch(()=>{ this.sending = false; this.sendMsg = 'Error koneksi'; });
    },
    startEdit(n) { this.editingId = n.id; this.editTitle = n.title; this.editMessage = n.message; },
    cancelEdit() { this.editingId = null; this.editTitle = ''; this.editMessage = ''; },
    saveEdit() {
        if (!this.editTitle || !this.editMessage) return;
        fetch('/api/broadcast/update', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:this.editingId, title:this.editTitle, message:this.editMessage})})
        .then(r=>r.json()).then(d => { if (d.success) { this.cancelEdit(); this.fetchNotifs(); } });
    },
    markReadHistory() {
        fetch('/api/broadcast/mark-read-all', { method: 'POST' }).then(() => {
            this.notifs.forEach(n => { n.read = true; });
            this.refreshBadge();
        }).catch(()=>{});
    },
    deleteMsg(n) {
        if (!confirm('Hapus pesan ini?')) return;
        fetch('/api/broadcast/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:n.id})})
        .then(r=>r.json()).then(d => { if (d.success) this.fetchNotifs(); });
    }
}" x-init="fetchConversations(); fetchNotifs(); $watch('activeTab', val => { if (val === 'history') { this.markReadHistory(); } })">
    <!-- Tab Navigation -->
    <div class="flex gap-1 bg-surface-100 rounded-xl p-1 overflow-x-auto">
        <button @click="activeTab='convs'; activeConv=null" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition whitespace-nowrap" :class="activeTab==='convs' ? 'bg-white text-primary-600 shadow-sm' : 'text-surface-500 hover:text-surface-700'"><i class="fas fa-comments mr-1.5"></i>Percakapan</button>
        <button @click="activeTab='broadcast'; activeConv=null" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition whitespace-nowrap" :class="activeTab==='broadcast' ? 'bg-white text-primary-600 shadow-sm' : 'text-surface-500 hover:text-surface-700'"><i class="fas fa-bullhorn mr-1.5"></i>Kirim Pengumuman</button>
        <button @click="activeTab='history'; activeConv=null" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition whitespace-nowrap" :class="activeTab==='history' ? 'bg-white text-primary-600 shadow-sm' : 'text-surface-500 hover:text-surface-700'"><i class="fas fa-history mr-1.5"></i>Riwayat</button>
    </div>

    <!-- Conversations -->
    <template x-if="activeTab === 'convs'">
        <div class="bg-white rounded-2xl shadow-lg shadow-surface-200/40 p-6 border border-surface-100">
            <template x-if="!activeConv">
                <div>
                    <h3 class="font-extrabold text-surface-800 mb-4"><i class="fas fa-comments text-primary-500 mr-2"></i>Percakapan dengan Murid</h3>
                    <template x-if="convsLoading"><div class="text-center py-8 text-surface-400"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat...</div></template>
                    <template x-if="!convsLoading && conversations.length === 0"><div class="text-center py-8 text-surface-400">Belum ada percakapan</div></template>
                    <div class="space-y-2" x-show="!convsLoading">
                        <template x-for="c in conversations" :key="c.id">
                            <div @click="openConv(c)" class="p-4 rounded-xl cursor-pointer transition border" :class="[c.status==='open' ? 'bg-surface-50 hover:bg-surface-100 border-surface-100' : 'bg-surface-50/50 border-surface-100 opacity-70', c.has_unread ? 'ring-2 ring-primary-300' : '']">
                                <div class="flex items-start justify-between">
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center gap-2">
                                            <span class="text-xs font-bold text-surface-500" x-text="c.other_name"></span>
                                            <span class="text-[10px] px-1.5 py-0.5 rounded-full font-bold" :class="c.other_role==='guru' ? 'bg-amber-100 text-amber-700' : (c.other_role==='admin_sekolah' ? 'bg-purple-100 text-purple-700' : (c.other_role==='murid' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'))" x-text="c.other_role==='guru' ? 'Guru' : (c.other_role==='admin_sekolah' ? 'Admin' : (c.other_role==='murid' ? 'Murid' : (c.other_role||'?')))"></span>
                                            <span class="text-[10px] px-1.5 py-0.5 rounded-full font-bold" :class="c.status==='open' ? 'bg-emerald-100 text-emerald-700' : 'bg-surface-200 text-surface-500'" x-text="c.status==='open' ? 'Aktif' : 'Selesai'"></span>
                                            <span x-show="c.has_unread" class="w-2 h-2 rounded-full bg-red-500 inline-block shrink-0"></span>
                                        </div>
                                        <p class="font-bold text-surface-800 mt-0.5 truncate" x-text="c.title"></p>
                                        <p class="text-xs text-surface-400 mt-0.5" x-text="c.last_message_at"></p>
                                    </div>
                                    <i class="fas fa-chevron-right text-surface-300 ml-2 mt-2"></i>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
            <template x-if="activeConv">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <button @click="activeConv=null; stopPolling()" class="text-sm font-bold text-primary-600 hover:text-primary-700"><i class="fas fa-arrow-left mr-1"></i>Kembali</button>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold" :class="activeConv.status==='open' ? 'bg-emerald-100 text-emerald-700' : 'bg-surface-200 text-surface-500'" x-text="activeConv.status==='open' ? 'Aktif' : 'Selesai'"></span>
                            <template x-if="activeConv.status==='open'">
                                <button @click="completeConv()" class="text-xs font-bold text-emerald-600 hover:text-emerald-700 border border-emerald-600 px-2.5 py-1 rounded-lg hover:bg-emerald-50 transition"><i class="fas fa-check mr-1"></i>Selesaikan</button>
                            </template>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-white font-bold text-xs shrink-0"><span x-text="(activeConv.other_name||'?')[0].toUpperCase()"></span></div>
                        <div>
                            <p class="font-bold text-surface-800 text-sm" x-text="activeConv.other_name"></p>
                            <p class="text-[10px] text-surface-400" x-text="'Percakapan: ' + activeConv.title"></p>
                        </div>
                    </div>
                    <div class="space-y-1 max-h-96 overflow-y-auto p-4 bg-[#efeae2] rounded-xl chat-scroll" style="background-image: url('data:image/svg+xml,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;200&quot; height=&quot;200&quot; opacity=&quot;0.04&quot;><rect width=&quot;200&quot; height=&quot;200&quot; fill=&quot;%23efeae2&quot;/><path d=&quot;M0 0l200 200M200 0L0 200&quot; stroke=&quot;%238d6e5c&quot; stroke-width=&quot;0.5&quot;/></svg>')">
                        <template x-for="(m, idx) in activeConv.messages" :key="m.id">
                            <div>
                                <div class="flex items-end gap-1.5" :class="m.is_mine ? 'justify-end' : 'justify-start'">
                                    <template x-if="!m.is_mine">
                                        <div class="w-7 h-7 rounded-full bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center text-white font-bold text-[10px] shrink-0 mb-0.5"><span x-text="(activeConv.other_name||'?')[0].toUpperCase()"></span></div>
                                    </template>
                                    <div class="max-w-[75%]">
                                        <template x-if="editingMsgId === m.id">
                                            <div class="bg-white rounded-2xl rounded-br-sm border border-primary-300 p-2 shadow-sm">
                                                <textarea x-model="editMsgText" rows="2" class="w-full px-2 py-1 border-0 focus:ring-0 text-sm resize-none outline-none"></textarea>
                                                <div class="flex gap-1.5 mt-1 justify-end">
                                                    <button @click="cancelEdit()" class="text-[10px] font-bold text-surface-500 px-2 py-1 rounded-lg hover:bg-surface-100">Batal</button>
                                                    <button @click="saveEditMsg()" class="text-[10px] font-bold text-white bg-primary-600 px-2.5 py-1 rounded-lg hover:bg-primary-700">Simpan</button>
                                                </div>
                                            </div>
                                        </template>
                                        <template x-if="editingMsgId !== m.id">
                                            <div class="group relative">
                                                <div class="px-3 py-2 shadow-sm" :class="m.is_mine ? 'bg-primary-500 text-white rounded-2xl rounded-br-sm' : 'bg-white text-surface-800 rounded-2xl rounded-bl-sm border border-surface-100'">
                                                    <div class="text-sm leading-relaxed whitespace-pre-wrap" x-html="linkify(m.message)"></div>
                                                </div>
                                                <template x-if="canEdit(m)">
                                                    <button @click="startEdit(m)" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-white shadow border border-surface-200 flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-surface-400 hover:text-primary-600"><i class="fas fa-pen text-[8px]"></i></button>
                                                </template>
                                            </div>
                                        </template>
                                        <p class="text-[9px] mt-0.5" :class="m.is_mine ? 'text-right text-surface-400 mr-1' : 'text-left text-surface-400 ml-1'" x-text="m.created_at ? m.created_at.slice(11,16) : ''"></p>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template x-if="(!activeConv.messages || activeConv.messages.length === 0)">
                            <p class="text-center text-xs text-surface-400 py-4">Belum ada pesan. Mulai percakapan.</p>
                        </template>
                    </div>
                    <template x-if="activeConv.status==='open'">
                        <div>
                            <div class="mt-3 flex items-end gap-2 bg-white rounded-2xl border border-surface-200 p-2">
                                <textarea x-model="replyMessage" rows="1" class="flex-1 px-3 py-2 border-0 focus:ring-0 text-surface-700 text-sm resize-none outline-none" placeholder="Ketik pesan..."></textarea>
                                <button @click="sendReply()" class="w-10 h-10 rounded-full bg-primary-600 hover:bg-primary-700 text-white flex items-center justify-center shrink-0 transition disabled:opacity-50 shadow-sm" :disabled="replying">
                                    <i class="fas fa-paper-plane text-sm"></i>
                                </button>
                            </div>
                            <p x-show="replyError" class="text-xs text-red-500 mt-1 text-right" x-text="replyError"></p>
                        </div>
                    </template>
                    <template x-if="activeConv.status!=='open'">
                        <p class="text-center text-xs font-bold text-surface-400 mt-4"><i class="fas fa-check-circle mr-1"></i>Percakapan selesai</p>
                    </template>
                </div>
            </template>
        </div>
    </template>

    <!-- Send Broadcast -->
    <template x-if="activeTab === 'broadcast'">
        <div class="bg-white rounded-2xl shadow-lg shadow-surface-200/40 p-6 border border-surface-100">
            <h3 class="font-extrabold text-surface-800 mb-4"><i class="fas fa-bullhorn text-primary-500 mr-2"></i>Kirim Pengumuman</h3>
            <form @submit.prevent="sendBroadcast()" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Kirim ke</label>
                    <select x-model="selectedRole" @change="selectedStudents=[]; fetchStudents()" class="w-full px-4 py-3 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 text-surface-700 font-medium bg-white">
                        <option value="murid">Semua Murid</option>
                        <option value="all">Pilih Murid Tertentu</option>
                    </select>
                </div>
                <template x-if="selectedRole === 'all'">
                    <div>
                        <label class="block text-sm font-bold text-surface-700 mb-1.5">Pilih Murid</label>
                        <button @click="toggleAllStudents()" type="button" class="text-xs font-bold text-primary-600 hover:text-primary-700 mb-2" x-text="selectedStudents.length === studentList.length ? 'Unselect Semua' : 'Pilih Semua'"></button>
                        <div class="max-h-48 overflow-y-auto border border-surface-200 rounded-xl p-2 space-y-1">
                            <template x-for="s in studentList" :key="s.id">
                                <label class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-surface-50 cursor-pointer">
                                    <input type="checkbox" :checked="selectedStudents.includes(s.id)" @change="toggleStudent(s.id)" class="rounded text-primary-600 focus:ring-primary-500">
                                    <span class="text-sm font-medium text-surface-700" x-text="s.full_name"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                </template>
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Judul</label>
                    <input type="text" x-model="formTitle" required class="w-full px-4 py-3 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 text-surface-700 font-medium">
                </div>
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Pesan</label>
                    <textarea x-model="formMessage" required rows="4" class="w-full px-4 py-3 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 text-surface-700 font-medium"></textarea>
                </div>
                <button type="submit" class="px-6 py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-bold shadow-lg transition" :disabled="sending">
                    <span x-text="sending ? 'Mengirim...' : 'Kirim Pengumuman'"></span>
                </button>
                <p x-show="sendMsg" class="text-xs font-bold" :class="sendMsg.includes('Terkirim') ? 'text-emerald-600' : 'text-red-600'" x-text="sendMsg"></p>
            </form>
        </div>
    </template>

    <!-- History -->
    <template x-if="activeTab === 'history'">
        <div class="bg-white rounded-2xl shadow-lg shadow-surface-200/40 p-6 border border-surface-100">
            <h3 class="font-extrabold text-surface-800 mb-4"><i class="fas fa-history text-primary-500 mr-2"></i>Riwayat Pengumuman</h3>
            <template x-if="loading"><div class="text-center py-8 text-surface-400"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat...</div></template>
            <template x-if="!loading && notifs.length === 0"><div class="text-center py-8 text-surface-400">Belum ada pengumuman</div></template>
            <div class="space-y-3">
                <template x-for="n in notifs" :key="n.id">
                    <div class="p-4 rounded-xl bg-surface-50 border border-surface-100">
                        <template x-if="editingId === n.id">
                            <div class="space-y-3">
                                <input type="text" x-model="editTitle" class="w-full px-4 py-2.5 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 text-surface-700 font-medium text-sm">
                                <textarea x-model="editMessage" rows="3" class="w-full px-4 py-2.5 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 text-surface-700 text-sm"></textarea>
                                <div class="flex gap-2">
                                    <button @click="saveEdit()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-xs">Simpan</button>
                                    <button @click="cancelEdit()" class="px-4 py-2 border border-surface-200 rounded-lg font-bold text-xs text-surface-600 hover:bg-surface-100">Batal</button>
                                </div>
                            </div>
                        </template>
                        <template x-if="editingId !== n.id">
                            <div class="flex items-start justify-between">
                                <div class="flex-1 min-w-0">
                                    <p class="font-bold text-surface-800" x-text="n.title"></p>
                                    <p class="text-sm text-surface-600 mt-1 whitespace-pre-wrap" x-html="linkify(n.message)"></p>
                                    <p class="text-[10px] font-medium text-surface-400 mt-1" x-text="'Target: ' + (n.sender_role || '-')"></p>
                                </div>
                                <div class="flex items-center gap-2 ml-3 shrink-0">
                                    <template x-if="n.can_edit">
                                        <button @click="startEdit(n)" class="text-xs text-primary-600 hover:text-primary-800 font-bold"><i class="fas fa-edit"></i></button>
                                    </template>
                                    <template x-if="n.can_edit">
                                        <button @click="deleteMsg(n)" class="text-xs text-red-500 hover:text-red-700 font-bold"><i class="fas fa-trash"></i></button>
                                    </template>
                                    <span class="text-[10px] font-medium text-surface-400 whitespace-nowrap" x-text="n.created_at"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </template>
</div>
{% endblock %}
