{% extends "base.html" %}
{% block title %}Papan Tulis - {{ whiteboard.title }}{% endblock %}
{% block content %}
<div class="h-screen flex flex-col" x-data="whiteboardCanvas()" x-init="initCanvas()">
    <!-- Top bar -->
    <div class="flex items-center justify-between px-4 py-2 border-b bg-white dark:bg-gray-900 shrink-0">
        <div class="flex items-center gap-3">
            <a href="/teacher/whiteboard" class="text-gray-500 hover:text-gray-700">&larr;</a>
            <h1 class="font-bold text-base truncate max-w-[200px]">{{ whiteboard.title }}</h1>
            <span class="text-xs text-gray-400" x-text="onlineCount + ' online'"></span>
        </div>
        <div class="flex items-center gap-2">
            <div id="timer-display" class="font-mono font-bold text-sm px-3 py-1 rounded-lg bg-gray-100 dark:bg-gray-800">00:00</div>
            <button @click="downloadPDF" class="btn btn-ghost text-sm py-1 px-3">
                <i class="fas fa-download"></i> PDF
            </button>
            <button @click="endSession" class="btn text-sm py-1 px-3 {{ 'bg-red-500 text-white' if whiteboard.status == 'active' else 'bg-gray-300 text-gray-500' }}">
                {{ 'Akhiri' if whiteboard.status == 'active' else 'Selesai' }}
            </button>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <!-- Left Toolbar -->
        <div class="w-12 md:w-14 bg-white dark:bg-gray-900 border-r flex flex-col items-center py-2 gap-1 shrink-0 overflow-y-auto">
            <button @click="setTool('pen')" :class="tool === 'pen' ? 'bg-primary-100 text-primary-600' : 'text-gray-500 hover:bg-gray-100'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Pena">
                <i class="fas fa-pen"></i>
            </button>
            <button @click="setTool('eraser')" :class="tool === 'eraser' ? 'bg-primary-100 text-primary-600' : 'text-gray-500 hover:bg-gray-100'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Penghapus">
                <i class="fas fa-eraser"></i>
            </button>
            <button @click="enableText()" :class="tool === 'text' ? 'bg-primary-100 text-primary-600' : 'text-gray-500 hover:bg-gray-100'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Teks">
                <i class="fas fa-font"></i>
            </button>
            <button @click="setTool('highlight')" :class="tool === 'highlight' ? 'bg-primary-100 text-primary-600' : 'text-gray-500 hover:bg-gray-100'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Stabilo">
                <i class="fas fa-highlighter"></i>
            </button>
            <button @click="setTool('laser')" :class="tool === 'laser' ? 'bg-primary-100 text-primary-600' : 'text-gray-500 hover:bg-gray-100'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Laser Pointer">
                <i class="fas fa-arrows-alt"></i>
            </button>
            <hr class="w-6 border-t my-1">
            <input type="color" x-model="color" @input="canvas?.setColor(color)" class="w-8 h-8 rounded cursor-pointer border-0 p-0" title="Warna">
            <hr class="w-6 border-t my-1">
            <button @click="canvas?.undo()" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm text-gray-500 hover:bg-gray-100" title="Undo">
                <i class="fas fa-undo"></i>
            </button>
            <button @click="canvas?.redo()" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm text-gray-500 hover:bg-gray-100" title="Redo">
                <i class="fas fa-redo"></i>
            </button>
            <button @click="canvas?.clearCanvas()" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm text-red-500 hover:bg-red-50" title="Bersihkan">
                <i class="fas fa-trash"></i>
            </button>
            <hr class="w-6 border-t my-1">
            <!-- Drawing Tools -->
            <button @click="toggleTool('ruler')" :class="rulerOn ? 'bg-violet-100 text-violet-700' : 'text-gray-500 hover:bg-gray-100'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Penggaris 30cm">
                <i class="fas fa-ruler-combined"></i>
            </button>
            <button @click="toggleTool('protractor')" :class="protractorOn ? 'bg-violet-100 text-violet-700' : 'text-gray-500 hover:bg-gray-100'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Busur 180°">
                <i class="fas fa-drafting-compass"></i>
            </button>
            <button @click="toggleTool('triangle')" :class="triangleOn ? 'bg-violet-100 text-violet-700' : 'text-gray-500 hover:bg-gray-100'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Segitiga Siku">
                <i class="fas fa-play"></i>
            </button>
            <button @click="setTool('compass')" :class="tool === 'compass' ? 'bg-violet-100 text-violet-700' : 'text-gray-500 hover:bg-gray-100'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Jangka">
                <i class="fas fa-circle"></i>
            </button>
            <button @click="canvas?.toggleCalculator()" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm text-gray-500 hover:bg-gray-100" title="Kalkulator Ilmiah">
                <i class="fas fa-calculator"></i>
            </button>
            <hr class="w-6 border-t my-1">
            <!-- Display Settings -->
            <button @click="showDisplay = !showDisplay" :class="showDisplay ? 'bg-teal-100 text-teal-700' : 'text-gray-500 hover:bg-gray-100'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Tampilan">
                <i class="fas fa-palette"></i>
            </button>
            <button @click="takeSnapshot()" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm text-gray-500 hover:bg-gray-100" title="Snapshot">
                <i class="fas fa-camera"></i>
            </button>
        </div>

        <!-- Display Settings Panel -->
        <div x-show="showDisplay" class="absolute left-14 top-16 z-20 bg-white dark:bg-gray-800 rounded-xl shadow-xl border p-4 w-64" style="display:none">
            <div class="font-bold text-xs text-gray-500 mb-3 uppercase tracking-wider">Tampilan</div>
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-gray-600 block mb-1">Mode Papan</label>
                    <div class="flex gap-2">
                        <button @click="boardMode='white'; canvas?.setBoardMode('white'); sendDisplaySettings()"
                                :class="boardMode==='white' ? 'bg-primary-100 border-primary-400 text-primary-700' : 'bg-gray-50 border-gray-200 text-gray-600'"
                                class="flex-1 text-xs font-bold py-1.5 rounded-lg border-2 transition">
                            <i class="far fa-square mr-1"></i>Putih
                        </button>
                        <button @click="boardMode='black'; canvas?.setBoardMode('black'); sendDisplaySettings()"
                                :class="boardMode==='black' ? 'bg-gray-800 border-gray-600 text-white' : 'bg-gray-50 border-gray-200 text-gray-600'"
                                class="flex-1 text-xs font-bold py-1.5 rounded-lg border-2 transition">
                            <i class="fas fa-square mr-1"></i>Hitam
                        </button>
                    </div>
                </div>
                <div>
                    <label class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-gray-600">Grid</span>
                        <button @click="gridEnabled=!gridEnabled; canvas?.toggleGrid(); sendDisplaySettings()"
                                :class="gridEnabled ? 'bg-primary-600' : 'bg-gray-300'"
                                class="w-9 h-5 rounded-full relative transition">
                            <span :class="gridEnabled ? 'translate-x-4' : 'translate-x-0'" class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition-transform"></span>
                        </button>
                    </label>
                    <div x-show="gridEnabled" class="mt-2 space-y-2">
                        <div>
                            <label class="text-xs text-gray-500">Jarak: <span x-text="gridSpacing + 'px'"></span></label>
                            <input type="range" x-model="gridSpacing" @input="canvas?.setGridSpacing(gridSpacing)" min="10" max="200" step="5" class="w-full">
                        </div>
                        <label class="flex items-center gap-2 text-xs text-gray-600 cursor-pointer">
                            <input type="checkbox" x-model="gridLog" @change="canvas?.setGridLogarithmic(gridLog); sendDisplaySettings()" class="rounded">
                            Skala Logaritmik (basis 10)
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <div class="flex-1 relative bg-gray-100 dark:bg-gray-800 overflow-hidden">
            <canvas id="whiteboard-canvas" class="absolute inset-0 w-full h-full cursor-crosshair"></canvas>

            <!-- Slide number overlay -->
            <div class="absolute bottom-16 left-1/2 -translate-x-1/2 bg-black/60 text-white text-xs px-3 py-1 rounded-full">
                Slide <span x-text="currentSlide + 1"></span>/<span x-text="slides.length"></span>
            </div>
        </div>

        <!-- Right Panel: Students -->
        <div class="w-60 bg-white dark:bg-gray-900 border-l flex flex-col shrink-0 hidden lg:flex">
            <div class="p-3 border-b font-semibold text-sm flex items-center justify-between">
                <span>Siswa (<span x-text="members.length"></span>)</span>
                <div class="flex gap-1">
                    <button @click="bulkApprove()" class="text-xs text-primary-600 hover:underline" title="Ijinkan semua">&#10003;</button>
                    <button @click="bulkRevoke()" class="text-xs text-red-500 hover:underline" title="Revoke semua">&#10007;</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-1 text-sm">
                <template x-for="m in members" :key="m.student_id">
                    <div class="flex items-center justify-between p-1.5 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800">
                        <div class="flex items-center gap-2 min-w-0">
                            <span :class="'w-2 h-2 rounded-full shrink-0 ' + (m.can_annotate ? 'bg-green-500' : 'bg-gray-300')"></span>
                            <span class="truncate" x-text="m.profiles?.full_name || 'Murid'"></span>
                        </div>
                        <div class="flex gap-1 shrink-0">
                            <template x-if="m.awaiting_approval">
                                <button @click="approveAnnotate(m.student_id)" class="text-primary-600 hover:bg-primary-50 p-1 rounded" title="Setujui">
                                    <i class="fas fa-check text-xs"></i>
                                </button>
                            </template>
                            <button @click="togglePermission(m)" :title="m.can_annotate ? 'Revoke' : 'Ijinkan'" class="p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">
                                <i class="fas" :class="m.can_annotate ? 'fa-user-check text-green-600' : 'fa-user-plus text-gray-400'"></i>
                            </button>
                        </div>
                    </div>
                </template>
                <div x-show="!members.length" class="text-center text-gray-400 py-4 text-xs">
                    Belum ada siswa
                </div>
            </div>

            <!-- Reactions display -->
            <div id="reaction-container" class="p-3 border-t flex gap-2 justify-center">
                <button @click="sendReaction('\u{1F44D}')" class="reaction-btn text-xl hover:scale-125 transition">&#x1F44D;</button>
                <button @click="sendReaction('\u2753')" class="reaction-btn text-xl hover:scale-125 transition">&#x2753;</button>
                <button @click="sendReaction('\u{1F680}')" class="reaction-btn text-xl hover:scale-125 transition">&#x1F680;</button>
            </div>
        </div>
    </div>

    <!-- Bottom slide navigator -->
    <div class="h-20 bg-white dark:bg-gray-900 border-t flex items-center px-4 gap-2 overflow-x-auto shrink-0" id="slide-container">
        <button @click="addSlide()" class="btn btn-ghost text-xs py-1 px-2 shrink-0">
            <i class="fas fa-plus"></i> Slide
        </button>
        <template x-for="(slide, i) in slides" :key="i">
            <div @click="goToSlide(i)" :class="'slide-thumb shrink-0 w-20 h-14 rounded-lg overflow-hidden cursor-pointer border-2 ' + (i === currentSlide ? 'border-primary-500' : 'border-gray-200 dark:border-gray-700')">
                <img x-show="slide.background_url" :src="slide.background_url" class="w-full h-full object-cover">
                <div x-show="!slide.background_url" class="w-full h-full flex items-center justify-center text-xs text-gray-400 bg-gray-100 dark:bg-gray-800">
                    <span x-text="i + 1"></span>
                </div>
                <button @click.stop="deleteSlide(i)" class="absolute top-0 right-0 w-4 h-4 bg-red-500 text-white text-xs rounded-full hidden" :class="{'hidden': slides.length <= 1}">&times;</button>
            </div>
        </template>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/vendor/socket.io.min.js"></script>
<script src="/static/js/tools.js"></script>
<script src="/static/js/whiteboard-canvas.js"></script>
<script src="/static/js/whiteboard-websocket.js"></script>
<script src="/static/js/whiteboard-slides.js"></script>
<script src="/static/js/whiteboard-timer.js"></script>
<script>
function whiteboardCanvas() {
    return {
        whiteboardId: "{{ whiteboard.id }}",
        slides: {{ slides | tojson | safe }},
        members: {{ members | tojson | safe }},
        currentSlide: 0,
        tool: "pen",
        color: "#000000",
        onlineCount: 0,
        canvas: null,
        ws: null,
        slideNav: null,
        timer: null,
        heartbeatInterval: null,
        showDisplay: false,
        boardMode: "white",
        gridEnabled: false,
        gridSpacing: 50,
        gridLog: false,
        rulerOn: false,
        protractorOn: false,
        triangleOn: false,

        initCanvas() {
            // Restore display settings from server
            {% if whiteboard.display_settings %}
            {% set ds = whiteboard.display_settings if whiteboard.display_settings is mapping else {} %}
            this.boardMode = "{{ ds.get('board_mode', 'white') }}";
            this.gridEnabled = {{ 'true' if ds.get('grid_enabled') else 'false' }};
            this.gridSpacing = {{ ds.get('grid_spacing', 50) }};
            this.gridLog = {{ 'true' if ds.get('grid_logarithmic') else 'false' }};
            {% endif %}

            this.canvas = new WhiteboardCanvas("whiteboard-canvas", {
                onDraw: (op) => { this.ws?.sendDraw(op.op_type, op.data); },
                onCursor: (pos) => { this.ws?.sendCursor(pos.x, pos.y); },
                onToolState: (type, state) => {
                    if (this.ws) this.ws.sendToolState(type, state);
                },
                onToolToggle: (type, visible) => {
                    if (type === 'ruler') this.rulerOn = visible;
                    else if (type === 'protractor') this.protractorOn = visible;
                    else if (type === 'triangle') this.triangleOn = visible;
                },
            });

            // Apply restored display settings
            this.canvas.setBoardMode(this.boardMode);
            if (this.gridEnabled) { this.canvas.gridEnabled = true; this.canvas.gridSpacing = this.gridSpacing; this.canvas.setGridLogarithmic(this.gridLog); }
            this.canvas._render();

            this.ws = new WhiteboardSocket(this.whiteboardId, {
                onConnect: () => { this.startHeartbeat(); },
                onDrawOp: (data) => { this.canvas.replayOp(data); },
                onCursorMove: (data) => { /* render remote cursor */ },
                onAnnotateRequest: (data) => {
                    const m = this.members.find(x => x.student_id === data.student_id);
                    if (m) m.awaiting_approval = true;
                },
                onAnnotateApproved: (data) => {
                    const m = this.members.find(x => x.student_id === data.student_id);
                    if (m) { m.can_annotate = true; m.awaiting_approval = false; }
                },
                onAnnotateRevoked: (data) => {
                    const m = this.members.find(x => x.student_id === data.student_id);
                    if (m) m.can_annotate = false;
                },
                onSlideChanged: (data) => { this.goToSlide(data.slide_number - 1); },
                onTimerUpdate: (data) => { this.timer?.syncRemote(data.seconds, data.running); },
                onReaction: (data) => { /* show bubble */ },
                onUserJoined: () => { this.onlineCount++; },
                onUserLeft: () => { this.onlineCount = Math.max(0, this.onlineCount - 1); },
            });
            this.ws.connect();

            this.slideNav = new WhiteboardSlides("slide-container", {
                onChange: (i, slide) => {
                    this.currentSlide = i;
                    this.loadSlide(slide);
                    this.ws?.sendSlideChange(i + 1);
                },
            });
            this.slideNav.setSlides(this.slides);

            this.timer = new WhiteboardTimer("timer-display");

            // Load first slide background
            if (this.slides.length > 0) {
                this.loadSlide(this.slides[0]);
            }
        },

        loadSlide(slide) {
            this.canvas.setBackground(slide.background_url || null);
            fetch(`/teacher/api/whiteboard/${this.whiteboardId}/ops?slide=${slide.slide_number}`)
                .then(r => r.json())
                .then(d => { if (d.ops) this.canvas.loadOps(d.ops); })
                .catch(() => {});
        },

        setTool(t) {
            this.tool = t;
            if (t === "laser") { this.canvas.setTool("laser"); return; }
            if (t === "text") return;
            if (t === "compass") { this.canvas.setTool("compass"); return; }
            this.canvas.setTool(t);
        },

        enableText() {
            this.tool = "text";
            this.canvas.enableTextMode();
        },

        toggleTool(type) {
            this.canvas.toggleTool(type);
            if (type === "ruler") this.rulerOn = !this.rulerOn;
            else if (type === "protractor") this.protractorOn = !this.protractorOn;
            else if (type === "triangle") this.triangleOn = !this.triangleOn;
            if (this.ws) this.ws.sendToolState(type, { visible: this.canvas.toolState[type].visible });
        },

        sendDisplaySettings() {
            if (!this.ws) return;
            this.ws.sendDisplaySettings({
                board_mode: this.boardMode,
                grid_enabled: this.gridEnabled,
                grid_spacing: this.gridSpacing,
                grid_logarithmic: this.gridLog,
            });
            // Persist to server
            fetch(`/teacher/api/whiteboard/${this.whiteboardId}/display-settings`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    board_mode: this.boardMode,
                    grid_enabled: this.gridEnabled,
                    grid_spacing: this.gridSpacing,
                    grid_logarithmic: this.gridLog,
                }),
            }).catch(() => {});
        },

        goToSlide(i) {
            if (i < 0 || i >= this.slides.length) return;
            this.currentSlide = i;
            this.slideNav.goTo(i);
            this.loadSlide(this.slides[i]);
            this.ws?.sendSlideChange(i + 1);
        },

        addSlide() {
            fetch(`/teacher/api/whiteboard/${this.whiteboardId}/slides`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({}),
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) window.location.reload();
            })
            .catch(() => {});
        },

        deleteSlide(i) {
            if (this.slides.length <= 1) return;
            const slide = this.slides[i];
            fetch(`/teacher/api/whiteboard/${this.whiteboardId}/slides/${slide.slide_number}`, { method: "DELETE" })
                .then(r => r.json())
                .then(d => {
                    if (d.success) {
                        this.slides.splice(i, 1);
                        this.slideNav.removeSlide(i);
                        if (this.currentSlide >= this.slides.length) this.currentSlide = this.slides.length - 1;
                        this.loadSlide(this.slides[this.currentSlide]);
                    }
                });
        },

        togglePermission(m) {
            fetch(`/teacher/api/whiteboard/${this.whiteboardId}/permission`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ student_id: m.student_id, can_annotate: !m.can_annotate }),
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    m.can_annotate = !m.can_annotate;
                    if (m.can_annotate) this.ws?.approveAnnotate(m.student_id);
                    else this.ws?.revokeAnnotate(m.student_id);
                }
            });
        },

        approveAnnotate(studentId) {
            fetch(`/teacher/api/whiteboard/${this.whiteboardId}/permission`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ student_id: studentId, can_annotate: true }),
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    const m = this.members.find(x => x.student_id === studentId);
                    if (m) { m.can_annotate = true; m.awaiting_approval = false; }
                    this.ws?.approveAnnotate(studentId);
                }
            });
        },

        bulkApprove() {
            fetch(`/teacher/api/whiteboard/${this.whiteboardId}/permission`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ bulk: "all", can_annotate: true }),
            }).then(r => r.json());
            this.members.forEach(m => m.can_annotate = true);
        },

        bulkRevoke() {
            fetch(`/teacher/api/whiteboard/${this.whiteboardId}/permission`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ bulk: "all", can_annotate: false }),
            }).then(r => r.json());
            this.members.forEach(m => m.can_annotate = false);
        },

        sendReaction(emoji) {
            fetch(`/student/api/whiteboard/${this.whiteboardId}/reaction`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ emoji }),
            });
        },

        takeSnapshot() {
            const dataUrl = this.canvas.toDataURL();
            fetch(`/teacher/api/whiteboard/${this.whiteboardId}/snapshots`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ slide_number: this.currentSlide + 1, image_data: dataUrl }),
            })
            .then(r => r.json())
            .then(d => { if (d.success) alert("Snapshot tersimpan"); });
        },

        startHeartbeat() {
            this.heartbeatInterval = setInterval(() => this.ws?.sendHeartbeat(), 5000);
            this.onlineCount++;
        },

        downloadPDF() {
            window.open(`/teacher/whiteboard/${this.whiteboardId}/download`, "_blank");
        },

        endSession() {
            if (!confirm("Akhiri sesi papan tulis? Semua murid akan kembali ke halaman daftar.")) return;
            fetch(`/teacher/api/whiteboard/${this.whiteboardId}`, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ status: "ended" }),
            })
            .then(r => r.json())
            .then(d => { if (d.success) window.location.href = "/teacher/whiteboard"; });
        },

        destroy() {
            if (this.heartbeatInterval) clearInterval(this.heartbeatInterval);
            this.ws?.disconnect();
        },
    };
}
</script>
{% endblock %}
