{% extends "base.html" %}
{% block title %}Papan Tulis - {{ whiteboard.title }}{% endblock %}
{% block content %}
<div class="h-screen flex flex-col" x-data="whiteboardCanvas()" x-init="init()">
    <!-- Top bar -->
    <div class="flex items-center justify-between px-3 py-1.5 border-b bg-white dark:bg-gray-900 shrink-0">
        <div class="flex items-center gap-2">
            <a href="/wb/teacher/whiteboard" class="text-gray-500 hover:text-gray-700 text-sm">&larr;</a>
            <h1 class="font-bold text-sm truncate max-w-[160px]">{{ whiteboard.title }}</h1>
            <span class="text-[10px] text-gray-400" x-text="onlineCount>0 ? onlineCount+' online' : ''"></span>
        </div>
        <div class="flex items-center gap-1">
            <button @click="boardMode='white';c.setBoardMode('white');sendDisplay()" :class="boardMode==='white'?'bg-primary-100 border-primary-400 text-primary-700':'bg-white border-gray-200 text-gray-500'" class="text-[10px] font-bold px-1.5 py-0.5 rounded border-2 hidden md:inline"><i class="far fa-square"></i></button>
            <button @click="boardMode='black';c.setBoardMode('black');sendDisplay()" :class="boardMode==='black'?'bg-gray-800 border-gray-600 text-white':'bg-white border-gray-200 text-gray-500'" class="text-[10px] font-bold px-1.5 py-0.5 rounded border-2 hidden md:inline"><i class="fas fa-square"></i></button>
            <button @click="g=!g;c.toggleGrid();sendDisplay()" :class="g?'bg-primary-100 text-primary-700 border-primary-300':'bg-white text-gray-500 border-gray-200'" class="text-[10px] font-bold px-1.5 py-0.5 rounded border-2 hidden md:inline"><i class="fas fa-border-all"></i></button>
            <span class="w-px h-4 bg-gray-200 mx-0.5 hidden md:block"></span>
            <div id="timer" class="font-mono font-bold text-xs px-1.5 py-0.5 rounded bg-gray-100">00:00</div>
            <input type="file" accept=".pdf,.png,.jpg,.jpeg" id="fu" class="hidden" @change="uploadFile($event)">
            <button @click="document.getElementById('fu').click()" class="btn btn-ghost text-[11px] py-0.5 px-1.5"><i class="fas fa-file-upload"></i></button>
            <button @click="downloadPDF()" class="btn btn-ghost text-[11px] py-0.5 px-1.5"><i class="fas fa-download"></i></button>
            <button @click="endSession()" class="btn text-[11px] py-0.5 px-1.5 {{ 'bg-red-500 text-white' if whiteboard.status=='active' else 'bg-gray-300 text-gray-500' }}">{{ 'Akhiri' if whiteboard.status=='active' else 'Selesai' }}</button>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <!-- Toolbar -->
        <div class="w-12 bg-white dark:bg-gray-900 border-r flex flex-col items-center py-1 gap-0.5 shrink-0 overflow-y-auto">
            <button @click="t='pen';c.setTool('pen')" :class="t==='pen'?'bg-primary-100 text-primary-600':'text-gray-500 hover:bg-primary-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Pena"><i class="fas fa-pen"></i></button>
            <button @click="t='eraser';c.setTool('eraser')" :class="t==='eraser'?'bg-primary-100 text-primary-600':'text-gray-500 hover:bg-primary-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Penghapus"><i class="fas fa-eraser"></i></button>
            <button @click="textMode()" :class="t==='text'?'bg-primary-100 text-primary-600':'text-gray-500 hover:bg-primary-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Teks"><i class="fas fa-font"></i></button>
            <button @click="t='highlight';c.setTool('highlight')" :class="t==='highlight'?'bg-primary-100 text-primary-600':'text-gray-500 hover:bg-primary-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Stabilo"><i class="fas fa-highlighter"></i></button>
            <button @click="t='laser';c.setTool('laser')" :class="t==='laser'?'bg-primary-100 text-primary-600':'text-gray-500 hover:bg-primary-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Laser"><i class="fas fa-crosshairs"></i></button>
            <hr class="w-5 border-t my-0.5">
            <input type="color" x-model="col" @input="c.setColor(col)" class="w-6 h-6 rounded cursor-pointer border-0 p-0" title="Warna">
            <div x-data="{o:false}">
                <button @click="o=!o" class="w-9 h-9 rounded-lg flex items-center justify-center text-[10px] font-bold text-gray-500 hover:bg-primary-50 relative" title="Ukuran Pena">
                    <span x-text="pw.toFixed(1)"></span>
                </button>
                <div x-show="o" @click.outside="o=false" class="absolute left-12 top-36 z-30 bg-white dark:bg-gray-800 rounded-xl shadow-xl border p-3 w-48" style="display:none">
                    <div class="text-[10px] font-bold text-gray-500 mb-1.5 uppercase tracking-wider">Ukuran Pena</div>
                    <div class="flex items-center gap-2 mb-2">
                        <input type="number" x-model="pw" @input="c.setWidth(pw); $refs.range.value=pw" min="0.1" max="20" step="0.1" class="w-full text-xs font-bold border rounded-lg px-2 py-1 text-center">
                        <span class="text-[10px] text-gray-400 font-semibold">px</span>
                    </div>
                    <input type="range" x-ref="range" x-model="pw" @input="c.setWidth(pw)" min="0.1" max="20" step="0.1" class="w-full">
                    <div class="flex justify-between text-[9px] text-gray-400 mt-0.5"><span>0.1</span><span>5</span><span>10</span><span>20</span></div>
                    <div class="flex flex-wrap gap-1 mt-2">
                        <button @click="pw=0.1;c.setWidth(0.1);o=false" class="px-2 py-0.5 text-[10px] rounded bg-gray-100 hover:bg-gray-200 font-semibold">0.1</button>
                        <button @click="pw=0.5;c.setWidth(0.5);o=false" class="px-2 py-0.5 text-[10px] rounded bg-gray-100 hover:bg-gray-200 font-semibold">0.5</button>
                        <button @click="pw=0.75;c.setWidth(0.75);o=false" class="px-2 py-0.5 text-[10px] rounded bg-gray-100 hover:bg-gray-200 font-semibold">0.75</button>
                        <button @click="pw=1;c.setWidth(1);o=false" class="px-2 py-0.5 text-[10px] rounded bg-gray-100 hover:bg-gray-200 font-semibold">1</button>
                        <button @click="pw=1.5;c.setWidth(1.5);o=false" class="px-2 py-0.5 text-[10px] rounded bg-gray-100 hover:bg-gray-200 font-semibold">1.5</button>
                        <button @click="pw=3;c.setWidth(3);o=false" class="px-2 py-0.5 text-[10px] rounded bg-gray-100 hover:bg-gray-200 font-semibold">3</button>
                        <button @click="pw=5;c.setWidth(5);o=false" class="px-2 py-0.5 text-[10px] rounded bg-gray-100 hover:bg-gray-200 font-semibold">5</button>
                        <button @click="pw=8;c.setWidth(8);o=false" class="px-2 py-0.5 text-[10px] rounded bg-gray-100 hover:bg-gray-200 font-semibold">8</button>
                    </div>
                </div>
            </div>
            <hr class="w-5 border-t my-0.5">
            <button @click="c.undo()" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm text-gray-500 hover:bg-primary-50" title="Undo"><i class="fas fa-undo"></i></button>
            <button @click="c.redo()" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm text-gray-500 hover:bg-primary-50" title="Redo"><i class="fas fa-redo"></i></button>
            <button @click="c.clearCanvas()" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm text-red-500 hover:bg-red-50" title="Bersihkan"><i class="fas fa-trash"></i></button>
            <hr class="w-5 border-t my-0.5">
            <button @click="rulerOn=!rulerOn;if(rulerOn){rulerX=c.canvas.width/2-250;rulerY=c.canvas.height/2-35}" :class="rulerOn?'bg-violet-100 text-violet-700':'text-gray-500 hover:bg-violet-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Penggaris"><i class="fas fa-ruler-combined"></i></button>
            <button @click="protOn=!protOn;if(protOn){protX=c.canvas.width/2-150;protY=c.canvas.height/2-150}" :class="protOn?'bg-violet-100 text-violet-700':'text-gray-500 hover:bg-violet-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Busur"><i class="fas fa-drafting-compass"></i></button>
            <button @click="triOn=!triOn;if(triOn){triX=c.canvas.width/2-150;triY=c.canvas.height/2-150}" :class="triOn?'bg-violet-100 text-violet-700':'text-gray-500 hover:bg-violet-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Segitiga"><i class="fas fa-play"></i></button>
            <button @click="t='compass';c.setTool('compass')" :class="t==='compass'?'bg-violet-100 text-violet-700':'text-gray-500 hover:bg-violet-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm" title="Jangka"><i class="fas fa-circle"></i></button>
            <button @click="c.toggleCalculator()" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm text-gray-500 hover:bg-primary-50" title="Kalkulator"><i class="fas fa-calculator"></i></button>
            <hr class="w-5 border-t my-0.5">
            <button @click="snapshot()" class="w-9 h-9 rounded-lg flex items-center justify-center text-sm text-gray-500 hover:bg-primary-50" title="Snapshot"><i class="fas fa-camera"></i></button>
        </div>

        <!-- Canvas -->
        <div class="flex-1 relative bg-gray-100 dark:bg-gray-800" style="overflow:auto;min-height:0" id="cw">
            <div id="wb-stage" style="width:3000px;height:3000px;position:relative">
                <canvas id="wb-canvas" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas>

            <!-- Ruler overlay -->
            <div x-show="rulerOn" class="absolute" :style="{left:rulerX+'px',top:rulerY+'px',transform:'rotate('+rulerAngle+'deg)',transformOrigin:'20px 35px',zIndex:10}">
                <svg width="500" height="70" viewBox="0 0 500 70" style="overflow:visible;pointer-events:none">
                    <rect x="0" y="0" width="500" height="70" rx="6" fill="rgba(235,242,255,0.4)" stroke="rgba(0,80,200,0.5)" stroke-width="1.5"/>
                    <g id="rm" x-init="rmk($el)"></g>
                    <circle cx="20" cy="35" r="10" fill="rgba(0,80,200,0.8)" stroke="white" stroke-width="1.5" style="cursor:move;pointer-events:auto" @mousedown.prevent="drg('ruler',$event)" @touchstart.prevent="drg('ruler',$event.touches[0])"/>
                    <circle cx="475" cy="14" r="9" fill="rgba(200,50,0,0.85)" stroke="white" stroke-width="1.5" style="cursor:alias;pointer-events:auto" @mousedown.prevent="rot('ruler',$event)" @touchstart.prevent="rot('ruler',$event.touches[0])"/>
                    <rect x="0" y="0" width="22" height="22" rx="4" fill="rgba(200,50,50,0.7)" stroke="white" stroke-width="1" style="cursor:pointer;pointer-events:auto" @click="rulerOn=false"/>
                    <text x="6" y="15" font-size="12" fill="white" font-weight="bold" style="pointer-events:none">&times;</text>
                </svg>
            </div>

            <!-- Protractor -->
            <div x-show="protOn" class="absolute" :style="{left:protX+'px',top:protY+'px',transform:'rotate('+protAngle+'deg)',transformOrigin:protCX+'px '+protCY+'px',zIndex:10}">
                <svg width="300" height="300" viewBox="0 0 300 300" style="overflow:visible;pointer-events:none">
                    <rect x="0" y="0" width="300" height="300" rx="4" fill="rgba(235,242,255,0.4)" stroke="rgba(0,80,200,0.4)" stroke-width="1"/>
                    <g id="pm" x-init="pmk($el)"></g>
                    <circle :cx="protCX" :cy="protCY" r="10" fill="rgba(0,80,200,0.8)" stroke="white" stroke-width="1.5" style="cursor:move;pointer-events:auto" @mousedown.prevent="drg('prot',$event)" @touchstart.prevent="drg('prot',$event.touches[0])"/>
                    <circle :cx="protCX" cy="20" r="9" fill="rgba(200,50,0,0.85)" stroke="white" stroke-width="1.5" style="cursor:alias;pointer-events:auto" @mousedown.prevent="rot('prot',$event)" @touchstart.prevent="rot('prot',$event.touches[0])"/>
                    <rect x="0" y="0" width="22" height="22" rx="4" fill="rgba(200,50,50,0.7)" stroke="white" stroke-width="1" style="cursor:pointer;pointer-events:auto" @click="protOn=false"/>
                    <text x="6" y="15" font-size="12" fill="white" font-weight="bold" style="pointer-events:none">&times;</text>
                </svg>
            </div>

            <!-- Triangle -->
            <div x-show="triOn" class="absolute" :style="{left:triX+'px',top:triY+'px',transform:'rotate('+triAngle+'deg)',transformOrigin:triRX+'px '+triRY+'px',zIndex:10}">
                <svg :width="triS" :height="triS" :viewBox="'0 0 '+triS+' '+triS" style="overflow:visible;pointer-events:none">
                    <polygon :points="'10,'+triS+' 10,10 '+triS+','+triS" fill="rgba(235,242,255,0.4)" stroke="rgba(0,80,200,0.5)" stroke-width="1.5"/>
                    <circle cx="10" :cy="triS" r="10" fill="rgba(0,80,200,0.8)" stroke="white" stroke-width="1.5" style="cursor:move;pointer-events:auto" @mousedown.prevent="drg('tri',$event)" @touchstart.prevent="drg('tri',$event.touches[0])"/>
                    <circle cx="10" cy="10" r="9" fill="rgba(200,50,0,0.85)" stroke="white" stroke-width="1.5" style="cursor:alias;pointer-events:auto" @mousedown.prevent="rot('tri',$event)" @touchstart.prevent="rot('tri',$event.touches[0])"/>
                    <rect x="0" y="0" width="22" height="22" rx="4" fill="rgba(200,50,50,0.7)" stroke="white" stroke-width="1" style="cursor:pointer;pointer-events:auto" @click="triOn=false"/>
                    <text x="6" y="15" font-size="12" fill="white" font-weight="bold" style="pointer-events:none">&times;</text>
                </svg>
            </div>

            <div class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full pointer-events-none">Slide <span x-text="slideIdx+1"></span>/<span x-text="slides.length"></span></div>
            </div><!-- end wb-stage -->
        </div>

        <!-- Student Panel -->
        <div class="w-52 bg-white dark:bg-gray-900 border-l flex flex-col shrink-0 hidden lg:flex">
            <div class="p-2 border-b font-semibold text-xs flex items-center justify-between">
                <span>Siswa (<span x-text="members.length"></span>)</span>
                <div class="flex gap-1">
                    <button @click="bulkApprove()" class="text-[10px] text-primary-600 hover:underline" title="Ijinkan semua">&#10003;</button>
                    <button @click="bulkRevoke()" class="text-[10px] text-red-500 hover:underline" title="Revoke">&#10007;</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-1.5 space-y-0.5 text-xs">
                <template x-for="m in members" :key="m.student_id">
                    <div class="flex items-center justify-between p-1 rounded hover:bg-gray-50">
                        <div class="flex items-center gap-1.5 min-w-0">
                            <span :class="'w-1.5 h-1.5 rounded-full shrink-0 '+(m.can_annotate?'bg-green-500':'bg-gray-300')"></span>
                            <span class="truncate" x-text="m.profiles?.full_name||'Murid'"></span>
                        </div>
                        <template x-if="m.awaiting_approval">
                            <button @click="approve(m.student_id)" class="text-primary-600 p-0.5 rounded" title="Setujui"><i class="fas fa-check text-[10px]"></i></button>
                        </template>
                        <button @click="togglePerm(m)" :title="m.can_annotate?'Revoke':'Ijinkan'" class="p-0.5 rounded hover:bg-gray-200">
                            <i class="fas" :class="m.can_annotate?'fa-user-check text-green-600':'fa-user-plus text-gray-400'"></i>
                        </button>
                    </div>
                </template>
                <div x-show="!members.length" class="text-center text-gray-400 py-3 text-[10px]">Belum ada siswa</div>
            </div>
            <div id="reactions" class="p-2 border-t flex gap-1 justify-center">
                <button @click="sendReact('\u{1F44D}')" class="text-lg hover:scale-125 transition">&#x1F44D;</button>
                <button @click="sendReact('\u2753')" class="text-lg hover:scale-125 transition">&#x2753;</button>
                <button @click="sendReact('\u{1F680}')" class="text-lg hover:scale-125 transition">&#x1F680;</button>
            </div>
        </div>
    </div>

    <!-- Bottom slide bar -->
    <div class="h-14 bg-white dark:bg-gray-900 border-t flex items-center px-2 gap-1 overflow-x-auto shrink-0" id="slide-bar">
        <button @click="addSlide()" class="btn btn-ghost text-[10px] py-0.5 px-1 shrink-0"><i class="fas fa-plus"></i></button>
        <template x-for="(sl,i) in slides" :key="i">
            <div @click="goToSlide(i)" :class="'shrink-0 w-14 h-10 rounded overflow-hidden cursor-pointer border-2 '+(i===slideIdx?'border-primary-500':'border-gray-200')">
                <img x-show="sl.background_url" :src="sl.background_url" class="w-full h-full object-cover">
                <div x-show="!sl.background_url" class="w-full h-full flex items-center justify-center text-[10px] text-gray-400 bg-gray-100"><span x-text="i+1"></span></div>
                <button @click.stop="delSlide(i)" class="absolute top-0 right-0 w-3 h-3 bg-red-500 text-white text-[8px] rounded-full hidden" :class="{'hidden':slides.length<=1}">&times;</button>
            </div>
        </template>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/vendor/socket.io.min.js"></script>
<script src="/static/js/tools.js"></script>
<script src="/static/js/whiteboard-canvas.js"></script>
<script src="/static/js/whiteboard-websocket.js"></script>
<script src="/static/js/whiteboard-timer.js"></script>
<script>
function whiteboardCanvas() {
    return {
        whiteboardId: "{{ whiteboard.id }}",
        slides: {{ slides | tojson | safe }},
        members: {{ members | tojson | safe }},
        slideIdx: 0, t: "pen", col: "#000000", pw: 0.75, onlineCount: 0,
        c: null, ws: null, timer: null, hb: null,
        boardMode: "white", g: false, gridSpacing: 50, gridLog: false,
        rulerOn: false, rulerX: 60, rulerY: 80, rulerAngle: 0,
        protOn: false, protX: 100, protY: 50, protAngle: 0, protCX: 150, protCY: 264,
        triOn: false, triX: 160, triY: 120, triAngle: 0, triS: 300, triRX: 10, triRY: 10,
        _drg: null,

        init() {
            {% if whiteboard.display_settings and whiteboard.display_settings is mapping %}
            {% set ds = whiteboard.display_settings %}
            this.boardMode = "{{ ds.get('board_mode','white') }}";
            this.g = {{ 'true' if ds.get('grid_enabled') else 'false' }};
            this.gridSpacing = {{ ds.get('grid_spacing',50) }};
            this.gridLog = {{ 'true' if ds.get('grid_logarithmic') else 'false' }};
            {% endif %}

            this.c = new WhiteboardCanvas("wb-canvas", {
                onDraw: (op) => { this.ws?.sendDraw(op.op_type, op.data); },
                onCursor: (pos) => { this.ws?.sendCursor(pos.x, pos.y); },
            });
            this.c.setBoardMode(this.boardMode);
            this.c.setWidth(this.pw);
            if (this.g) { this.c.gridEnabled = true; this.c.gridSpacing = this.gridSpacing; this.c.setGridLogarithmic(this.gridLog); }
            this.c._render();

            this.ws = new WhiteboardSocket(this.whiteboardId, {
                onConnect: () => { this.hb=setInterval(()=>this.ws?.sendHeartbeat(),5000); this.onlineCount++; },
                onDrawOp: (data) => { this.c.replayOp(data); },
                onSlideChanged: (data) => { this.goToSlide(data.slide_number-1); },
                onTimerUpdate: (data) => { this.timer?.syncRemote(data.seconds, data.running); },
                onDisplaySettingsUpdate: (data) => {
                    if(data.board_mode){ this.boardMode=data.board_mode; this.c.setBoardMode(data.board_mode); }
                    if(data.grid_enabled!==undefined){ this.g=data.grid_enabled; this.c.gridEnabled=data.g; }
                    if(data.grid_spacing){ this.gridSpacing=data.grid_spacing; this.c.gridSpacing=data.grid_spacing; }
                    if(data.grid_logarithmic!==undefined){ this.gridLog=data.grid_logarithmic; this.c.setGridLogarithmic(data.grid_logarithmic); }
                    this.c._render();
                },
            });
            this.ws.connect();
            this.timer = new WhiteboardTimer("timer");
            if (this.slides.length > 0) this.loadSlide(this.slides[0]);
        },

        loadSlide(sl) { this.c.setBackground(sl.background_url||null); fetch(`/wb/teacher/api/whiteboard/${this.whiteboardId}/ops?slide=${sl.slide_number}`).then(r=>r.json()).then(d=>{if(d.ops)this.c.loadOps(d.ops);}).catch(()=>{}); },
        goToSlide(i) { if(i<0||i>=this.slides.length)return; this.slideIdx=i; this.loadSlide(this.slides[i]); this.ws?.sendSlideChange(i+1); },

        textMode() { this.t="text"; this.c.enableTextMode(); },

        // Tool marks
        rmk(el) { if(el&&ScanGradeTools) el.innerHTML = ScanGradeTools.rulerSvg(500,70); },
        pmk(el) { if(el&&ScanGradeTools) el.innerHTML = ScanGradeTools.protractorSvg(150,264,126); },

        // Drag/Rotate
        drg(which, e) {
            const st = {ruler:'ruler',prot:'prot',tri:'tri'}[which];
            const p = which==='ruler'?'ruler':which==='prot'?'prot':which==='tri'?'tri':'';
            this._drg = {which:p, sx: e.clientX, sy: e.clientY, ox: this[p+(p==='ruler'?'X':p==='prot'?'X':'X')], oy: this[p+(p==='ruler'?'Y':p==='prot'?'Y':'Y')]};
            this._onDragMove = (ev) => {
                if(!this._drg)return;
                const dx=(ev.clientX||ev.touches[0].clientX)-this._drg.sx, dy=(ev.clientY||ev.touches[0].clientY)-this._drg.sy;
                const p=this._drg.which;
                this[p+'X']=this._drg.ox+dx; this[p+'Y']=this._drg.oy+dy;
            };
            this._onDragEnd = () => { this._drg=null; document.removeEventListener('mousemove',this._onDragMove); document.removeEventListener('mouseup',this._onDragEnd); };
            document.addEventListener('mousemove',this._onDragMove); document.addEventListener('mouseup',this._onDragEnd);
        },
        rot(which, e) {
            const p = {ruler:'ruler',prot:'prot',tri:'tri'}[which];
            this._drg = {which:p, sx:e.clientX, sy:e.clientY, sa:Math.atan2(e.clientY-this[p+'Y'],e.clientX-this[p+'X'])*180/Math.PI, oa:this[p+'Angle']};
            this._onDragMove = (ev) => { if(!this._drg)return; const a=Math.atan2((ev.clientY||ev.touches[0].clientY)-this[p+'Y'],(ev.clientX||ev.touches[0].clientX)-this[p+'X'])*180/Math.PI; this[p+'Angle']=this._drg.oa+(a-this._drg.sa); };
            this._onDragEnd = () => { this._drg=null; document.removeEventListener('mousemove',this._onDragMove); document.removeEventListener('mouseup',this._onDragEnd); };
            document.addEventListener('mousemove',this._onDragMove); document.addEventListener('mouseup',this._onDragEnd);
        },

        sendDisplay() { this.ws?.sendDisplaySettings({board_mode:this.boardMode,grid_enabled:this.g,grid_spacing:this.gridSpacing,grid_logarithmic:this.gridLog}); fetch(`/wb/teacher/api/whiteboard/${this.whiteboardId}/display-settings`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({board_mode:this.boardMode,grid_enabled:this.g,grid_spacing:this.gridSpacing,grid_logarithmic:this.gridLog})}).catch(()=>{}); },

        uploadFile(e) {
            const file = e.target.files[0]; if(!file) return;
            const fd = new FormData(); fd.append('file', file);
            fetch(`/wb/teacher/api/whiteboard/${this.whiteboardId}/slides/upload`, {method:'POST', body:fd})
                .then(r=>r.json()).then(d=>{if(d.success)window.location.reload();}).catch(()=>{alert('Upload gagal');});
        },
        addSlide() { fetch(`/wb/teacher/api/whiteboard/${this.whiteboardId}/slides`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(r=>r.json()).then(d=>{if(d.success)window.location.reload();}).catch(()=>{}); },
        delSlide(i) { if(this.slides.length<=1)return; const sl=this.slides[i]; fetch(`/wb/teacher/api/whiteboard/${this.whiteboardId}/slides/${sl.slide_number}`,{method:'DELETE'}).then(r=>r.json()).then(d=>{if(d.success){this.slides.splice(i,1);if(this.slideIdx>=this.slides.length)this.slideIdx=this.slides.length-1;this.loadSlide(this.slides[this.slideIdx]);}}); },

        downloadPDF() { window.open(`/wb/teacher/whiteboard/${this.whiteboardId}/download`,'_blank'); },

        endSession() { if(!confirm('Akhiri sesi?'))return; fetch(`/wb/teacher/api/whiteboard/${this.whiteboardId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'ended'})}).then(r=>r.json()).then(d=>{if(d.success)window.location.href='/wb/teacher/whiteboard';}); },

        snapshot() { const d=this.c.toDataURL(); fetch(`/wb/teacher/api/whiteboard/${this.whiteboardId}/snapshots`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slide_number:this.slideIdx+1,image_data:d})}).then(r=>r.json()).then(d=>{if(d.success)alert('Snapshot tersimpan');}); },

        togglePerm(m) { fetch(`/wb/teacher/api/whiteboard/${this.whiteboardId}/permission`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:m.student_id,can_annotate:!m.can_annotate})}).then(r=>r.json()).then(d=>{if(d.success){m.can_annotate=!m.can_annotate;if(m.can_annotate)this.ws?.approveAnnotate(m.student_id);else this.ws?.revokeAnnotate(m.student_id);}}); },
        approve(sid) { fetch(`/wb/teacher/api/whiteboard/${this.whiteboardId}/permission`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid,can_annotate:true})}).then(r=>r.json()).then(d=>{if(d.success){const m=this.members.find(x=>x.student_id===sid);if(m){m.can_annotate=true;m.awaiting_approval=false;}this.ws?.approveAnnotate(sid);}}); },
        bulkApprove() { fetch(`/wb/teacher/api/whiteboard/${this.whiteboardId}/permission`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bulk:'all',can_annotate:true})}).then(r=>r.json()); this.members.forEach(m=>m.can_annotate=true); },
        bulkRevoke() { fetch(`/wb/teacher/api/whiteboard/${this.whiteboardId}/permission`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bulk:'all',can_annotate:false})}).then(r=>r.json()); this.members.forEach(m=>m.can_annotate=false); },
        sendReact(emoji) { this.ws?.sendReaction(emoji,'Guru'); },
    };
}
</script>
{% endblock %}
