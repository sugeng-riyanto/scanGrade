{% extends "base.html" %}
{% block title %}Proctoring - {{ exam.title }}{% endblock %}
{% block page_title %}Proctoring{% endblock %}
{% block content %}
<div x-data="{
    students: [], examTitle: '{{ exam.title }}', totalQ: {{ exam.total_questions or 0 }},
    totalStudents: 0, started: 0, submitted: 0, timestamp: '', autoRefresh: true,
    init() {
        this.fetchData();
        setInterval(() => { if (this.autoRefresh) this.fetchData(); }, 5000);
    },
    fetchData() {
        fetch('/teacher/api/exams/{{ exam_id }}/proctoring-data')
            .then(r => r.json())
            .then(d => {
                this.students = d.students || [];
                this.totalStudents = d.total_students || 0;
                this.started = d.started || 0;
                this.submitted = d.submitted || 0;
                this.timestamp = d.timestamp || '';
            });
    },
    get progressPct() { return this.totalQ > 0 ? Math.round(this.submitted / this.totalStudents * 100) : 0; }
}" class="max-w-6xl mx-auto" x-init="init()">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-sm border border-surface-200 p-4 mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <a href="/teacher/exams/{{ exam_id }}" class="text-surface-400 hover:text-primary-500 text-lg p-1.5 hover:bg-primary-50 rounded-xl transition">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="font-extrabold text-surface-800 text-sm sm:text-base truncate max-w-[200px] sm:max-w-md">{{ exam.title }}</h1>
                <p class="text-[10px] text-surface-400">Proctoring Real-Time</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-bold"
                 :class="autoRefresh ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-surface-100 text-surface-400 border border-surface-200'">
                <i class="fas fa-sync-alt" :class="{'fa-spin': autoRefresh}"></i>
                <label class="cursor-pointer"><input type="checkbox" x-model="autoRefresh" class="mr-1">Auto</label>
            </div>
            <span class="text-[10px] text-surface-400" x-text="'Diperbarui: ' + new Date(timestamp).toLocaleTimeString('id-ID')"></span>
        </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-4 mb-4">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-surface-200 text-center">
            <p class="text-2xl font-extrabold text-primary-600" x-text="totalStudents"></p>
            <p class="text-[10px] font-bold text-surface-500">Total Siswa</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border border-surface-200 text-center">
            <p class="text-2xl font-extrabold text-emerald-600" x-text="started"></p>
            <p class="text-[10px] font-bold text-surface-500">Mulai Mengerjakan</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border border-surface-200 text-center">
            <p class="text-2xl font-extrabold text-amber-600" x-text="submitted"></p>
            <p class="text-[10px] font-bold text-surface-500">Sudah Submit</p>
        </div>
    </div>

    <!-- Student Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
        <template x-for="s in students" :key="s.id">
            <div class="rounded-xl p-3 border-2 transition-all duration-300"
                 :class="{
                     'bg-emerald-50 border-emerald-300': s.status === 'submitted' || s.status === 'graded' || s.status === 'published',
                     'bg-amber-50 border-amber-300': s.status === 'draft' || s.status === 'started',
                     'bg-surface-50 border-surface-200': s.status === 'not_started',
                     'ring-2 ring-red-300': s.violations > 0
                 }">
                <div class="flex items-center justify-between mb-1.5">
                    <span class="text-[11px] font-extrabold text-surface-800 truncate max-w-[80px]" x-text="s.name"></span>
                    <span class="w-2 h-2 rounded-full"
                          :class="{
                              'bg-emerald-500': s.status === 'submitted' || s.status === 'graded' || s.status === 'published',
                              'bg-amber-500': s.status === 'draft' || s.status === 'started',
                              'bg-surface-300': s.status === 'not_started'
                          }"></span>
                </div>
                <div class="flex items-center gap-1.5 text-[9px] font-bold text-surface-500 mb-1">
                    <span x-text="s.answers_count + '/' + s.totalQ + ' soal'"></span>
                </div>
                <!-- Mini progress bar -->
                <div class="w-full h-1.5 bg-surface-200 rounded-full overflow-hidden">
                    <div class="h-full rounded-full transition-all"
                         :style="'width:' + (s.totalQ > 0 ? (s.answers_count / s.totalQ * 100) : 0) + '%'"
                         :class="s.status === 'not_started' ? 'bg-surface-300' : 'bg-primary-500'"></div>
                </div>
                <div class="flex items-center justify-between mt-1.5">
                    <span class="text-[8px] text-surface-400 truncate" x-text="s.updated_at || ''"></span>
                    <span x-show="s.violations > 0"
                          class="text-[8px] font-extrabold text-red-600 bg-red-50 px-1.5 py-0.5 rounded-full"
                          x-text="s.violations + 'x'"></span>
                </div>
            </div>
        </template>
    </div>

    <!-- Empty state -->
    <div x-show="students.length === 0" class="text-center py-16">
        <i class="fas fa-user-clock text-4xl text-surface-300 mb-3"></i>
        <p class="text-sm font-bold text-surface-500">Tidak ada siswa terdaftar untuk ujian ini</p>
    </div>
</div>
{% endblock %}
