{% extends "base.html" %}
{% block title %}Tutorial Guru - ScanGrade{% endblock %}
{% block head_extra %}
<style>
.demo-step { animation: slideUp 0.4s ease-out; }
.demo-card { transition: transform 0.2s, box-shadow 0.2s; }
.demo-card:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0,0,0,0.08); }
.feature-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.step-num { width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
</style>
{% endblock %}
{% block content_noauth %}
<div class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-emerald-50 relative overflow-hidden">
    <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full bg-emerald-100/30 blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full bg-blue-100/30 blur-3xl"></div>
    <header class="px-6 py-4 flex items-center justify-between max-w-6xl mx-auto relative z-10">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-600 flex items-center justify-center shadow-lg shadow-emerald-500/30">
                <i class="fas fa-chalkboard-teacher text-white text-sm"></i>
            </div>
            <span class="font-extrabold text-lg text-surface-800">ScanGrade <span class="text-emerald-600" x-text="t('Guru','Teacher')"></span></span>
        </div>
        <div class="flex items-center gap-3">
            <a href="/" class="px-4 py-2 text-sm font-bold text-surface-500 hover:text-surface-700 transition"><i class="fas fa-arrow-left mr-1"></i><span x-text="t('Beranda','Home')"></span></a>
            <a href="/auth/login-user?role=guru" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 text-white rounded-xl text-sm font-bold shadow-lg shadow-emerald-500/25 hover:from-emerald-600 hover:to-emerald-700 transition"><i class="fas fa-sign-in-alt mr-1"></i><span x-text="t('Masuk sebagai Guru','Log in as Teacher')"></span></a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-12">
        <div class="text-center mb-16">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-emerald-100 rounded-full text-emerald-700 text-xs font-bold mb-4" x-text="t('🎓 Untuk Guru','🎓 For Teachers')"></div>
            <h1 class="text-3xl lg:text-4xl font-extrabold text-surface-900" x-text="t('Buat, Koreksi, dan Analisis Ujian','Create, Grade and Analyse Exams')"></h1>
            <p class="mt-3 text-lg text-surface-500 max-w-2xl mx-auto" x-text="t('Semua alat — dari pembuatan soal MCQ dan Esai, anti-cheat, koreksi AI, hingga publikasi nilai.','Every tool — from authoring MCQ and essay questions, anti-cheat and AI grading to publishing scores.')"></p>
        </div>

        <div class="space-y-8 demo-step">
            <!-- Step 1 -->
            <div class="demo-card bg-white rounded-2xl p-6 lg:p-8 shadow-lg shadow-surface-200/40 border border-surface-100 flex flex-col lg:flex-row gap-6 items-start">
                <div class="step-num bg-gradient-to-br from-emerald-500 to-emerald-600 text-white shadow-lg shadow-emerald-500/20 shrink-0"><span>1</span></div>
                <div class="flex-1">
                    <h3 class="text-xl font-extrabold text-surface-800" x-text="t('Buat Ujian — 3 Tipe Soal','Create an Exam — 3 Question Types')"></h3>
                    <p class="mt-2 text-surface-500"><span x-text="t('Klik Buat Ujian dan isi detail. Tersedia 3 tipe soal:','Click Create Exam and fill in the details. Three question types are available:')"></span> <strong>MCQ</strong> <span x-text="t('(A-E), Esai Teks (siswa menulis paragraf), dan Esai Canvas (siswa menggambar di PDF). Atur durasi, kelas tujuan, jadwal mulai, dan bobot nilai per soal.','(A-E), Text Essay (the student writes a paragraph) and Canvas Essay (the student draws on the PDF). Set the duration, target classes, start schedule and the score weight per question.')"></span></p>
                    <div class="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div class="p-3 bg-amber-50 rounded-xl text-center"><i class="fas fa-list-ol text-amber-600 text-xl"></i><p class="text-xs font-bold mt-1">MCQ</p></div>
                        <div class="p-3 bg-blue-50 rounded-xl text-center"><i class="fas fa-align-left text-blue-600 text-xl"></i><p class="text-xs font-bold mt-1" x-text="t('Esai Teks','Text Essay')"></p></div>
                        <div class="p-3 bg-emerald-50 rounded-xl text-center"><i class="fas fa-paint-brush text-emerald-600 text-xl"></i><p class="text-xs font-bold mt-1" x-text="t('Esai Canvas','Canvas Essay')"></p></div>
                        <div class="p-3 bg-purple-50 rounded-xl text-center"><i class="fas fa-robot text-purple-600 text-xl"></i><p class="text-xs font-bold mt-1" x-text="t('Koreksi AI*','AI Grading*')"></p></div>
                    </div>
                    <p class="mt-2 text-xs text-surface-400" x-text="t('*Koreksi AI untuk Esai Teks. Sediakan API key sendiri di Pengaturan AI.','*AI grading for text essays. Bring your own API key in AI Settings.')"></p>
                </div>
            </div>

            <!-- Step 2 -->
            <div class="demo-card bg-white rounded-2xl p-6 lg:p-8 shadow-lg shadow-surface-200/40 border border-surface-100 flex flex-col lg:flex-row gap-6 items-start">
                <div class="step-num bg-gradient-to-br from-emerald-500 to-emerald-600 text-white shadow-lg shadow-emerald-500/20 shrink-0"><span>2</span></div>
                <div class="flex-1">
                    <h3 class="text-xl font-extrabold text-surface-800" x-text="t('Atur Anti-Cheat dan Jadwal','Set Anti-Cheat and Schedule')"></h3>
                    <p class="mt-2 text-surface-500" x-text="t('Aktifkan anti-cheat: deteksi tab switch, blokir copy-paste, watermark, fullscreen wajib. Atur juga jadwal kapan ujian dimulai dan durasi pengerjaan.','Turn on anti-cheat: tab-switch detection, copy-paste blocked, watermark, fullscreen required. Also set when the exam opens and how long students have to work.')"></p>
                    <div class="mt-4 flex flex-wrap gap-2">
                        <span class="px-3 py-1.5 bg-red-50 text-red-700 rounded-lg text-xs font-bold flex items-center gap-1"><i class="fas fa-eye-slash"></i> <span x-text="t('Anti-Cheat','Anti-Cheat')"></span></span>
                        <span class="px-3 py-1.5 bg-amber-50 text-amber-700 rounded-lg text-xs font-bold flex items-center gap-1"><i class="fas fa-random"></i> <span x-text="t('Acak Soal/Opsi','Shuffle Questions/Options')"></span></span>
                        <span class="px-3 py-1.5 bg-blue-50 text-blue-700 rounded-lg text-xs font-bold flex items-center gap-1"><i class="fas fa-calendar"></i> <span x-text="t('Jadwal Mulai','Start Schedule')"></span></span>
                        <span class="px-3 py-1.5 bg-purple-50 text-purple-700 rounded-lg text-xs font-bold flex items-center gap-1"><i class="fas fa-calculator"></i> <span x-text="t('Kalkulator','Calculator')"></span></span>
                    </div>
                </div>
            </div>

            <!-- Step 3 -->
            <div class="demo-card bg-white rounded-2xl p-6 lg:p-8 shadow-lg shadow-surface-200/40 border border-surface-100 flex flex-col lg:flex-row gap-6 items-start">
                <div class="step-num bg-gradient-to-br from-emerald-500 to-emerald-600 text-white shadow-lg shadow-emerald-500/20 shrink-0"><span>3</span></div>
                <div class="flex-1">
                    <h3 class="text-xl font-extrabold text-surface-800" x-text="t('Koreksi dengan AI dan Tools Canvas','Grade with AI and Canvas Tools')"></h3>
                    <p class="mt-2 text-surface-500"><span x-text="t('Untuk Esai Teks, klik Koreksi AI — AI membaca soal dan jawaban, lalu memberi saran skor beserta feedback. Guru tinggal review dan edit. Untuk Esai Canvas, gunakan','For Text Essays click AI Grading — the AI reads the question and the answer, then suggests a score with feedback. The teacher just reviews and edits. For Canvas Essays use the')"></span> <span class="font-semibold" x-text="t('pena digital, ruler 30cm, busur 180°, dan segitiga siku','digital pen, 30cm ruler, 180° protractor and 45° set square')"></span> <span x-text="t('untuk koreksi manual.','to grade by hand.')"></span></p>
                    <div class="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div class="p-3 bg-purple-50 rounded-xl text-center"><i class="fas fa-robot text-purple-600"></i><p class="text-xs font-bold mt-1" x-text="t('Koreksi AI','AI Grading')"></p></div>
                        <div class="p-3 bg-green-50 rounded-xl text-center"><i class="fas fa-pencil-alt text-green-600"></i><p class="text-xs font-bold mt-1" x-text="t('Pena Digital','Digital Pen')"></p></div>
                        <div class="p-3 bg-blue-50 rounded-xl text-center"><i class="fas fa-ruler text-blue-600"></i><p class="text-xs font-bold mt-1" x-text="t('Ruler 30cm','30cm Ruler')"></p></div>
                        <div class="p-3 bg-amber-50 rounded-xl text-center"><i class="fas fa-drafting-compass text-amber-600"></i><p class="text-xs font-bold mt-1" x-text="t('Busur 180°','180° Protractor')"></p></div>
                    </div>
                </div>
            </div>

            <!-- Step 4 -->
            <div class="demo-card bg-white rounded-2xl p-6 lg:p-8 shadow-lg shadow-surface-200/40 border border-surface-100 flex flex-col lg:flex-row gap-6 items-start">
                <div class="step-num bg-gradient-to-br from-emerald-500 to-emerald-600 text-white shadow-lg shadow-emerald-500/20 shrink-0"><span>4</span></div>
                <div class="flex-1">
                    <h3 class="text-xl font-extrabold text-surface-800" x-text="t('Lihat Hasil dan Export','See Results and Export')"></h3>
                    <p class="mt-2 text-surface-500" x-text="t('Dashboard analitik: distribusi nilai, soal tersulit, statistik per-band. Export ke XLSX atau PDF — termasuk gambar canvas siswa dan jawaban teks.','Analytics dashboard: score distribution, hardest questions, per-band statistics. Export to XLSX or PDF — including the students canvas drawings and text answers.')"></p>
                    <div class="mt-4 flex flex-wrap gap-2">
                        <span class="px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-bold"><i class="fas fa-chart-bar mr-1"></i>Chart.js</span>
                        <span class="px-3 py-1.5 bg-blue-50 text-blue-700 rounded-lg text-xs font-bold"><i class="fas fa-file-excel mr-1"></i>XLSX</span>
                        <span class="px-3 py-1.5 bg-red-50 text-red-700 rounded-lg text-xs font-bold"><i class="fas fa-file-pdf mr-1"></i>PDF</span>
                    </div>
                </div>
            </div>

            <!-- Step 5 — AI Settings -->
            <div class="demo-card bg-white rounded-2xl p-6 lg:p-8 shadow-lg shadow-surface-200/40 border border-surface-100 flex flex-col lg:flex-row gap-6 items-start">
                <div class="step-num bg-gradient-to-br from-purple-500 to-purple-600 text-white shadow-lg shadow-purple-500/20 shrink-0"><span>5</span></div>
                <div class="flex-1">
                    <h3 class="text-xl font-extrabold text-surface-800" x-text="t('Pengaturan AI Grading','AI Grading Settings')"></h3>
                    <p class="mt-2 text-surface-500"><span x-text="t('Di menu Koreksi AI, kamu bisa menambahkan API Key dari Gemini, OpenAI, DeepSeek, Groq, atau custom provider. Pilih prompt grading yang sesuai mapel (IPA, Matematika, Bahasa, dll) atau buat prompt sendiri. Semua tersimpan per akun guru.','Under AI Grading you can add an API key from Gemini, OpenAI, DeepSeek, Groq or a custom provider. Pick a grading prompt that fits the subject (Science, Maths, Language, and so on) or write your own. Everything is stored per teacher account.')"></span></p>
                    <div class="mt-4 flex flex-wrap gap-2">
                        <span class="px-3 py-1.5 bg-purple-50 text-purple-700 rounded-lg text-xs font-bold"><i class="fas fa-key mr-1"></i>API Key</span>
                        <span class="px-3 py-1.5 bg-blue-50 text-blue-700 rounded-lg text-xs font-bold"><i class="fas fa-edit mr-1"></i><span x-text="t('Edit Prompt','Edit Prompt')"></span></span>
                        <span class="px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-bold"><i class="fas fa-flask mr-1"></i><span x-text="t('Uji Key','Test Key')"></span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- CTA -->
        <div class="mt-12 text-center bg-gradient-to-r from-emerald-500 to-emerald-600 rounded-2xl p-8 lg:p-12 shadow-xl">
            <h2 class="text-2xl font-extrabold text-white" x-text="t('Siap memulai?','Ready to start?')"></h2>
            <p class="mt-2 text-emerald-100" x-text="t('Masuk dengan akun guru yang diberikan oleh sekolah Anda.','Log in with the teacher account your school gave you.')"></p>
            <a href="/auth/login-user?role=guru" class="mt-4 inline-flex items-center gap-2 px-8 py-3.5 bg-white text-emerald-700 rounded-xl font-extrabold hover:bg-emerald-50 transition"><span x-text="t('Masuk sebagai Guru','Log in as Teacher')"></span> <i class="fas fa-arrow-right"></i></a>
        </div>
    </main>
</div>
{% endblock %}
