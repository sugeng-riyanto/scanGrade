{% extends "base.html" %}
{% block title %}Komunikasi - ScanGrade{% endblock %}
{% block content %}
<div x-data="{
    activeTab: 'chat',
    userId: '{{ g.user_id }}',
    userRole: '{{ g.user_role }}',
    userName: '{{ g.user_name or g.user_email }}',
    pengumumanList: [],
    unreadPengumuman: 0,
    chatUnreadCount: 0,
    pollTimer: null,
    muted: localStorage.getItem('sg_chat_muted') === 'true',
    showCreatePengumuman: false,
    formTitle: '',
    formContent: '',
    formTargetRole: '',
    formClassId: '',
    selectedPengumuman: null,
    percakapanList: [],
    searchChat: '',
    selectedPercakapan: null,
    pesanList: [],
    newMessage: '',
    showCreateChat: false,
    searchRecipient: '',
    allowedRecipients: [],
    selectedRecipient: null,
    sending: false,
    loading: false,

    init() {
        this.fetchPengumuman();
        this.fetchUnreadCount();
        this.fetchPercakapan();
        this.startPolling();
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
    },

    startPolling() {
        this.pollTimer = setInterval(() => this.pollNow(), 1000);
    },
    stopPolling() {
        if (this.pollTimer) { clearInterval(this.pollTimer); this.pollTimer = null; }
    },
    pollNow() {
        this.fetchUnreadCount();
        this.fetchPercakapanSilent();
        if (this.selectedPercakapan) {
            this.fetchPesan(this.selectedPercakapan, true);
        }
    },

    formatDate(ts) {
        return ts ? ts.substring(0,10) : '';
    },
    formatTime(ts) {
        return ts ? ts.substring(11,16) : '';
    },
    formatDateTime(ts) {
        return ts ? ts.substring(0,16).replace('T',' ') : '';
    },

    fetchPengumuman() {
        this.loading = true;
        fetch('/api/pengumuman?limit=50')
            .then(r => r.json())
            .then(d => {
                this.pengumumanList = d || [];
                const sids = [...new Set(this.pengumumanList.map(p => p.sender_id))];
                if (sids.length) {
                    fetch('/api/percakapan/recipients')
                        .then(r => r.json())
                        .then(u => {
                            const map = {};
                            (u.users||[]).forEach(uu => map[uu.id] = uu.full_name);
                            this.pengumumanList.forEach(p => {
                                p.sender_name = map[p.sender_id] || p.sender_id.substring(0,8);
                            });
                        })
                        .catch(() => {});
                }
                this.loading = false;
            })
            .catch(() => { this.loading = false; });
    },
    fetchUnreadCount() {
        fetch('/api/pengumuman/unread-count')
            .then(r => r.json())
            .then(d => { this.unreadPengumuman = d.unread_count || 0; })
            .catch(() => {});
    },

    submitPengumuman() {
        if (!this.formTitle || !this.formContent || !this.formTargetRole) return;
        this.sending = true;
        const body = {title: this.formTitle, content: this.formContent, target_role: this.formTargetRole};
        if (this.formClassId) body.class_id = this.formClassId;
        fetch('/api/pengumuman', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
            .then(r => r.json())
            .then(d => {
                if (d.error) { alert('Gagal: '+d.error); return; }
                this.showCreatePengumuman = false;
                this.formTitle = ''; this.formContent = ''; this.formTargetRole = ''; this.formClassId = '';
                this.fetchPengumuman();
            })
            .catch(() => { alert('Error'); })
            .finally(() => { this.sending = false; });
    },

    openPengumuman(item) {
        this.selectedPengumuman = item;
        fetch('/api/pengumuman/' + item.id + '/mark-read', {method:'POST'}).catch(() => {});
        if (!item.is_read) {
            item.is_read = true;
            this.unreadPengumuman = Math.max(0, this.unreadPengumuman - 1);
        }
        this.$refs.pengumumanDetailModal.classList.remove('hidden');
    },

    deletePengumuman(id) {
        if (!confirm('Hapus pengumuman ini?')) return;
        fetch('/api/pengumuman/' + id, {method:'DELETE'})
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    this.pengumumanList = this.pengumumanList.filter(p => p.id !== id);
                    if (this.selectedPengumuman && this.selectedPengumuman.id === id) {
                        this.selectedPengumuman = null;
                        this.$refs.pengumumanDetailModal.classList.add('hidden');
                    }
                }
            })
            .catch(() => {});
    },

    fetchPercakapan() {
        fetch('/api/percakapan?limit=50')
            .then(r => r.json())
            .then(d => {
                this.percakapanList = d.percakapan || [];
                this.chatUnreadCount = this.percakapanList.reduce((sum, c) => sum + (c.unread_count || 0), 0);
            })
            .catch(() => {});
    },
    fetchPercakapanSilent() {
        fetch('/api/percakapan?limit=50')
            .then(r => r.json())
            .then(d => {
                const oldUnread = this.chatUnreadCount;
                this.percakapanList = d.percakapan || [];
                this.chatUnreadCount = this.percakapanList.reduce((sum, c) => sum + (c.unread_count || 0), 0);
                if (this.chatUnreadCount > oldUnread) {
                    this.notifyNewChat();
                }
            })
            .catch(() => {});
    },

    get filteredPercakapan() {
        if (!this.searchChat.trim()) return this.percakapanList;
        const q = this.searchChat.toLowerCase();
        return this.percakapanList.filter(c => (c.other_name||'').toLowerCase().includes(q));
    },

    searchRecipients() {
        const q = this.searchRecipient.trim();
        fetch('/api/percakapan/recipients?q=' + encodeURIComponent(q))
            .then(r => r.json())
            .then(d => { this.allowedRecipients = d.users || []; })
            .catch(() => { this.allowedRecipients = []; });
    },
    createChat() {
        if (!this.selectedRecipient) return;
        this.sending = true;
        fetch('/api/percakapan', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({recipient_id: this.selectedRecipient})})
            .then(r => r.json())
            .then(d => {
                if (d.error) { alert('Gagal: '+d.error); return; }
                const conv = d.percakapan || d;
                this.showCreateChat = false;
                this.searchRecipient = '';
                this.selectedRecipient = null;
                this.allowedRecipients = [];
                this.fetchPercakapan();
                this.openPercakapan(conv.id);
            })
            .catch(() => {})
            .finally(() => { this.sending = false; });
    },
    openPercakapan(id) {
        this.selectedPercakapan = id;
        this.fetchPesan(id);
    },
    fetchPesan(percakapanId, silent) {
        fetch('/api/percakapan/' + percakapanId + '/pesan?limit=50')
            .then(r => r.json())
            .then(d => {
                const newList = d.pesan || [];
                if (silent && this.pesanList.length > 0) {
                    if (newList.length > this.pesanList.length) {
                        this.pesanList = newList;
                        this.$nextTick(() => {
                            const el = this.$refs.pesanContainer;
                            if (el) el.scrollTop = el.scrollHeight;
                        });
                    }
                } else {
                    this.pesanList = newList;
                    this.$nextTick(() => {
                        const el = this.$refs.pesanContainer;
                        if (el) el.scrollTop = el.scrollHeight;
                    });
                }
            })
            .catch(() => {});
    },
    sendMessage() {
        if (!this.newMessage.trim() || !this.selectedPercakapan) return;
        this.sending = true;
        const body = JSON.stringify({content: this.newMessage.trim()});
        fetch('/api/percakapan/' + this.selectedPercakapan + '/pesan', {method:'POST', headers:{'Content-Type':'application/json'}, body})
            .then(r => r.json())
            .then(d => {
                if (d.error) { alert('Gagal: '+d.error); return; }
                const exists = this.pesanList.some(m => m.id === d.id);
                if (!exists) this.pesanList.push(d);
                this.newMessage = '';
                this.$nextTick(() => {
                    const el = this.$refs.pesanContainer;
                    if (el) el.scrollTop = el.scrollHeight;
                });
            })
            .catch(() => {})
            .finally(() => { this.sending = false; });
    },

    getOtherUser(conv) {
        return conv ? (conv.other_name || conv.other_id?.substring(0,8) || '') : '';
    },

    deletePesan(id) {
        if (!confirm('Hapus pesan ini?')) return;
        fetch('/api/pesan/' + id, {method:'DELETE'})
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    const idx = this.pesanList.findIndex(m => m.id === id);
                    if (idx >= 0) this.pesanList[idx].is_deleted = true;
                }
            })
            .catch(() => {});
    },

    toggleMute() {
        this.muted = !this.muted;
        localStorage.setItem('sg_chat_muted', this.muted);
    },

    notifyNewChat() {
        if (!this.muted) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = 660; gain.gain.value = 0.12;
                osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
            } catch (_) {}
        }
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('Pesan baru di ScanGrade', {
                body: 'Ada pesan baru di chat',
                icon: '/static/favicon.ico'
            });
        }
    },
}">

    <div class="flex items-center justify-between mb-4">
        <h1 class="text-xl font-extrabold text-surface-800"><i class="fas fa-comments text-primary-500 mr-2"></i>Komunikasi</h1>
        <button @click="toggleMute()" class="text-surface-400 hover:text-primary-500 transition text-lg" :title="muted ? 'Aktifkan suara' : 'Matikan suara'">
            <i :class="muted ? 'fas fa-volume-off text-red-400' : 'fas fa-volume-up'"></i>
        </button>
    </div>

    <div class="flex gap-1 bg-surface-100 rounded-xl p-1 mb-4">
        <button @click="activeTab='chat'; if(!selectedPercakapan) fetchPercakapan()" :class="activeTab==='chat' ? 'bg-white shadow-sm text-primary-600' : 'text-surface-500'" class="flex-1 py-2.5 text-sm font-bold rounded-lg text-center transition relative">
            <i class="fas fa-comments mr-1.5"></i>Chat
            <template x-if="chatUnreadCount > 0"><span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full" x-text="chatUnreadCount"></span></template>
        </button>
        <button @click="activeTab='pengumuman'" :class="activeTab==='pengumuman' ? 'bg-white shadow-sm text-primary-600' : 'text-surface-500'" class="flex-1 py-2.5 text-sm font-bold rounded-lg text-center transition relative">
            <i class="fas fa-bullhorn mr-1.5"></i>Pengumuman
            <template x-if="unreadPengumuman > 0"><span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full" x-text="unreadPengumuman"></span></template>
        </button>
    </div>

    <!-- PENGUMUMAN TAB -->
    <div x-show="activeTab==='pengumuman'">
        <template x-if="userRole !== 'murid'">
            <button @click="showCreatePengumuman=true" class="w-full mb-4 px-4 py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-bold text-sm shadow-lg transition flex items-center justify-center gap-2">
                <i class="fas fa-plus-circle"></i>Buat Pengumuman
            </button>
        </template>

        <div class="space-y-3">
            <div x-show="pengumumanList.length===0 && !loading" class="text-center py-12 text-surface-400">
                <i class="fas fa-bullhorn text-4xl mb-3"></i>
                <p class="text-sm font-bold">Belum ada pengumuman</p>
            </div>
            <template x-for="item in pengumumanList" :key="item.id">
                <div @click="openPengumuman(item)" class="bg-white rounded-2xl p-4 shadow-sm border border-surface-100 cursor-pointer hover:shadow-md transition relative">
                    <div class="flex justify-between items-start">
                        <h3 class="font-bold text-surface-800 text-sm" x-text="item.title"></h3>
                        <span x-show="!item.is_read" class="w-2.5 h-2.5 bg-red-500 rounded-full mt-1 shrink-0"></span>
                    </div>
                    <p class="text-xs text-surface-500 mt-1 line-clamp-2" x-text="item.content"></p>
                    <div class="flex justify-between items-center text-[10px] text-surface-400 mt-2">
                        <span x-text="item.sender_name || item.sender_id?.substring(0,8)"></span>
                        <span x-text="formatDate(item.created_at)"></span>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- CHAT TAB -->
    <div x-show="activeTab==='chat'" class="flex flex-col md:flex-row gap-0 md:gap-4" style="height: calc(100vh - 280px); min-height: 400px;">
        <!-- Conversation list -->
        <div class="w-full md:w-72 shrink-0 bg-white rounded-2xl border border-surface-100 shadow-sm flex flex-col overflow-hidden" x-show="!selectedPercakapan || window.innerWidth >= 768" :class="selectedPercakapan ? 'hidden md:flex' : 'flex'">
            <div class="p-3 border-b border-surface-100 space-y-2">
                <input type="text" x-model="searchChat" placeholder="Cari percakapan..." class="w-full px-3 py-2 bg-surface-50 border-0 rounded-lg text-xs text-surface-600">
                <button @click="showCreateChat=true; searchRecipients()" class="w-full py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-1">
                    <i class="fas fa-plus-circle"></i> Chat Baru
                </button>
            </div>
            <div class="flex-1 overflow-y-auto">
                <template x-for="conv in filteredPercakapan" :key="conv.id">
                    <div @click="openPercakapan(conv.id)" class="p-3 border-b border-surface-50 cursor-pointer hover:bg-surface-50 transition"
                         :class="selectedPercakapan===conv.id ? 'bg-primary-50 border-l-2 border-l-primary-500' : ''">
                        <div class="flex items-center gap-2">
                            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center text-white text-sm font-bold shrink-0" x-text="(conv.other_name||'?')[0].toUpperCase()"></div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between">
                                    <span class="font-bold text-surface-800 text-sm truncate" x-text="conv.other_name"></span>
                                    <span class="text-[10px] text-surface-400 shrink-0 ml-1" x-text="formatDate(conv.last_message_at)"></span>
                                </div>
                                <p class="text-xs text-surface-500 truncate" x-text="conv.last_message || 'Belum ada pesan'"></p>
                            </div>
                        </div>
                        <div x-show="conv.unread_count > 0" class="ml-11 mt-1">
                            <span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full" x-text="conv.unread_count"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Message area -->
        <div class="flex-1 flex flex-col bg-white rounded-2xl border border-surface-100 shadow-sm overflow-hidden" x-show="selectedPercakapan" :class="selectedPercakapan ? 'flex' : 'hidden md:flex'">
            <!-- Header -->
            <div class="p-3 border-b border-surface-200 flex items-center gap-3">
                <button @click="selectedPercakapan=null; pesanList=[]" class="md:hidden text-surface-400 hover:text-surface-600"><i class="fas fa-arrow-left"></i></button>
                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center text-white text-sm font-bold shrink-0" x-text="(getOtherUser(percakapanList.find(c=>c.id===selectedPercakapan))||'?')[0].toUpperCase()"></div>
                <span class="font-bold text-surface-800 text-sm" x-text="getOtherUser(percakapanList.find(c=>c.id===selectedPercakapan))"></span>
            </div>
            <!-- Messages -->
            <div x-ref="pesanContainer" class="flex-1 overflow-y-auto p-4 space-y-2" style="background-color: #efeae2;">
                <div x-show="pesanList.length===0" class="flex items-center justify-center h-full">
                    <p class="text-xs text-surface-400">Belum ada pesan. Kirim pesan pertama!</p>
                </div>
                <template x-for="msg in pesanList" :key="msg.id">
                    <div class="flex" :class="msg.sender_id === userId ? 'justify-end' : 'justify-start'">
                        <div class="max-w-[75%] min-w-[100px] rounded-2xl px-3 py-2 shadow-sm relative"
                             :class="msg.sender_id === userId ? 'bg-[#dcf8c6] text-[#111b21] rounded-br-sm' : 'bg-white text-[#111b21] rounded-bl-sm border border-surface-100'">
                            <template x-if="msg.is_deleted">
                                <p class="italic text-surface-400 text-xs"><i class="fas fa-trash-can mr-1"></i>Pesan dihapus</p>
                            </template>
                            <template x-if="!msg.is_deleted">
                                <div>
                                    <p class="text-sm whitespace-pre-wrap break-words" x-text="msg.content"></p>
                                    <p x-show="msg.is_edited" class="text-[10px] text-surface-400 italic">diedit</p>
                                </div>
                            </template>
                            <div class="flex items-center justify-end gap-1 mt-1">
                                <span class="text-[10px] text-surface-400" x-text="formatTime(msg.created_at)"></span>
                                <template x-if="msg.sender_id === userId">
                                    <i class="text-[10px] fa-regular fa-circle-check" :class="msg.is_read ? 'text-[#53bdeb]' : 'text-[#8696a0]'"></i>
                                </template>
                                <button x-show="msg.sender_id === userId && !msg.is_deleted" @click="deletePesan(msg.id)" class="text-[10px] text-surface-300 hover:text-red-400 ml-1">&times;</button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            <!-- Input bar -->
            <div class="p-3 border-t border-surface-200 bg-surface-50">
                <div class="flex items-end gap-2 bg-white rounded-xl border border-surface-200 px-3 py-2">
                    <textarea x-model="newMessage" rows="1" class="flex-1 border-0 focus:ring-0 text-surface-700 text-sm resize-none outline-none max-h-24" placeholder="Ketik pesan..." @keydown.enter.prevent="sendMessage()"></textarea>
                    <button @click="sendMessage()" :disabled="sending||!newMessage.trim()" class="shrink-0 w-10 h-10 rounded-full flex items-center justify-center transition-all"
                            :class="newMessage.trim() ? 'bg-primary-600 text-white shadow-md' : 'bg-surface-100 text-surface-400'">
                        <i class="fas fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- No conversation selected -->
        <div x-show="!selectedPercakapan" class="flex-1 hidden md:flex items-center justify-center bg-white rounded-2xl border border-surface-100 shadow-sm">
            <div class="text-center text-surface-400">
                <i class="fas fa-comments text-5xl mb-3"></i>
                <p class="text-sm font-bold">Pilih percakapan untuk mulai chat</p>
            </div>
        </div>
    </div>

    <!-- CREATE PENGUMUMAN MODAL -->
    <div x-show="showCreatePengumuman" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4" @click.self="showCreatePengumuman=false">
        <div class="bg-white rounded-2xl p-6 shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-5">
                <h2 class="font-extrabold text-surface-800"><i class="fas fa-bullhorn text-primary-500 mr-2"></i>Buat Pengumuman</h2>
                <button @click="showCreatePengumuman=false" class="text-surface-400 hover:text-surface-600 text-xl leading-none">&times;</button>
            </div>
            <form @submit.prevent="submitPengumuman()" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Tujuan</label>
                    <select x-model="formTargetRole" required class="w-full px-4 py-3 border border-surface-200 rounded-xl text-surface-700 font-medium bg-white">
                        <option value="">-- Pilih --</option>
                        <template x-if="userRole==='super_admin'"><option value="admin_sekolah">Admin Sekolah</option></template>
                        <template x-if="userRole==='super_admin' || userRole==='admin_sekolah'"><option value="guru">Guru</option></template>
                        <option value="murid" x-show="userRole!=='murid'">Murid</option>
                    </select>
                </div>
                <div x-show="userRole==='guru' && formTargetRole==='murid'">
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Filter Kelas (opsional)</label>
                    <select x-model="formClassId" class="w-full px-4 py-3 border border-surface-200 rounded-xl text-surface-700 font-medium bg-white">
                        <option value="">-- Semua Kelas --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Judul</label>
                    <input type="text" x-model="formTitle" required class="w-full px-4 py-3 border border-surface-200 rounded-xl text-surface-700 font-medium">
                </div>
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Isi Pengumuman</label>
                    <textarea x-model="formContent" required rows="4" class="w-full px-4 py-3 border border-surface-200 rounded-xl text-surface-700 font-medium"></textarea>
                </div>
                <button type="submit" class="w-full px-4 py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-bold shadow-lg transition" :disabled="sending">
                    <span x-text="sending ? 'Mengirim...' : 'Kirim Pengumuman'"></span>
                </button>
                <button type="button" @click="showCreatePengumuman=false" class="w-full px-4 py-3 text-surface-500 hover:text-surface-700 font-bold">Batal</button>
            </form>
        </div>
    </div>

    <!-- PENGUMUMAN DETAIL MODAL -->
    <div x-ref="pengumumanDetailModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4" @click.self="$refs.pengumumanDetailModal.classList.add('hidden')">
        <div class="bg-white rounded-2xl p-6 shadow-2xl w-full max-w-lg">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-extrabold text-surface-800 text-lg" x-text="selectedPengumuman?.title"></h3>
                <button @click="$refs.pengumumanDetailModal.classList.add('hidden')" class="text-surface-400 hover:text-surface-600 text-xl leading-none">&times;</button>
            </div>
            <p class="text-sm text-surface-600 whitespace-pre-wrap" x-text="selectedPengumuman?.content"></p>
            <div class="mt-4 flex justify-between text-xs text-surface-400 border-t border-surface-100 pt-3">
                <span x-text="selectedPengumuman?.sender_name || ''"></span>
                <span x-text="formatDateTime(selectedPengumuman?.created_at)"></span>
            </div>
            <div x-show="selectedPengumuman?.read_by_count > 0" class="mt-2 text-xs text-surface-400">
                <i class="fas fa-eye mr-1"></i>Dibaca <span x-text="selectedPengumuman?.read_by_count || 0"></span> orang
            </div>
            <div x-show="selectedPengumuman?.sender_id === userId || userRole === 'super_admin'" class="mt-4 pt-3 border-t border-surface-100 flex gap-2">
                <button @click="deletePengumuman(selectedPengumuman.id)" class="flex-1 px-3 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1">
                    <i class="fas fa-trash"></i>Hapus
                </button>
            </div>
        </div>
    </div>

    <!-- CREATE CHAT MODAL -->
    <div x-show="showCreateChat" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4" @click.self="showCreateChat=false">
        <div class="bg-white rounded-2xl p-6 shadow-2xl w-full max-w-md">
            <div class="flex items-center justify-between mb-5">
                <h2 class="font-extrabold text-surface-800"><i class="fas fa-comment-dots text-primary-500 mr-2"></i>Chat Baru</h2>
                <button @click="showCreateChat=false" class="text-surface-400 hover:text-surface-600 text-xl leading-none">&times;</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Cari penerima</label>
                    <input type="text" x-model="searchRecipient" @input="searchRecipients()" placeholder="Nama..." class="w-full px-4 py-3 border border-surface-200 rounded-xl text-surface-700 font-medium">
                </div>
                <div class="max-h-48 overflow-y-auto border border-surface-100 rounded-xl" x-show="allowedRecipients.length > 0">
                    <template x-for="user in allowedRecipients" :key="user.id">
                        <div @click="selectedRecipient=user.id" class="p-3 hover:bg-surface-50 cursor-pointer border-b border-surface-50 last:border-0 flex items-center gap-3"
                             :class="selectedRecipient===user.id ? 'bg-primary-50' : ''">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary-400 to-primary-500 flex items-center justify-center text-white text-xs font-bold" x-text="(user.full_name||'?')[0].toUpperCase()"></div>
                            <div>
                                <p class="text-sm font-bold text-surface-700" x-text="user.full_name"></p>
                                <p class="text-[10px] text-surface-400" x-text="user.role"></p>
                            </div>
                            <i x-show="selectedRecipient===user.id" class="fas fa-check-circle text-primary-500 ml-auto"></i>
                        </div>
                    </template>
                </div>
                <button @click="createChat()" class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-bold shadow-lg transition" :disabled="!selectedRecipient||sending">
                    <span x-text="sending ? 'Memproses...' : 'Mulai Chat'"></span>
                </button>
            </div>
        </div>
    </div>

</div>
{% endblock %}
