{% extends "base.html" %}
{% block title %}Pesan & Pengumuman - ScanGrade{% endblock %}
{% block page_title %}Pesan & Pengumuman{% endblock %}
{% block content %}
<div class="space-y-6" x-data="{
    lang: localStorage.getItem('sg_lang') || 'id',
    notifs: [], loading: true,
    teachers: [], selectedTeacher: null, msgTitle: '', msgMessage: '', sending: false, sendMsg: '',
    editingId: null, editTitle: '', editMessage: '',
    activeTab: 'inbox',
    get sentMessages() { return this.notifs.filter(n => n.sender_id === '{{ g.user_id }}'); },
    get inboxMessages() { return this.notifs.filter(n => n.sender_id !== '{{ g.user_id }}'); },
    fetchNotifs() {
        this.loading = true;
        fetch('/api/broadcast/list').then(r=>r.json()).then(d => { this.notifs = d.notifications || []; }).catch(()=>{}).finally(()=>{ this.loading = false; });
    },
    fetchTeachers() {
        fetch('/api/broadcast/teachers').then(r=>r.json()).then(d => { this.teachers = d.teachers || []; }).catch(()=>{});
    },
    sendToTeacher() {
        if (!this.selectedTeacher) { this.sendMsg = 'Pilih guru'; return; }
        if (!this.msgTitle || !this.msgMessage) { this.sendMsg = 'Isi judul dan pesan'; return; }
        this.sending = true; this.sendMsg = '';
        fetch('/api/broadcast/send', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title: this.msgTitle, message: this.msgMessage, target_role: 'guru', recipient_ids: [this.selectedTeacher]})
        }).then(r=>r.json()).then(d => {
            this.sending = false;
            if (d.success) { this.sendMsg = 'Terkirim ke guru'; this.msgTitle = ''; this.msgMessage = ''; this.selectedTeacher = null; this.activeTab = 'sent'; this.fetchNotifs(); }
            else { this.sendMsg = 'Gagal: ' + (d.error || ''); }
        }).catch(() => { this.sending = false; this.sendMsg = 'Error koneksi'; });
    },
    startEdit(n) {
        this.editingId = n.id; this.editTitle = n.title; this.editMessage = n.message;
    },
    cancelEdit() {
        this.editingId = null; this.editTitle = ''; this.editMessage = '';
    },
    saveEdit() {
        if (!this.editTitle || !this.editMessage) return;
        fetch('/api/broadcast/update', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: this.editingId, title: this.editTitle, message: this.editMessage})
        }).then(r=>r.json()).then(d => { if (d.success) { this.cancelEdit(); this.fetchNotifs(); } });
    },
    deleteMsg(n) {
        if (!confirm('Hapus pesan ini?')) return;
        fetch('/api/broadcast/delete', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: n.id})
        }).then(r=>r.json()).then(d => { if (d.success) this.fetchNotifs(); });
    }
}" x-init="fetchNotifs(); fetchTeachers()">
    <!-- Tab Navigation -->
    <div class="flex gap-1 bg-surface-100 rounded-xl p-1">
        <button @click="activeTab='inbox'" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition" :class="activeTab === 'inbox' ? 'bg-white text-primary-600 shadow-sm' : 'text-surface-500 hover:text-surface-700'">
            <i class="fas fa-inbox mr-1.5"></i>Kotak Masuk
        </button>
        <button @click="activeTab='sent'" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition" :class="activeTab === 'sent' ? 'bg-white text-primary-600 shadow-sm' : 'text-surface-500 hover:text-surface-700'">
            <i class="fas fa-paper-plane mr-1.5"></i>Terkirim
        </button>
        <button @click="activeTab='new'" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition" :class="activeTab === 'new' ? 'bg-white text-primary-600 shadow-sm' : 'text-surface-500 hover:text-surface-700'">
            <i class="fas fa-plus-circle mr-1.5"></i>Pesan Guru
        </button>
    </div>

    <!-- Inbox -->
    <template x-if="activeTab === 'inbox'">
        <div class="bg-white rounded-2xl shadow-lg shadow-surface-200/40 p-6 border border-surface-100">
            <h3 class="font-extrabold text-surface-800 mb-4"><i class="fas fa-bullhorn text-primary-500 mr-2"></i>Pengumuman & Balasan</h3>
            <template x-if="loading"><div class="text-center py-8 text-surface-400"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat...</div></template>
            <template x-if="!loading && inboxMessages.length === 0"><div class="text-center py-8 text-surface-400">Tidak ada pesan</div></template>
            <div class="space-y-3">
                <template x-for="n in inboxMessages" :key="n.id">
                    <div class="p-4 rounded-xl bg-surface-50 border" :class="n.read ? 'border-surface-100' : 'border-l-4 border-l-primary-500 bg-primary-50/30'">
                        <div class="flex items-start justify-between">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2">
                                    <template x-if="!n.read"><span class="w-2 h-2 rounded-full bg-primary-500 shrink-0"></span></template>
                                    <p class="font-bold text-surface-800" x-text="n.title"></p>
                                </div>
                                <p class="text-sm text-surface-600 mt-1 whitespace-pre-wrap" x-text="n.message"></p>
                                <p class="text-[10px] font-medium text-surface-400 mt-1" x-text="'Dari: ' + (n.sender_role || '-')"></p>
                            </div>
                            <span class="text-[10px] font-medium text-surface-400 whitespace-nowrap ml-3" x-text="n.created_at"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <!-- Sent Messages -->
    <template x-if="activeTab === 'sent'">
        <div class="bg-white rounded-2xl shadow-lg shadow-surface-200/40 p-6 border border-surface-100">
            <h3 class="font-extrabold text-surface-800 mb-4"><i class="fas fa-paper-plane text-primary-500 mr-2"></i>Pesan Terkirim</h3>
            <template x-if="loading"><div class="text-center py-8 text-surface-400"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat...</div></template>
            <template x-if="!loading && sentMessages.length === 0"><div class="text-center py-8 text-surface-400">Belum ada pesan terkirim</div></template>
            <div class="space-y-3">
                <template x-for="n in sentMessages" :key="n.id">
                    <div class="p-4 rounded-xl bg-surface-50 border border-surface-100">
                        <template x-if="editingId === n.id">
                            <div class="space-y-3">
                                <input type="text" x-model="editTitle" class="w-full px-4 py-2.5 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 text-surface-700 font-medium text-sm">
                                <textarea x-model="editMessage" rows="3" class="w-full px-4 py-2.5 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 text-surface-700 text-sm"></textarea>
                                <div class="flex gap-2">
                                    <button @click="saveEdit()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-xs">Simpan</button>
                                    <button @click="cancelEdit()" class="px-4 py-2 border border-surface-200 rounded-lg font-bold text-xs text-surface-600 hover:bg-surface-100">Batal</button>
                                </div>
                            </div>
                        </template>
                        <template x-if="editingId !== n.id">
                            <div class="flex items-start justify-between">
                                <div class="flex-1 min-w-0">
                                    <p class="font-bold text-surface-800" x-text="n.title"></p>
                                    <p class="text-sm text-surface-600 mt-1 whitespace-pre-wrap" x-text="n.message"></p>
                                </div>
                                <div class="flex items-center gap-2 ml-3 shrink-0">
                                    <button @click="startEdit(n)" class="text-xs text-primary-600 hover:text-primary-800 font-bold"><i class="fas fa-edit"></i></button>
                                    <button @click="deleteMsg(n)" class="text-xs text-red-500 hover:text-red-700 font-bold"><i class="fas fa-trash"></i></button>
                                    <span class="text-[10px] font-medium text-surface-400 whitespace-nowrap" x-text="n.created_at"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <!-- New Message to Teacher -->
    <template x-if="activeTab === 'new'">
        <div class="bg-white rounded-2xl shadow-lg shadow-surface-200/40 p-6 border border-surface-100">
            <h3 class="font-extrabold text-surface-800 mb-4"><i class="fas fa-chalkboard-teacher text-primary-500 mr-2"></i>Pesan Guru</h3>
            <form @submit.prevent="sendToTeacher()" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Pilih Guru</label>
                    <select x-model="selectedTeacher" required class="w-full px-4 py-3 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 text-surface-700 font-medium bg-white">
                        <option value="">- Pilih Guru -</option>
                        <template x-for="t in teachers" :key="t.id">
                            <option :value="t.id" x-text="t.full_name"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Judul</label>
                    <input type="text" x-model="msgTitle" required class="w-full px-4 py-3 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 text-surface-700 font-medium">
                </div>
                <div>
                    <label class="block text-sm font-bold text-surface-700 mb-1.5">Pesan</label>
                    <textarea x-model="msgMessage" required rows="4" class="w-full px-4 py-3 border border-surface-200 rounded-xl focus:ring-2 focus:ring-primary-500 text-surface-700 font-medium"></textarea>
                </div>
                <button type="submit" class="px-6 py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-bold shadow-lg transition" :disabled="sending">
                    <span x-text="sending ? 'Mengirim...' : 'Kirim ke Guru'"></span>
                </button>
                <p x-show="sendMsg" class="text-xs font-bold" :class="sendMsg.includes('Terkirim') ? 'text-emerald-600' : 'text-red-600'" x-text="sendMsg"></p>
            </form>
        </div>
    </template>
</div>
{% endblock %}
