{% extends "base.html" %}
{% block title %}Pesan & Pengumuman - ScanGrade{% endblock %}
{% block page_title %}Pesan & Pengumuman{% endblock %}
{% block content %}
<div class="space-y-4" x-data="{
    activeTab: 'convs',

    // Kontak (siapa yang bisa diajak percakapan sesuai RBAC)
    contacts: [], contactsLoading: true,
    activeConv: null, replyMessage: '', replying: false, replyError: '',
    searchContact: '',
    editingMsgId: null, editMsgText: '',
    convMenuOpen: false, msgMenuId: null,
    pollTimer: null,
    pendingRecipient: null,

    // Pengumuman
    notifs: [], notifsLoading: true,

    get filteredContacts() {
        var q = (this.searchContact || '').toLowerCase();
        if (!q) return this.contacts;
        return this.contacts.filter(function(c) { return (c.full_name||'').toLowerCase().includes(q); });
    },

    refreshBadge() { window.dispatchEvent(new CustomEvent('sg:unread')); },

    // CRUD Kontak & Percakapan
    fetchContacts() {
        this.contactsLoading = true;
        fetch('/api/broadcast/contacts').then(function(r){return r.json();}).then(function(d) {
            this.contacts = d.contacts || [];
            if (this.activeConv) {
                var upd = this.contacts.find(function(c){return c.conversation_id===this.activeConv.id;}.bind(this));
                if (upd) { this.activeConv.other_name = upd.full_name; }
            }
        }.bind(this)).catch(function(){}).finally(function(){this.contactsLoading=false;}.bind(this));
    },
    scrollBottom() { var el = this.$el.querySelector('.chat-scroll'); if (el) el.scrollTop = el.scrollHeight; },
    startChat(contact) {
        if (contact.conversation_id) {
            this.openConv(contact);
        } else {
            this.pendingRecipient = {id: contact.id, name: contact.full_name, role: contact.role};
        }
    },
    openConv(contact) {
        var cid = contact.conversation_id;
        if (!cid) return;
        this.activeConv = contact; this.replyMessage=''; this.replyError=''; this.editingMsgId=null;
        this.$nextTick(function(){this.scrollBottom();}.bind(this)); this.startPoll();
        fetch('/api/broadcast/mark-read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid})})
        .then(function(){this.refreshBadge();}.bind(this)).catch(function(){});
        // fetch full conversation data
        fetch('/api/broadcast/conversations').then(function(r){return r.json();}).then(function(d) {
            var found = (d.conversations||[]).find(function(c){return c.id===cid;});
            if (found) {
                this.activeConv = Object.assign(this.activeConv, found);
                this.$nextTick(function(){this.scrollBottom();}.bind(this));
            }
        }.bind(this));
    },
    startPoll() { this.stopPoll(); this.pollTimer = setInterval(function(){this.fetchContacts();}.bind(this), 5000); },
    stopPoll() { if (this.pollTimer) { clearInterval(this.pollTimer); this.pollTimer = null; } },

    // Create (via reply)
    sendReply() {
        if (!this.replyMessage) return;
        if(this.pendingRecipient) {
            this.replying = true; this.replyError = '';
            var body = JSON.stringify({title: this.replyMessage, message: this.replyMessage, target_role: this.pendingRecipient.role, recipient_ids: [this.pendingRecipient.id]});
            fetch('/api/broadcast/send',{method:'POST',headers:{'Content-Type':'application/json'},body:body})
            .then(function(r){return r.json();}).then(function(d) {
                this.replying=false;
                if(d.success){
                    var name = this.pendingRecipient.name;
                    var role = this.pendingRecipient.role;
                    this.replyMessage='';this.pendingRecipient=null;
                    this.fetchContacts();this.refreshBadge();
                    var cid = d.conversation_id;
                    if (cid) { this.openConv({conversation_id: cid, other_name: name, other_role: role}); }
                }
                else{this.replyError=d.error||'Gagal';}
            }.bind(this)).catch(function(){this.replying=false;this.replyError='Gagal terhubung';}.bind(this));
        } else if (this.activeConv) {
            var cid = this.activeConv.conversation_id || this.activeConv.id;
            if(!cid) return;
            this.replying = true; this.replyError = '';
            fetch('/api/broadcast/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid,message:this.replyMessage})})
            .then(function(r){return r.json();}).then(function(d) {
                if (d.success) {
                    this.replyMessage='';
                    this.fetchContacts();
                    this.refreshBadge();
                    var cid = this.activeConv.conversation_id || this.activeConv.id;
                    fetch('/api/broadcast/conversations').then(function(r){return r.json();}).then(function(d2) {
                        var found = (d2.conversations||[]).find(function(c){return c.id===cid;});
                        if (found) { this.activeConv = Object.assign(this.activeConv, found); this.$nextTick(function(){this.scrollBottom();}.bind(this)); }
                    }.bind(this));
                }
                else { this.replyError=d.error||'Gagal'; }
            }.bind(this)).catch(function(){this.replyError='Gagal terhubung';}.bind(this)).finally(function(){this.replying=false;}.bind(this));
        }
    },

    // Update: edit own message (2 min)
    canEdit(m) {
        if (!m.is_mine || m.is_deleted) return false;
        try { return (new Date() - new Date(m.created_at)) < 120000; } catch(e){ return false; }
    },
    startEdit(m) { this.editingMsgId=m.id; this.editMsgText=m.message; },
    cancelEdit() { this.editingMsgId=null; this.editMsgText=''; },
    saveEditMsg() {
        if (!this.editMsgText||!this.editingMsgId) return;
        fetch('/api/broadcast/edit-message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notification_id:this.editingMsgId,message:this.editMsgText})})
        .then(function(r){return r.json();}).then(function(d){if(d.success){this.cancelEdit();this.fetchContacts();}}.bind(this));
    },

    // Delete: unsend (own, 2 min)
    unsendMsg(m) {
        if (!confirm('Hapus pesan ini untuk semua orang?')) return;
        fetch('/api/broadcast/unsend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notification_id:m.id})})
        .then(function(r){return r.json();}).then(function(d){if(d.success){this.msgMenuId=null;this.fetchContacts();}else{alert(d.error);}}.bind(this));
    },
    deleteForMe(m) {
        fetch('/api/broadcast/delete-for-me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notification_id:m.id})})
        .then(function(r){return r.json();}).then(function(d){if(d.success){this.msgMenuId=null;this.fetchContacts();}}.bind(this));
    },
    deleteConv() {
        if (!confirm('Hapus percakapan ini dari daftar Anda?')) return;
        var cid = this.activeConv.id || this.activeConv.conversation_id;
        fetch('/api/broadcast/conversation/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid})})
        .then(function(r){return r.json();}).then(function(d){if(d.success){this.convMenuOpen=false;this.activeConv=null;this.stopPoll();this.fetchContacts();}}.bind(this));
    },
    toggleConvMenu() { this.convMenuOpen = !this.convMenuOpen; },
    closeConvMenu() { this.convMenuOpen = false; },
    toggleMsgMenu(id) { this.msgMenuId = this.msgMenuId===id ? null : id; },

    completeConv() {
        if (!this.activeConv||!confirm('Selesaikan percakapan ini?')) return;
        var cid = this.activeConv.id || this.activeConv.conversation_id;
        fetch('/api/broadcast/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid})})
        .then(function(r){return r.json();}).then(function(d){if(d.success){this.activeConv.status='completed';this.fetchContacts();}}.bind(this));
    },

    // Pengumuman
    fetchNotifs() {
        this.notifsLoading = true;
        fetch('/api/broadcast/list?type=received').then(function(r){return r.json();}).then(function(d) {
            this.notifs = d.notifications || [];
            this.$nextTick(function(){this.markRead();}.bind(this));
        }.bind(this)).catch(function(){}).finally(function(){this.notifsLoading=false;}.bind(this));
    },
    markRead() {
        fetch('/api/broadcast/mark-read-all',{method:'POST'}).then(function(){this.notifs.forEach(function(n){n.read=true;});this.refreshBadge();}.bind(this)).catch(function(){});
    },
}" x-init="fetchContacts(); fetchNotifs(); $watch('activeTab',function(v){if(v==='inbox')this.markRead();}.bind(this))">
    <!-- Tab Nav -->
    <div class="flex gap-1 bg-surface-100 rounded-xl p-1">
        <button @click="activeTab='convs'; activeConv=null; stopPoll()" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition" :class="activeTab==='convs'?'bg-white text-primary-600 shadow-sm':'text-surface-500 hover:text-surface-700'"><i class="fas fa-comments mr-1.5"></i>Percakapan</button>
        <button @click="activeTab='inbox'; activeConv=null; stopPoll()" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition" :class="activeTab==='inbox'?'bg-white text-primary-600 shadow-sm':'text-surface-500 hover:text-surface-700'"><i class="fas fa-bullhorn mr-1.5"></i>Pengumuman</button>
    </div>

    <!-- PERCAKAPAN -->
    <template x-if="activeTab === 'convs'">
        <div class="bg-white overflow-hidden border border-surface-200" style="height: min(80vh, 700px);">
            <div class="flex h-full">
                <div class="w-72 lg:w-80 border-r border-surface-200 flex flex-col shrink-0" :class="activeConv||pendingRecipient?'hidden md:flex':'flex'">
                    <div class="px-4 py-3 bg-surface-50 border-b border-surface-200 flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-emerald-500 to-emerald-600 flex items-center justify-center text-white font-bold text-sm shrink-0">{{ (g.user_name or 'M')[:1]|upper }}</div>
                        <span class="font-bold text-surface-800 text-sm truncate">{{ g.user_name or 'Murid' }}</span>
                        <button @click="fetchContacts()" class="text-surface-400 hover:text-primary-600 transition p-1 ml-auto" title="Refresh"><i class="fas fa-sync-alt text-xs"></i></button>
                    </div>
                    <div class="px-4 py-2 bg-surface-50">
                        <div class="relative">
                            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-surface-400 text-xs"></i>
                            <input type="text" x-model="searchContact" placeholder="Cari kontak..." class="w-full pl-8 pr-3 py-2 bg-white border border-surface-200 rounded-lg text-xs focus:ring-1 focus:ring-primary-400 outline-none text-surface-700 placeholder-surface-400">
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto divide-y divide-surface-100">
                        <template x-for="c in filteredContacts" :key="c.id">
                            <div @click="startChat(c)" class="flex items-center gap-3 px-4 py-3 cursor-pointer transition" :class="activeConv&&(activeConv.id===c.conversation_id||activeConv.conversation_id===c.conversation_id)?'bg-surface-100':'hover:bg-surface-50'">
                                <div class="relative shrink-0">
                                    <div class="w-11 h-11 rounded-full flex items-center justify-center text-white font-bold text-sm" :class="c.role==='guru'?'bg-gradient-to-br from-amber-400 to-amber-600':(c.role==='admin_sekolah'||c.role==='super_admin'?'bg-gradient-to-br from-purple-400 to-purple-600':'bg-gradient-to-br from-blue-400 to-blue-600')">
                                        <span x-text="(c.full_name||'?')[0].toUpperCase()"></span>
                                    </div>
                                    <span x-show="c.unread_count>0" class="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 rounded-full bg-emerald-500 border-2 border-white"></span>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center justify-between">
                                        <span class="font-semibold text-surface-800 text-sm truncate" x-text="c.full_name"></span>
                                        <span class="text-[10px] text-surface-400 shrink-0 ml-2" x-text="c.last_message_at?c.last_message_at.slice(11,16):''"></span>
                                    </div>
                                    <div class="flex items-center gap-1.5 mt-0.5">
                                        <span class="text-xs text-surface-500 truncate"><span x-text="c.last_msg_preview||'Belum ada pesan'"></span></span>
                                        <template x-if="c.unread_count>0">
                                            <span class="shrink-0 bg-emerald-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full leading-none min-w-[18px] text-center" x-text="c.unread_count"></span>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template x-if="!contactsLoading&&filteredContacts.length===0">
                            <div class="flex flex-col items-center justify-center py-16 text-surface-400 px-4">
                                <i class="fas fa-comments text-4xl mb-3 text-surface-200"></i>
                                <p class="text-sm font-medium">Belum ada kontak</p>
                                <p class="text-xs mt-1">Tidak ada pengguna yang dapat dihubungi</p>
                            </div>
                        </template>
                        <template x-if="contactsLoading">
                            <div class="flex items-center justify-center py-16 text-surface-400"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat...</div>
                        </template>
                    </div>
                </div>

                <div class="flex-1 flex flex-col" :class="!activeConv&&!pendingRecipient?'hidden md:flex':'flex'">
                    <template x-if="!activeConv && !pendingRecipient">
                        <div class="flex flex-col items-center justify-center h-full bg-surface-50 text-surface-400 px-6">
                            <div class="w-20 h-20 rounded-full bg-surface-100 flex items-center justify-center mb-4"><i class="fas fa-comments text-3xl text-surface-300"></i></div>
                            <p class="font-bold text-surface-500 text-lg">ScanGrade Chat</p>
                            <p class="text-sm mt-1 text-center">Pilih percakapan dari samping</p>
                        </div>
                    </template>
                    <template x-if="activeConv || pendingRecipient">
                        <div class="flex flex-col h-full">
                            <template x-if="activeConv">
                            <div class="px-4 py-3 bg-surface-50 border-b border-surface-200 flex items-center gap-3 shrink-0">
                                <button @click="activeConv=null;stopPoll()" class="md:hidden text-surface-500 hover:text-primary-600 mr-1"><i class="fas fa-arrow-left"></i></button>
                                <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm shrink-0" :class="activeConv.other_role==='guru'?'bg-gradient-to-br from-amber-400 to-amber-600':(activeConv.other_role==='admin_sekolah'||activeConv.other_role==='super_admin'?'bg-gradient-to-br from-purple-400 to-purple-600':'bg-gradient-to-br from-blue-400 to-blue-600')">
                                    <span x-text="(activeConv.other_name||'?')[0].toUpperCase()"></span>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="font-semibold text-surface-800 text-sm truncate" x-text="activeConv.other_name"></p>
                                    <p class="text-[11px]" :class="activeConv.status==='open'?'text-emerald-600':'text-surface-400'" x-text="activeConv.status==='open'?'Online':'Selesai'"></p>
                                </div>
                                <template x-if="activeConv.status==='open'">
                                    <button @click="completeConv()" class="text-surface-400 hover:text-emerald-600 transition p-1" title="Selesaikan"><i class="fas fa-check-double text-sm"></i></button>
                                </template>
                                <div class="relative" @click.outside="closeConvMenu()">
                                    <button @click="toggleConvMenu()" class="text-surface-400 hover:text-primary-600 transition p-1" title="Lainnya"><i class="fas fa-ellipsis-v text-sm"></i></button>
                                    <template x-if="convMenuOpen">
                                        <div class="absolute right-0 top-full mt-1 bg-white border border-surface-200 rounded-xl shadow-xl py-1 z-50 min-w-[160px]">
                                            <button @click="deleteConv()" class="w-full flex items-center gap-2 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition"><i class="fas fa-trash-alt text-xs"></i>Hapus</button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                            </template>
                            <template x-if="!activeConv && pendingRecipient">
                                <div class="px-4 py-3 bg-surface-50 border-b border-surface-200 flex items-center gap-3 shrink-0">
                                    <button @click="pendingRecipient=null" class="md:hidden text-surface-500 hover:text-primary-600 mr-1"><i class="fas fa-arrow-left"></i></button>
                                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm shrink-0" :class="pendingRecipient.role==='guru'?'bg-gradient-to-br from-amber-400 to-amber-600':'bg-gradient-to-br from-purple-400 to-purple-600'">
                                        <span x-text="(pendingRecipient.name||'?')[0].toUpperCase()"></span>
                                    </div>
                                    <div class="flex-1 min-w-0"><p class="font-semibold text-surface-800 text-sm truncate" x-text="pendingRecipient.name"></p><p class="text-[11px] text-emerald-600">Online</p></div>
                                </div>
                            </template>
                            <div class="flex-1 overflow-y-auto p-4 chat-scroll bg-[#efeae2] space-y-1" style="background-image: url('data:image/svg+xml,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;200&quot; height=&quot;200&quot; opacity=&quot;0.06&quot;><rect width=&quot;200&quot; height=&quot;200&quot; fill=&quot;%23efeae2&quot;/><path d=&quot;M0 0l200 200M200 0L0 200&quot; stroke=&quot;%238d6e5c&quot; stroke-width=&quot;0.5&quot;/></svg>')">
                                <template x-if="activeConv">
                                    <div>
                                        <template x-for="(m, idx) in activeConv.messages" :key="m.id">
                                            <div class="flex items-end gap-1.5 mb-1" :class="m.is_mine?'justify-end':'justify-start'">
                                                <template x-if="!m.is_mine">
                                                    <div class="w-7 h-7 rounded-full flex items-center justify-center text-white font-bold text-[10px] shrink-0 mb-0.5" :class="activeConv.other_role==='guru'?'bg-gradient-to-br from-amber-400 to-amber-600':(activeConv.other_role==='admin_sekolah'||activeConv.other_role==='super_admin'?'bg-gradient-to-br from-purple-400 to-purple-600':'bg-gradient-to-br from-blue-400 to-blue-600')">
                                                        <span x-text="(activeConv.other_name||'?')[0].toUpperCase()"></span>
                                                    </div>
                                                </template>
                                                <div class="max-w-[75%] md:max-w-[65%] group relative">
                                                    <template x-if="editingMsgId===m.id">
                                                        <div class="bg-white rounded-2xl rounded-br-sm border border-primary-300 p-2 shadow-sm">
                                                            <textarea x-model="editMsgText" rows="2" class="w-full px-2 py-1 border-0 focus:ring-0 text-sm resize-none outline-none"></textarea>
                                                            <div class="flex gap-1.5 mt-1 justify-end">
                                                                <button @click="cancelEdit()" class="text-[10px] font-bold text-surface-500 px-2 py-1 rounded-lg hover:bg-surface-100">Batal</button>
                                                                <button @click="saveEditMsg()" class="text-[10px] font-bold text-white bg-primary-600 px-2.5 py-1 rounded-lg hover:bg-primary-700">Simpan</button>
                                                            </div>
                                                        </div>
                                                    </template>
                                                    <template x-if="editingMsgId!==m.id">
                                                        <div class="relative">
                                                            <div :class="m.is_mine?'bg-[#dcf8c6] text-[#111b21] rounded-2xl rounded-br-sm shadow-sm':'bg-white text-surface-800 rounded-2xl rounded-bl-sm shadow-sm border border-surface-100'">
                                                                    <div class="px-3 pt-2 pb-1">
                                                                        <div class="text-sm leading-relaxed whitespace-pre-wrap" x-html="linkify(m.message)"></div>
                                                                        <div class="flex items-center gap-1 justify-end -mt-0.5">
                                                                            <span class="text-[11px] text-[#667781]" x-text="m.created_at?m.created_at.slice(11,16):''"></span>
                                                                            <template x-if="m.is_mine">
                                                                                <i class="fas fa-check-double text-[11px]" :class="idx===activeConv.messages.length-1?'text-[#53bdeb]':'text-[#8696a0]'"></i>
                                                                            </template>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            <div class="flex gap-0.5 absolute -top-1.5 -right-1.5 z-10 opacity-0 group-hover:opacity-100 transition">
                                                                <div class="relative" @click.outside="if(msgMenuId===m.id)msgMenuId=null">
                                                                    <button @click="toggleMsgMenu(m.id)" class="w-5 h-5 rounded-full bg-white shadow border border-surface-200 flex items-center justify-center text-surface-400 hover:text-primary-600"><i class="fas fa-chevron-down text-[8px]"></i></button>
                                                                    <template x-if="msgMenuId===m.id">
                                                                        <div class="absolute right-0 top-full mt-0.5 bg-white border border-surface-200 rounded-xl shadow-xl py-1 z-50 min-w-[130px]">
                                                                            <template x-if="m.is_mine"><button @click="unsendMsg(m)" class="w-full flex items-center gap-2 px-3 py-2 text-xs text-red-600 hover:bg-red-50"><i class="fas fa-undo-alt text-[10px]"></i>Unsend</button></template>
                                                                            <button @click="deleteForMe(m)" class="w-full flex items-center gap-2 px-3 py-2 text-xs text-surface-600 hover:bg-surface-50"><i class="fas fa-eye-slash text-[10px]"></i>Sembunyikan</button>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                                <template x-if="canEdit(m)">
                                                                    <button @click="startEdit(m)" class="w-5 h-5 rounded-full bg-white shadow border border-surface-200 flex items-center justify-center text-surface-400 hover:text-primary-600"><i class="fas fa-pen text-[8px]"></i></button>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="!activeConv || !activeConv.messages||activeConv.messages.length===0">
                                    <div class="flex items-center justify-center h-full"><p class="text-xs text-surface-400">Belum ada pesan. Kirim pesan pertama!</p></div>
                                </template>
                            </div>
                            <div class="px-3 md:px-4 py-3 bg-surface-50 border-t border-surface-200 shrink-0">
                                <div class="flex items-end gap-2 bg-white rounded-xl border border-surface-200 px-3 py-2">
                                    <button class="text-surface-400 hover:text-primary-600 transition shrink-0 p-1" title="Lampirkan"><i class="fas fa-paperclip text-lg"></i></button>
                                    <textarea x-model="replyMessage" rows="1" class="flex-1 border-0 focus:ring-0 text-surface-700 text-sm resize-none outline-none max-h-24" placeholder="Ketik pesan..." @keydown.enter.prevent="sendReply()"></textarea>
                                    <button @click="sendReply()" class="w-10 h-10 rounded-full bg-primary-600 hover:bg-primary-700 text-white flex items-center justify-center shrink-0 transition disabled:opacity-50 shadow-sm" :disabled="replying||!replyMessage"><i class="fas fa-paper-plane text-sm"></i></button>
                                </div>
                                <p x-show="replyError" class="text-xs text-red-500 mt-1" x-text="replyError"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <!-- PENGUMUMAN -->
    <template x-if="activeTab === 'inbox'">
        <div class="bg-white rounded-2xl shadow-lg border border-surface-100 p-6">
            <h3 class="font-extrabold text-surface-800 mb-4"><i class="fas fa-bullhorn text-primary-500 mr-2"></i>Pengumuman</h3>
            <template x-if="notifsLoading"><div class="text-center py-8 text-surface-400"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat...</div></template>
            <template x-if="!notifsLoading&&notifs.length===0"><div class="text-center py-8 text-surface-400">Tidak ada pengumuman</div></template>
            <div class="divide-y divide-surface-100">
                <template x-for="n in notifs" :key="n.id">
                    <div class="py-4 flex items-start gap-3">
                        <div class="w-10 h-10 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center shrink-0"><i class="fas fa-bullhorn text-sm"></i></div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2"><span x-show="!n.read" class="w-2 h-2 rounded-full bg-primary-500 shrink-0"></span><p class="font-bold text-surface-800 text-sm" x-text="n.title||'Pengumuman'"></p></div>
                            <p class="text-sm text-surface-600 mt-1 whitespace-pre-wrap" x-html="linkify(n.message)"></p>
                            <p class="text-[10px] text-surface-400 mt-1">Dari: <span x-text="n.sender_role||'-'"></span> &middot; <span x-text="n.created_at||''"></span></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>

</div>
{% endblock %}
