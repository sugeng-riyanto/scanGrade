{% extends "base.html" %}
{% block title %}Papan Tulis - {{ whiteboard.title }}{% endblock %}
{% block content %}
<div class="h-screen flex flex-col" x-data="studentCanvas()" x-init="init()">
    <!-- Top bar -->
    <div class="flex items-center justify-between px-3 py-1.5 border-b bg-white dark:bg-gray-900 shrink-0">
        <div class="flex items-center gap-2">
            <a href="/wb/student/whiteboard" class="text-gray-500 hover:text-gray-700 text-sm">&larr;</a>
            <span class="font-bold text-sm truncate max-w-[160px]">{{ whiteboard.title }}</span>
            <span id="focus-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-green-100 text-green-700">&#9679; Fokus</span>
        </div>
        <div class="flex items-center gap-1.5">
            <div id="timer" class="font-mono font-bold text-[10px] px-1.5 py-0.5 rounded bg-gray-100">00:00</div>
            <button @click="downloadPDF()" class="text-[10px] font-bold px-1.5 py-0.5 rounded border border-gray-200 text-gray-600 hover:bg-gray-50"><i class="fas fa-download"></i></button>
            <button @click="requestAnnotate()" x-show="!canAnnotate && !requested" class="text-[10px] font-bold px-2 py-0.5 rounded bg-primary-500 text-white"><i class="fas fa-pen"></i> Minta Izin</button>
            <span x-show="requested && !canAnnotate" class="text-[10px] text-yellow-700 bg-yellow-50 px-2 py-0.5 rounded-full">Menunggu...</span>
            <span x-show="canAnnotate" class="text-[10px] text-green-700 bg-green-50 px-2 py-0.5 rounded-full">&#10003; Menganotasi</span>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <!-- Toolbar (hanya jika diizinkan) -->
        <div x-show="canAnnotate" class="hidden md:flex flex-col bg-white dark:bg-gray-900 border-r py-1 px-0.5 gap-0.5 shrink-0 overflow-y-auto w-11">
            <button @click="setTool('pen')" :class="t==='pen'?'bg-primary-100 text-primary-600':'text-gray-500 hover:bg-primary-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-xs" title="Pena"><i class="fas fa-pen"></i></button>
            <button @click="setTool('line')" :class="t==='line'?'bg-primary-100 text-primary-600':'text-gray-500 hover:bg-primary-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-xs" title="Garis"><i class="fas fa-minus"></i></button>
            <button @click="setTool('eraser')" :class="t==='eraser'?'bg-primary-100 text-primary-600':'text-gray-500 hover:bg-primary-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-xs" title="Hapus"><i class="fas fa-eraser"></i></button>
            <button @click="enableText()" :class="t==='text'?'bg-primary-100 text-primary-600':'text-gray-500 hover:bg-primary-50'" class="w-9 h-9 rounded-lg flex items-center justify-center text-xs" title="Teks"><i class="fas fa-font"></i></button>
            <hr class="w-5 border-t my-0.5 mx-auto">
            <input type="color" x-model="col" @input="c?.setColor(col)" class="w-6 h-6 rounded cursor-pointer border-0 p-0 mx-auto" title="Warna">
            <button @click="c?.undo()" class="w-9 h-9 rounded-lg flex items-center justify-center text-xs text-gray-500 hover:bg-primary-50" title="Undo"><i class="fas fa-undo"></i></button>
            <button @click="c?.redo()" class="w-9 h-9 rounded-lg flex items-center justify-center text-xs text-gray-500 hover:bg-primary-50" title="Redo"><i class="fas fa-redo"></i></button>
        </div>

        <!-- Canvas -->
        <div class="flex-1 relative overflow-hidden p-2" style="background:linear-gradient(135deg,#eef2ff 0%,#f0f9ff 30%,#faf5ff 70%,#fef2f2 100%)">
            <div class="w-full h-full rounded-2xl shadow-xl bg-white overflow-hidden relative">
                <div id="wb-stage" style="width:2000px;height:2000px;position:relative">
                    <canvas id="wb-canvas" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas>
                    <div class="absolute bottom-2 left-1/2 -translate-x-1/2 bg-black/50 text-white text-[9px] px-2 py-0.5 rounded-full pointer-events-none">Slide <span x-text="slideIdx+1"></span>/<span x-text="slides.length"></span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile bottom bar (jika diizinkan) -->
    <div x-show="canAnnotate" class="md:hidden bg-white dark:bg-gray-900 border-t flex items-center justify-around py-1 px-1 shrink-0 overflow-x-auto">
        <button @click="setTool('pen')" :class="t==='pen'?'text-primary-600':'text-gray-500'" class="flex flex-col items-center px-2 py-0.5 text-[9px]"><i class="fas fa-pen text-sm"></i><span>Pena</span></button>
        <button @click="setTool('eraser')" :class="t==='eraser'?'text-primary-600':'text-gray-500'" class="flex flex-col items-center px-2 py-0.5 text-[9px]"><i class="fas fa-eraser text-sm"></i><span>Hapus</span></button>
        <button @click="enableText()" :class="t==='text'?'text-primary-600':'text-gray-500'" class="flex flex-col items-center px-2 py-0.5 text-[9px]"><i class="fas fa-font text-sm"></i><span>Teks</span></button>
        <button @click="c?.undo()" class="flex flex-col items-center px-2 py-0.5 text-[9px] text-gray-500"><i class="fas fa-undo text-sm"></i><span>Undo</span></button>
        <button @click="c?.redo()" class="flex flex-col items-center px-2 py-0.5 text-[9px] text-gray-500"><i class="fas fa-redo text-sm"></i><span>Redo</span></button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/vendor/socket.io.min.js"></script>
<script src="/static/js/tools.js"></script>
<script src="/static/js/whiteboard-canvas.js"></script>
<script src="/static/js/whiteboard-websocket.js"></script>
<script src="/static/js/whiteboard-timer.js"></script>
<script>
function studentCanvas() {
    return {
        whiteboardId: "{{ whiteboard.id }}",
        slides: {{ slides | tojson | safe }},
        slideIdx: 0, t: "pen", col: "#000000", pw: 0.75,
        canAnnotate: false, requested: false,
        boardMode: "white", g: false, gridSpacing: 50, gridLog: false,
        c: null, ws: null, timer: null,

        init() {
            this.c = new WhiteboardCanvas("wb-canvas", {
                whiteboardId: this.whiteboardId,
                onDraw: (op) => { if (this.canAnnotate) this.ws?.sendDraw(op.op_type, op.data); },
            });
            this.c.setBoardMode('white'); this.c.setWidth(this.pw);

            // Check if can annotate
            fetch(`/wb/student/api/whiteboard/${this.whiteboardId}/can-annotate`).then(r=>r.json()).then(d=>{this.canAnnotate=d.can_annotate;}).catch(()=>{});

            this.ws = new WhiteboardSocket(this.whiteboardId, {
                onConnect: () => { this.ws?.sendHeartbeat(); },
                onDrawOp: (data) => { this.c.replayOp(data); },
                onSlideChanged: (data) => { this.goToSlide(data.slide_number-1); },
                onTimerUpdate: (data) => { this.timer?.syncRemote(data.seconds, data.running); },
                onDisplaySettingsUpdate: (data) => {
                    if(data.board_mode){ this.boardMode=data.board_mode; this.c.setBoardMode(data.board_mode); }
                    if(data.grid_enabled!==undefined){ this.g=data.grid_enabled; this.c.gridEnabled=data.g; }
                    this.c._render();
                },
                onAnnotateApproved: (data) => { if(data.student_id===this.whiteboardId||data.student_id==="{{ g.user_id }}"){ this.canAnnotate=true; this.requested=false; }},
                onAnnotateRevoked: (data) => { if(data.student_id==="{{ g.user_id }}"){ this.canAnnotate=false; }},
            });
            this.ws.connect();
            this.timer = new WhiteboardTimer("timer");

            // Anti-cheat tracking
            document.addEventListener("visibilitychange", () => {
                const s = document.hidden ? "hidden" : "visible";
                this.ws.sendFocusStatus(s);
                if (document.hidden) {
                    fetch(`/wb/student/api/whiteboard/${this.whiteboardId}/anti-cheat`, {
                        method:"POST", headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({event_type:"visibility",event_data:{status:"hidden"}}),
                    }).catch(()=>{});
                }
            });
            if (this.slides.length > 0) this.loadSlide(this.slides[0]);
        },
        setTool(t) { this.t=t; if(t==='laser'){this.c.setTool('laser');return;} if(t==='text')return; this.c.setTool(t); },
        enableText() { this.t="text"; this.c.enableTextMode(); },
        loadSlide(sl) { this.c.setBackground(sl.background_url||null); fetch(`/wb/student/api/whiteboard/${this.whiteboardId}/ops?slide=${sl.slide_number}`).then(r=>r.json()).then(d=>{if(d.ops)this.c.loadOps(d.ops);}).catch(()=>{}); },
        goToSlide(i) { if(i<0||i>=this.slides.length)return; this.slideIdx=i; this.loadSlide(this.slides[i]); },
        requestAnnotate() { this.requested=true; this.ws.requestAnnotate("{{ g.user_id }}", "{{ g.user_name|default('Murid') }}"); },
        downloadPDF() { window.open(`/wb/student/whiteboard/${this.whiteboardId}/download`,'_blank'); },
    };
}
</script>
{% endblock %}
