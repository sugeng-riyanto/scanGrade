{% extends "base.html" %}
{% block title %}Error - ScanGrade{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="text-center max-w-md">
        <div class="w-20 h-20 mx-auto mb-4 rounded-2xl bg-red-50 flex items-center justify-center">
            <i class="fas fa-exclamation-triangle text-3xl text-red-500"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-surface-800 mb-2">Terjadi Kesalahan</h1>
        <p class="text-sm text-surface-500 mb-6">Maaf, terjadi kesalahan server. Tim kami sedang menangani masalah ini.</p>
        <div class="flex items-center justify-center gap-3">
            <a href="/" class="px-5 py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-bold text-sm shadow-lg transition">
                <i class="fas fa-home mr-1"></i>Kembali ke Beranda
            </a>
            <button onclick="location.reload()" class="px-5 py-2.5 bg-surface-100 hover:bg-surface-200 text-surface-600 rounded-xl font-bold text-sm transition">
                <i class="fas fa-redo mr-1"></i>Coba Lagi
            </button>
        </div>
    </div>
</div>
{% endblock %}
